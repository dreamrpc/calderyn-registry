<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | Calderyn College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08070a;--ink-2:#0d0b11;--panel:#14111a;--panel-2:#1b1722;
  --line:rgba(201,162,74,.34);--line-soft:rgba(231,212,160,.12);
  --gold:#C9A24A;--gold-bright:#F2D584;--gold-deep:#9c7a32;
  --red:#8E121C;--red-bright:#D11F2A;--blue:#2B6CB0;
  --cream:#F4ECD8;--paper:#FBF4E0;--muted:#a89b7d;--muted-2:#897d62;--ink-stroke:#000;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{
  background:var(--ink);color:var(--cream);
  font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 80% at 50% -10%,rgba(142,18,28,.28),transparent 55%),
    radial-gradient(90% 60% at 100% 100%,rgba(43,108,176,.10),transparent 60%),
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.16) 3px,transparent 4px);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px}
.eyebrow{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(8,7,10,.9);backdrop-filter:blur(14px);border-bottom:2px solid var(--gold);box-shadow:0 3px 0 rgba(142,18,28,.55),0 6px 20px rgba(0,0,0,.6)}
.nav-inner{display:flex;align-items:center;gap:20px;max-width:1080px;margin:0 auto;padding:12px 26px}
.brand{display:flex;align-items:center;gap:12px}
.brand .crest{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7))}
.brand span{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);text-shadow:1.5px 1.5px 0 var(--ink-stroke)}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nav-links a{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);padding:7px 13px;border-radius:5px;transition:color .15s,background .15s}
.nav-links a:hover,.nav-links a[aria-current]{color:var(--ink);background:var(--gold-bright)}
.menu-btn{display:none;margin-left:auto;background:none;border:2px solid var(--gold);color:var(--gold-bright);width:44px;height:42px;border-radius:7px;cursor:pointer;align-items:center;justify-content:center}
.menu-btn svg{width:20px;height:20px}
@media(max-width:860px){
  .nav-links{display:none;width:100%;flex-direction:column;gap:0;margin:10px 0 2px}
  .nav-links.open{display:flex}
  .nav-links a{padding:12px;border-top:1px solid var(--line-soft)}
  .menu-btn{display:flex}
  .nav-inner{flex-wrap:wrap}
}

/* HERO */
.hero{padding:64px 0 54px;text-align:center;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(201,162,74,.10) 1.1px,transparent 1.4px);background-size:10px 10px;opacity:.6;pointer-events:none}
.hero>.wrap{position:relative}
.hero-crest{display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.hero-crest .crest{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 8px 22px rgba(201,162,74,.35))}
.hero h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(42px,7vw,84px);color:var(--paper);letter-spacing:.004em;line-height:.9;
  text-shadow:3px 3px 0 var(--ink-stroke),5px 5px 0 rgba(142,18,28,.85)}
.hero h1 em{display:block;font-style:normal;color:var(--gold-bright);text-shadow:3px 3px 0 var(--ink-stroke),5px 5px 0 rgba(142,18,28,.9)}
.hero .sub{font-size:17px;color:var(--cream);max-width:46ch;margin:16px auto 0;line-height:1.55}

/* EVENTS GRID */
.events-section{padding:56px 0 80px}
.sh{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.sh .ln{flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px)}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}

/* EVENT CARD — comic panel */
.event-card{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:3px solid var(--ink-stroke);border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 2px var(--gold),8px 8px 0 rgba(0,0,0,.55);
  transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.event-card:hover{transform:translate(-2px,-2px);box-shadow:0 0 0 2px var(--gold-bright),10px 10px 0 rgba(0,0,0,.6)}
.event-card a{display:flex;flex-direction:column;flex:1;color:inherit}
.event-card .cover{position:relative;background:#060509;border-bottom:2px solid var(--ink-stroke);overflow:hidden;aspect-ratio:16/9}
.event-card .cover img{width:100%;height:100%;object-fit:contain}
.event-card .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(rgba(201,162,74,.08) 1px,transparent 1.3px);background-size:10px 10px}
.event-card .cover .ph svg{width:42px;height:42px;color:var(--gold);opacity:.5}
.event-card .info{padding:20px 20px 24px;flex:1;display:flex;flex-direction:column;gap:8px}
.event-card .title{font-family:'Anton',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.005em;
  color:var(--paper);text-shadow:1.5px 1.5px 0 var(--ink-stroke);line-height:1.05}
.event-card .date-line{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.event-card .blurb{font-size:14px;color:var(--muted);line-height:1.55;flex:1}
.event-card .footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.event-card .cta{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:var(--gold-bright);border:2px solid var(--ink-stroke);border-radius:4px;
  padding:6px 14px;box-shadow:2px 2px 0 rgba(0,0,0,.5)}

/* STATUS PILL */
.pill{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 12px;border:2px solid var(--ink-stroke);border-radius:4px;box-shadow:1.5px 1.5px 0 rgba(0,0,0,.4);white-space:nowrap}
.pill-upcoming{background:var(--gold-bright);color:var(--ink)}
.pill-live{background:var(--red-bright);color:var(--paper)}
.pill-live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1.3s ease-in-out infinite}
.pill-past{background:var(--panel);color:var(--muted);border-color:var(--gold-deep)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}

/* EMPTY STATE */
.empty{text-align:center;padding:80px 20px;color:var(--muted-2)}
.empty svg{width:48px;height:48px;color:var(--gold);opacity:.4;margin:0 auto 16px}
.empty p{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.08em}

/* FOOTER */
footer{padding:50px 0 44px;text-align:center;border-top:3px solid var(--gold);background:radial-gradient(90% 130% at 50% 100%,rgba(142,18,28,.24),transparent 70%)}
footer .crest{width:52px;height:52px;object-fit:contain;margin:0 auto 14px;filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 6px 16px rgba(201,162,74,.28))}
footer h3{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(18px,3vw,26px);color:var(--paper);text-shadow:2px 2px 0 var(--ink-stroke)}
footer .rule{display:block;width:100px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 18px);margin:14px auto}
footer p{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:10px}

:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px;border-radius:3px}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="brand" href="/">
      <img class="crest" src="https://i.ibb.co/0jxFvkGf/calderyn-college-logo-transparent.webp" alt="Calderyn College crest">
      <span>Calderyn College</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/">Registry</a>
      <a href="/events" aria-current="page">Events</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="hero-crest"><img class="crest" src="https://i.ibb.co/0jxFvkGf/calderyn-college-logo-transparent.webp" alt="Calderyn College crest"></div>
    <p class="eyebrow">Calderyn College</p>
    <h1>Community<br><em>Events</em></h1>
    <p class="sub">Charity fairs, performances, and squad outings. All the OOC plans in one place.</p>
  </div>
</header>

<section class="events-section">
  <div class="wrap">
    <div class="sh"><span class="eyebrow">Upcoming &amp; Past Events</span><span class="ln"></span></div>
    <div class="events-grid" id="eventsGrid">
      <!-- loaded by JS -->
      <div class="empty" id="loadingState">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.4"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <p>Loading events…</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <img class="crest" src="https://i.ibb.co/0jxFvkGf/calderyn-college-logo-transparent.webp" alt="Calderyn College crest">
    <h3>Calderyn College</h3>
    <span class="rule"></span>
    <p>Community Events Hub</p>
  </div>
</footer>

<script>
const API = 'https://calderyn-registry-relay.dreamroleplaywriter.workers.dev';
const SLUG_TO_PATH = { 'charity-fair': '/events/charity-fair/' };

const mb = document.getElementById('menuBtn');
const nl = document.getElementById('navLinks');
mb.addEventListener('click', () => {
  const o = nl.classList.toggle('open');
  mb.setAttribute('aria-expanded', o);
});

function eventPath(slug) {
  return SLUG_TO_PATH[slug] || `/events/${slug}/`;
}

function statusPill(status) {
  if (status === 'live') return `<span class="pill pill-live"><span class="dot"></span>Live now</span>`;
  if (status === 'past') return `<span class="pill pill-past">Past</span>`;
  return `<span class="pill pill-upcoming">Upcoming</span>`;
}

function fmtDate(iso) {
  try {
    return new Intl.DateTimeFormat([], { weekday:'long', day:'numeric', month:'long', year:'numeric' })
      .format(new Date(iso));
  } catch { return iso; }
}

function deriveStatus(event) {
  if (event.status !== 'upcoming') return event.status;
  const now = Date.now();
  const start = new Date(event.date).getTime();
  if (now >= start && now < start + 3.5 * 3600 * 1000) return 'live';
  if (now >= start + 3.5 * 3600 * 1000) return 'past';
  return 'upcoming';
}

function renderCard(event) {
  const status = deriveStatus(event);
  const path   = eventPath(event.slug);
  const cover  = event.cover_image_url
    ? `<img src="${event.cover_image_url}" alt="${event.title} cover" loading="lazy">`
    : `<div class="ph"><svg viewBox="0 0 24 24" fill="none"><path d="M3 16l5-5 4 4 4-5 5 6M3 4h18v16H3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

  return `
<article class="event-card">
  <a href="${path}">
    <div class="cover">${cover}</div>
    <div class="info">
      <div class="title">${event.title}</div>
      <div class="date-line">${fmtDate(event.date)}</div>
      <p class="blurb">${event.blurb || ''}</p>
      <div class="footer">
        <span class="cta">View event <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:5px"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
        ${statusPill(status)}
      </div>
    </div>
  </a>
</article>`;
}

async function loadEvents() {
  const grid = document.getElementById('eventsGrid');
  try {
    const res  = await fetch(`${API}/api/events`);
    const data = await res.json();
    const events = data.events || [];
    if (!events.length) {
      grid.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><p>No events yet.</p></div>`;
      return;
    }
    grid.innerHTML = events.map(renderCard).join('');
  } catch (e) {
    // API not yet configured — show the charity fair card statically
    grid.innerHTML = renderCard({
      slug: 'charity-fair',
      title: 'Great Ormond Street Hospital Charity Fair',
      date: '2026-06-14T16:00:00Z',
      status: 'upcoming',
      cover_image_url: null,
      blurb: 'Red-carpet arrival, atrium fair, D20 games partnered with a child from the wards, a cheer performance, ward visits, and a wind down.',
    });
  }
}

loadEvents();
</script>
</body>
</html>
