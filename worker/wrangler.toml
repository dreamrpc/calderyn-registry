name = "calderyn-registry-relay"
main = "src/index.js"
compatibility_date = "2025-01-15"

# KV namespace holding submission state.
# Create with: wrangler kv namespace create SUBMISSIONS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "f4b40cc6287b4654835bd47d21857b97"

# D1 database for Events Hub (outfits, highlights).
# Create with: wrangler d1 create calderyn-events
# Apply schema: wrangler d1 migrations apply calderyn-events --remote
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "calderyn-events"
database_id   = "REPLACE_WITH_D1_DATABASE_ID"

# R2 bucket for uploaded event images.
# Create with: wrangler r2 bucket create calderyn-events-media
[[r2_buckets]]
binding    = "MEDIA"
bucket_name = "calderyn-events-media"

# Events admin token — set via: wrangler secret put EVENTS_ADMIN_TOKEN
# EVENTS_ADMIN_TOKEN = "set-via-secret"

# Public, non-secret config. Set via `wrangler secret put` for sensitive
# values (see README.md): DISCORD_PUBLIC_KEY, DISCORD_BOT_TOKEN,
# GITHUB_TOKEN.
[vars]
# Snowflake IDs (Discord). Visible to anyone with the Worker code; that's
# fine — they're not secrets, just identifiers.
DISCORD_APPLICATION_ID = "1505897337019437148"
DISCORD_ADMIN_ROLE_ID = "1498799678551101451"
DISCORD_GUILD_ID = "1498798317541396730"
# Role pinged in the "new application" message. Set to the admin role
# so the same group that approves is the group that gets notified.
DISCORD_PING_ROLE_ID = "1498799678551101451"

# Per-form-type channel routing. Each form type lands in its own
# admin-only channel. Anything unrecognised falls back to
# DISCORD_CHANNEL_FALLBACK so submissions never silently vanish.
DISCORD_CHANNEL_STUDENT     = "1498802501585993779"
DISCORD_CHANNEL_FACULTY     = "1498802552203120811"
DISCORD_CHANNEL_STRATA      = "1498802609681862859"
DISCORD_CHANNEL_CLUB        = "1498802624290619553"
DISCORD_CHANNEL_GOV         = "1498802689314783272"
DISCORD_CHANNEL_COLLECTIVE  = "1498802704263286955"
DISCORD_CHANNEL_OUTSIDE     = "1498802719425822791"
DISCORD_CHANNEL_FALLBACK    = "1498802734206288043"
# If set to a Discord channel snowflake, the Worker posts a compact
# audit message here every time a roster change is committed to data.js
# (student approve from pending, or reject of a previously-approved
# entry). Leave empty to disable logging.
DISCORD_CHANNEL_LOG         = "1505920139470573728"

# GitHub repo coordinates.
GITHUB_OWNER = "dreamrpc"
GITHUB_REPO  = "calderyn-registry"
GITHUB_BRANCH = "main"
GITHUB_DATA_FILE = "data.js"

# Comma-separated list of origins allowed to call /submit and
# /quota-stats. The site lives at calderyncollege.uk now (with the
# pages.dev origin redirected to it). Both apex and www variants are
# allowed so the form works regardless of which one the user lands on.
# The pages.dev origin stays on the list so admins can still hit the
# raw Cloudflare URL if they need to bypass DNS for debugging.
CORS_ALLOWED_ORIGINS = "https://calderyncollege.uk,https://www.calderyncollege.uk,https://calderyn-registry.pages.dev"

# Per-tier per-writer caps — hard caps on every tier, per pool
# (students and adults counted separately). Submissions over the cap
# are refused at submit time with an explanation, and any that slip
# through are blocked again at approve time; the submission stays in
# the queue so an admin can lower the tier or reject it.
A_LIST_LIMIT_PER_WRITER = "6"
B_LIST_LIMIT_PER_WRITER = "9"
C_LIST_LIMIT_PER_WRITER = "11"
D_LIST_LIMIT_PER_WRITER = "12"
# Per-writer cap on unsanctioned-status characters (collective / outside
# operators with no STRATA contract), counted across all of a writer's
# accounts regardless of tier — catches the usually tierless rogue
# characters the A/B/C/D caps don't reach.
UNSANCTIONED_LIMIT_PER_WRITER = "5"
