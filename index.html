/* ════════════════════════════════════════════════════════════════════════
   JOIN NOW — application form
   ════════════════════════════════════════════════════════════════════════ */
.join{ background:var(--paper); }

.join-hero{
  background:var(--ink);
  color:#fff;
  padding:48px 32px 40px;
  border-bottom:4px solid var(--red);
  position:relative;
  overflow:hidden;
}
.join-hero::before{
  content:'';
  position:absolute;
  top:0; right:0; bottom:0;
  width:280px;
  background:repeating-linear-gradient(
    -45deg,
    var(--red) 0, var(--red) 14px,
    var(--red-deep) 14px, var(--red-deep) 28px);
  opacity:.18;
  pointer-events:none;
}
.join-hero-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.join-hero-stamp{
  display:inline-block;
  background:var(--yellow);
  color:var(--ink);
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:5px 11px;
  margin-bottom:16px;
}
.join-hero h2{
  font-family:var(--display);
  font-size:64px;
  letter-spacing:.02em;
  line-height:.95;
  text-transform:uppercase;
  color:#fff;
  font-weight:400;
  margin-bottom:14px;
}
.join-hero h2 .accent{ color:var(--yellow); }
.join-hero p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:rgba(255,255,255,.78);
  max-width:680px;
}
.join-hero p strong{ color:#fff; font-weight:700; }
@media (max-width:720px){
  .join-hero{ padding:32px 22px; }
  .join-hero h2{ font-size:40px; }
}

.join-form-wrap{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:36px 32px 64px;
}

.join-step{ margin-bottom:28px; }
.join-step-tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:5px 12px;
  margin-bottom:12px;
}
.join-step-title{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
  margin-bottom:8px;
}
.join-step-blurb{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  color:var(--muted);
  max-width:680px;
  margin-bottom:18px;
}

.join-typegrid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:14px;
}
.join-type{
  background:var(--paper);
  border:2px solid var(--ink);
  padding:18px 20px;
  cursor:pointer;
  text-align:left;
  font:inherit;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:transform .12s, box-shadow .12s, background .12s;
}
.join-type:hover{
  transform:translate(-3px, -3px);
  box-shadow:6px 6px 0 var(--ink);
}
.join-type.on{
  background:var(--ink);
  color:#fff;
  transform:translate(-3px, -3px);
  box-shadow:6px 6px 0 var(--red);
}
.join-type-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  color:var(--red);
}
.join-type.on .join-type-num{ color:var(--yellow); }
.join-type-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  font-weight:400;
}
.join-type-desc{
  font-family:var(--sans);
  font-size:13px;
  line-height:1.5;
  color:var(--muted);
}
.join-type.on .join-type-desc{ color:rgba(255,255,255,.7); }

.join-fieldset{
  background:var(--paper-2);
  border:2px solid var(--ink);
  padding:24px 28px 26px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.join-fieldset.is-narrow{ grid-template-columns:1fr; }
@media (max-width:720px){
  .join-fieldset{ grid-template-columns:1fr; padding:20px 18px; }
}
.join-field{ display:flex; flex-direction:column; gap:6px; }
.join-field.full{ grid-column:1 / -1; }
.join-field-label{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
.join-field-required{ color:var(--red); font-size:14px; line-height:1; }
.join-field-hint{
  font-family:var(--sans);
  font-size:12px;
  color:var(--muted);
  font-weight:400;
  text-transform:none;
  letter-spacing:0;
  margin-left:auto;
}
.join-input,
.join-select,
.join-textarea{
  font-family:var(--sans);
  font-size:14px;
  padding:11px 13px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  width:100%;
  font-weight:500;
}
.join-input:focus,
.join-select:focus,
.join-textarea:focus{
  outline:3px solid var(--yellow);
  outline-offset:-2px;
}
.join-textarea{
  resize:vertical;
  min-height:120px;
  line-height:1.55;
}
.join-textarea.is-tall{
  min-height:200px;
}
.join-textarea.is-medium{
  min-height:150px;
}
.join-input::placeholder,
.join-textarea::placeholder{ color:var(--faint); }

/* Rules acknowledgment checkbox — bold, can't miss it */
.join-checkbox{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:16px 18px;
  background:#fff;
  border:2px solid var(--ink);
  cursor:pointer;
  font-family:var(--sans);
  font-size:14px;
  line-height:1.55;
  color:var(--ink);
  font-weight:500;
  transition:background .12s, border-color .12s;
}
.join-checkbox:hover{
  background:#fff5d4;
}
.join-checkbox input[type="checkbox"]{
  flex-shrink:0;
  width:22px;
  height:22px;
  margin-top:1px;
  accent-color:var(--red);
  cursor:pointer;
}
.join-checkbox span{
  flex:1;
}
.join-checkbox input[type="checkbox"]:checked + span{
  font-weight:600;
}

.join-hp{
  position:absolute !important;
  left:-9999px !important;
  width:1px !important;
  height:1px !important;
  opacity:0 !important;
  pointer-events:none !important;
}

/* ──────────────────────────────────────────────────────────────────────
   COLLECTIVE FORM — 3-flow sub-picker + founding members repeater
   ────────────────────────────────────────────────────────────────────── */
.join-flow-panel{
  /* Use the standard fieldset chrome but lay out as a stacked panel. */
  display:block !important;
  margin-bottom:14px;
}
.join-flow-hd{ margin-bottom:14px; }
.join-flow-tag{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:6px;
}
.join-flow-title{
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
  margin-bottom:4px;
}
.join-flow-blurb{
  font-family:var(--sans);
  font-size:13px;
  line-height:1.55;
  color:var(--muted);
}
.join-flowgrid{
  /* Three flow buttons read better side-by-side on wider viewports. */
  grid-template-columns:repeat(3, 1fr);
}
@media (max-width:900px){
  .join-flowgrid{ grid-template-columns:1fr; }
}

/* Founding-members repeater */
.join-members{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.join-members-empty{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  padding:10px 12px;
  border:1px dashed var(--ink);
  background:rgba(0,0,0,.02);
}
.join-member-row{
  display:grid;
  grid-template-columns:36px 1fr 1.2fr 1fr 36px;
  gap:8px;
  align-items:center;
}
@media (max-width:720px){
  .join-member-row{
    grid-template-columns:36px 1fr 36px;
    grid-template-areas:
      "num alias  remove"
      "num char   char"
      "num role   role";
  }
  .join-member-row > .join-member-num    { grid-area:num; }
  .join-member-row > .join-member-input:nth-of-type(1){ grid-area:alias; }
  .join-member-row > .join-member-input:nth-of-type(2){ grid-area:char; }
  .join-member-row > .join-member-input:nth-of-type(3){ grid-area:role; }
  .join-member-row > .join-member-remove { grid-area:remove; }
}
.join-member-num{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  color:var(--red);
  text-align:center;
}
.join-member-input{
  /* Slightly tighter padding than the standard .join-input so a 3-up row
     still feels comfortable. .join-input already supplies most styles. */
  padding:8px 10px !important;
  font-size:13px !important;
}
.join-member-remove{
  width:32px; height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:var(--mono);
  font-size:20px;
  line-height:1;
  background:var(--paper);
  border:1.5px solid var(--ink);
  color:var(--ink);
  cursor:pointer;
  transition:background .12s, color .12s, transform .12s;
}
.join-member-remove:hover{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
  transform:translateY(-1px);
}
.join-member-add{
  align-self:flex-start;
  margin-top:4px;
  padding:8px 14px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  background:var(--paper);
  border:1.5px dashed var(--ink);
  color:var(--ink);
  cursor:pointer;
  transition:background .12s, color .12s, border-style .12s;
}
.join-member-add:hover{
  background:var(--ink);
  color:#fff;
  border-style:solid;
}

/* ──────────────────────────────────────────────────────────────────────
   JOIN FORM REBALANCE — themed age-cradle warning + width-capped fulls
   + smoother spacing between stacked .join-fieldset blocks (collective
   flow). Comic chrome (hero stripes, type-card offset shadows, big
   step title) is kept verbatim — this just calms the in-fieldset noise.
   ────────────────────────────────────────────────────────────────────── */
.join-warn{
  margin:16px 0 24px;
  padding:14px 18px 14px 20px;
  background:rgba(196,26,26,.06);
  border:1px solid rgba(196,26,26,.30);
  border-left:4px solid var(--red, #c41a1a);
  border-radius:6px;
  color:var(--text, var(--ink));
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
}
.join-warn-tag{
  display:block;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--red, #c41a1a);
  margin-bottom:6px;
}
.join-warn p{
  margin:0;
  color:inherit;
}
.join-warn strong{
  color:var(--text, var(--ink));
  font-weight:700;
}
.join-warn-link{
  color:var(--red, #c41a1a);
  text-decoration:underline;
  text-underline-offset:2px;
}
.join-warn-link:hover{ text-decoration:none; }

/* When two .join-fieldset blocks stack (Collective flow's flow picker
   panel + sub-flow fieldset), space them apart cleanly so they don't
   read as a single squished block. Also gives the inner Flow header
   some breathing room above the type-grid. */
.join-fieldset + .join-fieldset{
  margin-top:14px;
}
  margin-top:24px;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.join-submit{
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:var(--red);
  color:#fff;
  border:3px solid var(--ink);
  padding:14px 32px;
  cursor:pointer;
  font-weight:400;
  transition:transform .12s, box-shadow .12s, background .12s;
}
.join-submit:hover:not(:disabled),
.join-submit:focus-visible:not(:disabled){
  transform:translate(-3px, -3px);
  box-shadow:6px 6px 0 var(--ink);
  background:var(--red-bright);
}
.join-submit:disabled{
  background:var(--rule-soft);
  color:var(--muted);
  cursor:not-allowed;
  border-color:var(--rule-soft);
}
.join-cancel{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:transparent;
  color:var(--muted);
  border:2px solid var(--rule-soft);
  padding:11px 18px;
  cursor:pointer;
  transition:border-color .12s, color .12s;
}
.join-cancel:hover{ border-color:var(--ink); color:var(--ink); }
.join-status{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
}
.join-status.is-error{ color:var(--red); }
.join-status.is-loading{ color:var(--muted); }

.join-confirm{
  background:var(--ink);
  color:#fff;
  padding:48px 32px 40px;
  border:3px solid var(--red);
  text-align:center;
  position:relative;
  overflow:hidden;
}
.join-confirm::before{
  content:'';
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    -45deg,
    rgba(255,204,0,.04) 0, rgba(255,204,0,.04) 14px,
    transparent 14px, transparent 28px);
  pointer-events:none;
}
.join-confirm-stamp{
  display:inline-block;
  background:var(--yellow);
  color:var(--ink);
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:6px 14px;
  margin-bottom:18px;
  position:relative;
  z-index:1;
}
.join-confirm h3{
  font-family:var(--display);
  font-size:48px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:#fff;
  font-weight:400;
  margin-bottom:14px;
  position:relative;
  z-index:1;
}
.join-confirm h3 .accent{ color:var(--yellow); }
.join-confirm p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:rgba(255,255,255,.85);
  max-width:600px;
  margin:0 auto 24px;
  position:relative;
  z-index:1;
}
.join-confirm-again{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  background:transparent;
  color:var(--yellow);
  border:2px solid var(--yellow);
  padding:11px 22px;
  cursor:pointer;
  position:relative;
  z-index:1;
  transition:background .12s, color .12s;
}
.join-confirm-again:hover{ background:var(--yellow); color:var(--ink); }

.join-divider{
  display:flex;
  align-items:center;
  gap:14px;
  margin:36px 0 20px;
}
.join-divider-rule{
  flex:1;
  height:2px;
  background:var(--ink);
}
.join-divider-tag{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--ink);
}


@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  CALDERYN × STRATA — DARK THEME OVERRIDE                                ║
   ║  Notion-meets-Marvel. Dark canvas, crimson + gold + chrome.             ║
   ║  Fraunces editorial display, Inter body. Subtle halftone on heroes.     ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

:root{
  /* ─── canvas & surfaces (was cream — now refined dark) ─── */
  --paper:       #0c0c10;
  --paper-2:     #121218;
  --paper-3:     #181820;
  --paper-4:     #20202a;

  /* ─── ink scale (still dark — used for masthead, heroes, deep slabs) ─── */
  --ink:         #07070a;
  --ink-2:       #0e0e14;
  --ink-3:       #1a1a22;
  --ink-soft:    #25252f;

  /* ─── borders ─── */
  --rule:        #34343f;
  --rule-soft:   #2a2a34;
  --rule-faint:  #1c1c24;

  /* ─── text on dark ─── */
  --text:        #f1ede4;
  --text-mid:    #b8b3a8;
  --text-low:    #7a766d;
  --muted:       #b0aca2;
  --faint:       #6e6a62;

  /* ─── Calderyn shield: crimson + gold ─── */
  --red:         #c11a2c;
  --red-deep:    #7d1018;
  --red-bright:  #e4324a;
  --yellow:      #d4a84a;
  --yellow-deep: #8a6a25;
  --gold-bright: #f1cd72;

  /* ─── Strata: silver / chrome ─── */
  --silver:      #c9cdd3;
  --silver-bright:#e8ebf0;
  --silver-dim:  #6e7079;

  /* ─── Houses, rebalanced for dark ─── */
  --h-valaris:   #e63946;
  --h-orenne:    #e8b14a;
  --h-saberis:   #4ab866;
  --h-grimere:   #5b85d6;

  /* ─── motion ─── */
  --ease:        cubic-bezier(.22,1,.36,1);
  --dur-fast:    140ms;
  --dur:         220ms;
  --dur-slow:    360ms;

  /* ─── editorial display family — redirected to Söhne for the pure stack ─── */
  --serif:       'Söhne', system-ui, sans-serif;
}

/* ─── canvas reset ─── */
html, body{ background:var(--paper); }
body{
  color:var(--text);
  font-family:var(--sans);
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1,"ss01" 1;
}
.page{ background:var(--paper); }
.pg{ background:var(--paper); color:var(--text); }

::selection{ background:var(--gold-bright); color:var(--ink); }
::-moz-selection{ background:var(--gold-bright); color:var(--ink); }

*{ scrollbar-color:#2a2a34 transparent; }
*::-webkit-scrollbar-thumb{ background:#2a2a34; border-radius:8px; }
*::-webkit-scrollbar-thumb:hover{ background:var(--gold); background:var(--yellow); }

*:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }

/* ─── halftone & noise utilities (subtle Marvel feel without being loud) ─── */
.halftone, .pg-hd, .lore-block.lore-intro, .about-bay, .join-confirm{ position:relative; }
.halftone::before,
.pg-hd::after,
.lore-block.lore-intro::after,
.about-bay::after,
.join-confirm::after{
  content:"";
  position:absolute; inset:0;
  background-image: radial-gradient(rgba(212,168,74,.12) 1px, transparent 1.4px);
  background-size: 14px 14px;
  background-position: 0 0;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.55;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  z-index:0;
}
.pg-hd-inner, .lore-block.lore-intro > *, .about-bay > *, .join-confirm > *{ position:relative; z-index:1; }

/* ════════════════════════════════════════════════════════════════════════
   MASTHEAD — refined dark glass with Calderyn crest + Strata mark
   ════════════════════════════════════════════════════════════════════════ */
.masthead{
  background:linear-gradient(180deg, #0a0a0e 0%, #0e0e14 100%);
  border-bottom:1px solid var(--rule-soft);
  box-shadow:0 1px 0 rgba(212,168,74,.18), 0 18px 32px -28px rgba(0,0,0,.9);
}
.mast-inner{ height:100px; gap:28px; padding:0 28px; max-width:1680px; }

.mast-brand{ gap:14px; }
.mast-brand-mark{
  background:transparent !important;
  /* Was 60x60 with background-size:contain — the source PNG has heavy
     transparent padding so the visible shield was much shorter than the
     adjacent wordmark. Bump the container and over-scale the image so the
     visible artwork sits closer to the wordmark's height. The masthead
     height (--hdr-h) is bumped in tandem below so the shield still has
     breathing room top and bottom. */
  width:80px; height:80px;
  padding:0; border:none;
  font-size:0 !important;
  color:transparent !important;
  background-image:url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png') !important;
  background-size:115% auto;
  background-position:center 25%;
  background-repeat:no-repeat;
  filter:drop-shadow(0 4px 14px rgba(193,26,44,.35));
  transition:transform var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.mast-brand-mark::after{ display:none; }
.mast-brand:hover .mast-brand-mark{ transform:translateY(-1px) scale(1.02); filter:drop-shadow(0 6px 18px rgba(212,168,74,.45)); }

.mast-brand-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:23px;
  letter-spacing:.005em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1;
}
.mast-brand-sub{
  color:var(--silver-dim);
  font-size:9.5px;
  letter-spacing:2.2px;
  font-weight:600;
}
.mast-brand-sub::before{ content:""; display:inline-block; width:12px; height:1.5px; background:var(--gold); margin-right:8px; vertical-align:middle; }

/* Strata logo lockup, slotted to the right of meta */
.mast-meta{ gap:18px; }
.mast-meta-cell{
  font-size:9.5px;
  letter-spacing:1.8px;
  color:var(--text-low);
}
.mast-meta-cell strong{ color:var(--text); }
.mast-meta-cell .dot{ background:var(--gold); width:5px; height:5px; }
.mast-meta-cell .dot.live{
  background:var(--red-bright);
  box-shadow:0 0 0 0 rgba(228,50,74,.55);
}
.mast-meta-sep{ color:rgba(255,255,255,.08); }

.mast-search{
  background:rgba(255,255,255,.025);
  border:1px solid var(--rule-soft);
  color:var(--text-mid);
  border-radius:10px;
  padding:10px 14px;
  min-width:300px;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.mast-search:hover, .mast-search:focus-visible{
  border-color:var(--gold);
  background:rgba(212,168,74,.06);
  color:var(--text);
}
.mast-search-icon{ color:var(--gold); }
.mast-search-kbd{
  background:rgba(255,255,255,.04);
  color:var(--silver);
  border:1px solid var(--rule-soft);
  border-radius:4px;
  font-size:10px;
}

/* Strata mark — slotted into masthead right edge */
.mast-strata{
  display:flex;
  align-items:center;
  gap:10px;
  padding-left:18px;
  border-left:1px solid var(--rule-soft);
  flex-shrink:0;
}
.mast-strata-logo{
  width:42px; height:42px;
  background:url('https://i.ibb.co/mrTBNDkc/output-onlinepngtools-1.png') center/contain no-repeat;
  filter:drop-shadow(0 2px 8px rgba(201,205,211,.25));
  transition:transform var(--dur) var(--ease);
}
.mast-strata:hover .mast-strata-logo{ transform:scale(1.05); }
.mast-strata-text{ display:flex; flex-direction:column; line-height:1; gap:3px; }
.mast-strata-name{
  font-family:var(--display);
  font-size:13px;
  letter-spacing:.18em;
  color:var(--silver-bright);
  font-weight:400;
}
.mast-strata-sub{
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:1.6px;
  color:var(--silver-dim);
  text-transform:uppercase;
  font-weight:600;
}

@media (max-width:900px){
  .mast-meta, .mast-strata{ display:none; }
  .mast-search{ min-width:0; }
}

/* ════════════════════════════════════════════════════════════════════════
   TABS — quieter, more elegant nav
   ════════════════════════════════════════════════════════════════════════ */
.tabs{
  background:rgba(10,10,14,.92);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule-soft);
}
.tabs-inner{ max-width:1680px; padding:0 14px; }
.tab{
  color:var(--text-low);
  font-weight:600;
  font-size:12.5px;
  letter-spacing:.08em;
  padding:0 18px;
  height:52px;
  border-radius:0;
  transition:color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tab-num{
  color:var(--gold);
  font-size:9.5px;
  opacity:.55;
}
.tab:hover{ color:var(--text); background:rgba(255,255,255,.03); }
.tab:hover .tab-num{ opacity:.9; color:var(--gold-bright); }
.tab.on{ color:var(--text); background:transparent; }
.tab.on .tab-num{ color:var(--gold-bright); opacity:1; }
.tab.on::after{
  height:2px;
  background:linear-gradient(90deg, var(--red), var(--gold));
  bottom:0;
}

/* ════════════════════════════════════════════════════════════════════════
   SUB-NAV
   ════════════════════════════════════════════════════════════════════════ */
.subnav{
  background:rgba(14,14,20,.94);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule-soft);
}
.subnav-inner{ max-width:1680px; padding:0 14px; }
.subnav-btn{
  color:var(--text-low);
  font-weight:600;
  font-size:12.5px;
  padding:0 18px;
  transition:color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.subnav-btn:hover{ color:var(--text); background:rgba(255,255,255,.03); }
.subnav-btn.on{ color:var(--text); background:transparent; }
.subnav-btn.on::after{
  height:2px;
  background:var(--gold);
}
.subnav-btn .sn-sub{ color:var(--text-low); font-weight:500; }
.subnav-btn.on .sn-sub{ color:var(--silver); }

/* ════════════════════════════════════════════════════════════════════════
   PAGE-HEAD — editorial dark hero, halftone wash
   ════════════════════════════════════════════════════════════════════════ */
.pg-hd{
  background:
    radial-gradient(1200px 600px at 90% -100%, rgba(193,26,44,.20), transparent 60%),
    radial-gradient(1200px 600px at -20% 120%, rgba(212,168,74,.10), transparent 60%),
    linear-gradient(180deg, #0a0a0e 0%, #0f0f15 100%);
  border-bottom:1px solid var(--rule-soft);
}
.pg-hd::before{ display:none; }
.pg-hd-inner{
  max-width:1680px;
  padding:64px 40px 56px;
  gap:48px;
}
.pg-hd-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.pg-hd-stamp-mark{ color:var(--red-bright); }
.pg-hd h2{
  font-family:var(--serif);
  font-weight:500;
  font-size:64px;
  line-height:1.02;
  letter-spacing:-.018em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1,"ss02" 1;
}
.pg-hd-accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.pg-hd p{
  color:var(--text-mid);
  font-size:16px;
  line-height:1.7;
  max-width:640px;
}
.pg-hd p strong{ color:var(--text); }
.pg-hd-note{
  color:var(--silver);
  border-left-color:var(--gold);
  font-size:10.5px;
  letter-spacing:1.6px;
}
.pg-hd-note.warn{ color:#f9b3b8; border-left-color:var(--red-bright); }

@media (max-width:900px){
  .pg-hd-inner{ padding:44px 22px 36px; }
  .pg-hd h2{ font-size:42px; }
}

/* ════════════════════════════════════════════════════════════════════════
   LORE — editorial dark, serif display, refined body
   ════════════════════════════════════════════════════════════════════════ */
.lore{ background:var(--paper); }
.lore-block{
  border-bottom:1px solid var(--rule-faint);
  max-width:1680px;
  padding:64px 40px;
}

/* full-bleed dark hero */
.lore-block.lore-intro{
  background:
    radial-gradient(900px 500px at 85% -50%, rgba(193,26,44,.18), transparent 60%),
    radial-gradient(800px 500px at 0% 130%, rgba(212,168,74,.08), transparent 60%),
    linear-gradient(180deg, #0a0a0e 0%, #0e0e14 100%);
  border-bottom:1px solid var(--rule-soft);
  padding-top:80px;
  padding-bottom:64px;
}
.lore-block.lore-intro > *{ max-width:1680px; padding-left:40px; padding-right:40px; }

.lore-intro-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.lore-intro-title{
  font-family:var(--serif);
  font-weight:500;
  font-size:76px;
  line-height:1.0;
  letter-spacing:-.022em;
  text-transform:none;
  color:var(--text);
  max-width:1100px;
  font-feature-settings:"ss01" 1;
}
.lore-intro-title .accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.lore-lead{
  font-size:18px;
  line-height:1.75;
  color:var(--text-mid);
  max-width:760px;
  font-weight:400;
}
.lore-lead strong{ color:var(--text); font-weight:600; }
.lore-lead em{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  background:transparent;
  padding:0;
}

.lore-eyebrow{
  color:var(--gold);
  border-bottom:none;
  font-size:10px;
  letter-spacing:2px;
  padding:0;
  margin-bottom:14px;
}
.lore-eyebrow::before{ content:""; display:inline-block; width:14px; height:1.5px; background:var(--red-bright); margin-right:8px; vertical-align:middle; }

.lore-h{
  font-family:var(--serif);
  font-weight:500;
  font-size:44px;
  line-height:1.05;
  letter-spacing:-.015em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1;
}
.lore-h .accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.lore-p{
  font-size:16px;
  line-height:1.78;
  color:var(--text-mid);
  max-width:760px;
  font-weight:400;
}
.lore-p strong{ color:var(--text); font-weight:600; }
.lore-p em{
  background:transparent;
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  padding:0;
}

@media (max-width:720px){
  .lore-block{ padding:40px 22px; }
  .lore-block.lore-intro > *{ padding-left:22px; padding-right:22px; }
  .lore-intro-title{ font-size:42px; }
  .lore-h{ font-size:30px; }
}

/* Vanguard cards */
.lore-vanguard{ gap:20px; }
.lore-vg{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-top:3px solid var(--vg-color, var(--gold));
  border-radius:14px;
  padding:28px;
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.lore-vg:hover{
  transform:translateY(-2px);
  box-shadow:0 28px 60px -32px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-vg-alias{
  font-family:var(--serif);
  font-weight:600;
  font-size:34px;
  letter-spacing:-.01em;
  text-transform:none;
  color:var(--text);
}
.lore-vg-name{
  color:var(--vg-color, var(--gold));
  font-size:11px;
  letter-spacing:1.6px;
}
.lore-vg-tag{
  color:var(--text-low);
  border-top-color:var(--rule-soft);
  font-weight:500;
}
.lore-vg-desc{
  color:var(--text-mid);
  font-size:14.5px;
  line-height:1.72;
}

/* House cards */
.lore-house{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-top:3px solid var(--h-color, var(--gold));
  border-radius:14px;
  padding:28px;
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.lore-house:hover{
  transform:translateY(-2px);
  box-shadow:0 28px 60px -32px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-house-hd{ border-bottom-color:var(--rule-soft); }
.lore-house-virtue{ color:var(--h-color, var(--gold)); font-size:10px; letter-spacing:1.8px; }
.lore-house-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:34px;
  letter-spacing:-.01em;
  text-transform:none;
  color:var(--text);
}
.lore-house-namesake{ color:var(--text-low); font-weight:500; }
.lore-house-desc{ color:var(--text-mid); font-size:14.5px; line-height:1.72; }
.lore-house-desc em{
  background:transparent;
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  padding:0;
}

/* House at a glance */
.house-glance{ background:var(--paper-2); }

/* ════════════════════════════════════════════════════════════════════════
   RULES grid — refined
   ════════════════════════════════════════════════════════════════════════ */
.rule{
  background:var(--paper-2);
  border:1px solid var(--rule-soft);
  border-radius:12px;
  overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.rule:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4);
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
}
.rule-num{
  background:linear-gradient(180deg, var(--red), var(--red-deep));
  color:var(--text);
  font-family:var(--serif);
  font-weight:600;
}
.rule-title{ color:var(--text); font-weight:700; font-size:15.5px; }
.rule-text{ color:var(--text-mid); font-size:14px; line-height:1.7; }

/* About-this-RP bay */
.about-bay{
  background:
    radial-gradient(600px 300px at 100% 0%, rgba(212,168,74,.10), transparent 60%),
    linear-gradient(180deg, var(--paper-2), var(--paper-3));
  border:1px solid var(--rule-soft);
  border-left:3px solid var(--gold);
  border-radius:12px;
  padding:32px 36px;
}
.about-bay-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
}
.about-bay-text{ color:var(--text-mid); font-size:14.5px; line-height:1.75; }
.about-bay-text-quiet{ color:var(--text-low); font-size:12.5px; }

/* ════════════════════════════════════════════════════════════════════════
   TABLES — dark, readable, restrained
   ════════════════════════════════════════════════════════════════════════ */
.tw{ background:var(--paper-2); border:1px solid var(--rule-soft); border-radius:12px; overflow:hidden; }
table{ background:transparent; }
thead, thead tr th{
  background:var(--ink-2) !important;
  color:var(--silver) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  font-size:10.5px;
  letter-spacing:1.6px;
  font-weight:700;
}
tbody td{
  background:transparent;
  color:var(--text-mid);
  border-bottom:1px solid var(--rule-faint);
  font-size:14px;
}
tbody tr:nth-child(even) td{ background:rgba(255,255,255,.012); }
tbody tr:hover td{ background:rgba(212,168,74,.06); color:var(--text); }
tbody tr:last-child td{ border-bottom:none; }

.sec-row td{
  background:linear-gradient(90deg, var(--red-deep), var(--red)) !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:17px !important;
  text-transform:none !important;
  letter-spacing:-.005em !important;
  padding:14px 20px !important;
}
.sub-row td{
  background:var(--paper-3) !important;
  color:var(--silver) !important;
  border-top:1px solid var(--rule-soft) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  font-size:13px !important;
  line-height:1.65 !important;
}

.rn{ color:var(--text-low); }

/* ════════════════════════════════════════════════════════════════════════
   PRIMITIVES — links, chips, badges, tier pills
   ════════════════════════════════════════════════════════════════════════ */
a.clink{
  color:var(--text);
  border-bottom:1px solid rgba(212,168,74,.5);
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
a.clink:hover{ color:var(--gold-bright); border-bottom-color:var(--gold-bright); }
span.cname{ color:var(--text); }

.empty{ color:var(--text-low); }
.empty::before{ background:var(--rule); }

.npc-badge{
  background:rgba(212,168,74,.12);
  color:var(--gold-bright);
  border:1px solid rgba(212,168,74,.3);
  border-radius:4px;
}

.chip{ border-radius:4px; font-weight:600; letter-spacing:1.4px; }
.chip-ink{ background:var(--ink-3); color:var(--silver); border:1px solid var(--rule-soft); }
.chip-yellow{ background:var(--gold); color:var(--ink); }
.chip-red{ background:var(--red); color:var(--text); }
.chip-gold{ background:var(--gold-bright); color:var(--ink); }
.chip-ghost{
  background:transparent;
  color:var(--text-mid);
  border:1px solid var(--rule-soft);
}
.chip-classified{ background:var(--red); color:var(--text); }

.tier-pill{ border-radius:4px; }

.house-cell-name{ color:var(--text); }
.hdot{ border:2px solid var(--ink); }

.track-tag{ border-radius:4px; }
.track-tag-hero{ background:var(--red); color:var(--text); }
.track-tag-sidekick{ background:var(--ink-3); color:var(--gold); border:1px solid var(--rule-soft); }
.track-tag-empty{ color:var(--text-low); }

/* ════════════════════════════════════════════════════════════════════════
   FOOTER — editorial dark with Strata mark
   ════════════════════════════════════════════════════════════════════════ */
.footer{
  background:linear-gradient(180deg, #07070b 0%, #050508 100%);
  border-top:1px solid var(--rule-soft);
  color:var(--text-mid);
  margin-top:40px;
  padding:48px 0 36px;
  position:relative;
}
.footer::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,168,74,.4), transparent);
}
.footer-inner{
  max-width:1680px;
  margin:0 auto;
  padding:0 40px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:48px;
  align-items:flex-start;
}
.footer-brand{
  font-family:var(--serif) !important;
  font-weight:600;
  font-size:30px;
  letter-spacing:-.01em;
  color:var(--text);
  text-transform:none !important;
  margin-bottom:6px;
}
.footer-line{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.8px;
  color:var(--gold);
  margin-bottom:14px;
}
.footer-meta{
  font-size:13px;
  line-height:1.7;
  color:var(--text-low);
  max-width:680px;
}
.footer-stamp{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  border:1px solid var(--rule-soft);
  border-radius:12px;
  background:rgba(255,255,255,.015);
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.6px;
  color:var(--silver-dim);
  text-transform:uppercase;
  font-weight:600;
}
.footer-stamp-mark{
  width:38px; height:38px;
  background:url('https://i.ibb.co/mrTBNDkc/output-onlinepngtools-1.png') center/contain no-repeat;
  filter:drop-shadow(0 2px 8px rgba(201,205,211,.2));
  font-size:0;
}

@media (max-width:720px){
  .footer-inner{ grid-template-columns:1fr; padding:0 22px; }
}

/* ════════════════════════════════════════════════════════════════════════
   GLOBAL TEXT-COLOR OVERRIDES — flip components that hardcoded
   color:var(--ink) on previously cream surfaces
   ════════════════════════════════════════════════════════════════════════ */
.section-wrap, .section-wrap-tight, .section-wrap-wide{ color:var(--text); }

/* Generic "card" surfaces and panels — gentle dark elevation */
.club, .club-card, .group, .gov, .strc, .case, .bay, .curr, .kb-team,
.cp-rgroup, .club-side-panel{
  background:var(--paper-2) !important;
  border-color:var(--rule-soft) !important;
  color:var(--text);
}

/* Hide the original masthead red bottom border (replaced by gold gradient) */
.masthead{ border-bottom-color:var(--rule-soft); }

/* Page-enter animation, smoother.
   Note: transform on an ancestor of a sticky element creates a containing
   block that can break sticky behaviour (the sticky element sticks within
   the transformed ancestor rather than the viewport). Use opacity only. */
@keyframes page-enter{
  from{ opacity:0; }
  to{ opacity:1; }
}
.pg{ animation:page-enter .4s var(--ease); }

/* Generic h1/h2/h3 default — serif everywhere except where explicitly set */
h1,h2,h3,h4{ color:var(--text); }
strong{ color:var(--text); }
em{ color:var(--gold-bright); font-style:italic; }

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 2 — CONTRAST FIXES, COMIC PUSH, DEAN PORTRAIT, CREST WATERMARK    ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* ─── 1. Dean portrait inside lore-intro ─── */
.lore-intro-portrait{ padding-top:64px; padding-bottom:56px; }
.lore-intro-portrait-wrap{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:48px;
  align-items:center;
}
.lore-intro-portrait-text{ min-width:0; }
.lore-intro-portrait-fig{
  position:relative;
  margin:0;
  aspect-ratio:3/4;
  background:linear-gradient(180deg, #14141a, #08080b);
  border:1px solid var(--rule-soft);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-intro-portrait-fig::after{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(193,26,44,.18) 1px, transparent 1.5px);
  background-size:6px 6px;
  mix-blend-mode:screen;
  opacity:.45;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
  pointer-events:none;
}
.lore-intro-portrait-fig img{
  width:100%; height:100%;
  object-fit:cover;
  object-position:center top;
  filter:contrast(1.05) saturate(.92);
}
.lore-intro-portrait-fig figcaption{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:18px 22px 16px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.92) 60%);
  display:flex; flex-direction:column; gap:2px;
}
.lore-intro-portrait-cap{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--gold);
}
.lore-intro-portrait-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:20px;
  letter-spacing:-.01em;
  color:var(--text);
}
@media (max-width:900px){
  .lore-intro-portrait-wrap{ grid-template-columns:1fr; gap:28px; }
  .lore-intro-portrait-fig{ max-width:340px; aspect-ratio:4/5; }
}

/* ─── 2. Calderyn crest watermark on Lore world hero ─── */
.lore-intro-crest{ overflow:hidden; }
.lore-intro-crest-watermark{
  position:absolute;
  right:-60px; top:50%;
  transform:translateY(-50%);
  width:520px;
  max-width:55%;
  opacity:.085;
  filter:drop-shadow(0 20px 40px rgba(193,26,44,.4));
  pointer-events:none;
  user-select:none;
  z-index:0;
}
.lore-intro-crest > *:not(.lore-intro-crest-watermark){ position:relative; z-index:1; }
@media (max-width:900px){
  .lore-intro-crest-watermark{ right:-120px; opacity:.06; width:440px; }
}

/* Also drop a faint crest into every page-head as a watermark */
.pg-hd::after{
  background-image:
    url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png'),
    radial-gradient(rgba(212,168,74,.12) 1px, transparent 1.4px);
  background-size: 360px auto, 14px 14px;
  background-position: calc(100% - 32px) center, 0 0;
  background-repeat: no-repeat, repeat;
  opacity:.85;
  mix-blend-mode:normal;
  mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
             linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
                     linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  filter:saturate(.6) brightness(.7);
}
.pg-hd-inner{ position:relative; z-index:1; }

/* ─── 3. CONTRAST FIXES — kill all #fff5d4 cream hovers; force readable text ─── */
tbody tr:hover td,
.house-glance-tbl tbody tr:nth-child(even),
.class-chip-btn:not(:disabled):hover,
.class-chip.is-open .class-chip-btn,
.freg-row.is-clickable:hover,
.freg-row.is-open,
.preg-row.is-clickable:hover,
.preg-row.is-open,
.club-filter-pill:hover,
.club-filter-pill.on{
  background:rgba(212,168,74,.10) !important;
  color:var(--text) !important;
}
.freg-row.is-open, .preg-row.is-open{
  background:rgba(212,168,74,.06) !important;
}

/* Anything still rendering on a hardcoded #fff or near-white */
[style*="background:#fff"]:not(input):not(select):not(textarea),
[style*="background: #fff"]:not(input):not(select):not(textarea){
  background:var(--paper-2) !important;
  color:var(--text) !important;
}

/* Tier-pill #555 fallback → readable */
.tier-pill{
  color:var(--text) !important;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}

/* Form inputs — keep them dark, readable */
.join-input, .join-select, .join-textarea{
  background:var(--paper-3) !important;
  color:var(--text) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  padding:11px 13px !important;
  font-family:var(--sans) !important;
  font-size:14px !important;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.join-input:focus, .join-select:focus, .join-textarea:focus{
  border-color:var(--gold) !important;
  background:var(--paper-2) !important;
  outline:none !important;
}
.join-input::placeholder, .join-textarea::placeholder{ color:var(--text-low) !important; }
.join-select option{ background:var(--paper-2); color:var(--text); }

/* Form labels and field chrome */
.join-field-label, .join-step-tag, .join-step-title, .join-step-blurb{
  color:var(--text);
}
.join-step-title{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  background:transparent !important;
  font-size:28px !important;
  letter-spacing:-.01em !important;
}
.join-step-blurb{ color:var(--text-mid); }
.join-step-tag{
  color:var(--gold) !important;
  background:transparent !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:999px !important;
  padding:5px 12px !important;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.join-checkbox{ color:var(--text-mid); }
.join-checkbox input[type="checkbox"]{ accent-color:var(--gold); }

/* Type-grid (step 1 picker buttons) */
.join-type-card, .join-typegrid > button{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  color:var(--text) !important;
  border-radius:14px !important;
  padding:22px !important;
  text-align:left !important;
  cursor:pointer;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.join-type-card:hover, .join-typegrid > button:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4) !important;
  box-shadow:0 18px 40px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(212,168,74,.15);
}
.join-type-card.on, .join-typegrid > button.on{
  border-color:var(--gold) !important;
  background:linear-gradient(180deg, rgba(193,26,44,.18), var(--paper-2)) !important;
  box-shadow:0 0 0 1px var(--gold), 0 18px 40px -28px rgba(193,26,44,.5);
}

/* Submit button → comic-style red with gold border */
.join-submit{
  background:linear-gradient(180deg, var(--red-bright), var(--red)) !important;
  color:var(--text) !important;
  border:2px solid var(--gold) !important;
  border-radius:8px !important;
  font-family:var(--sans);
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:13px 24px !important;
  cursor:pointer;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  box-shadow:0 6px 0 0 var(--red-deep), 0 18px 40px -20px rgba(193,26,44,.5);
}
.join-submit:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 8px 0 0 var(--red-deep), 0 22px 50px -20px rgba(193,26,44,.65);
}
.join-submit:active:not(:disabled){ transform:translateY(2px); box-shadow:0 4px 0 0 var(--red-deep); }
.join-submit:disabled{
  background:var(--paper-3) !important;
  color:var(--text-low) !important;
  border-color:var(--rule-soft) !important;
  box-shadow:none;
  cursor:not-allowed;
}
.join-cancel{
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  background:transparent !important;
}
.join-cancel:hover{ border-color:var(--gold) !important; color:var(--text) !important; }

.join-confirm{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-left:3px solid var(--gold) !important;
  border-radius:14px !important;
  color:var(--text) !important;
}
.join-confirm h3{ color:var(--text) !important; font-family:var(--serif) !important; font-weight:600 !important; }
.join-confirm p{ color:var(--text-mid) !important; }

/* Generic catch-all: any old "cream" surface that isn't masthead/dark */
.bay, .case, .curr, .strc, .gov, .group{
  color:var(--text);
}

/* ─── 4. COMIC PUSH — thicker borders, brighter halftone, panel shadows ─── */

/* Stronger halftone on heroes (was .55, now .8 + larger dots) */
.pg-hd::after{ /* already overridden above with crest */ }
.lore-block.lore-intro::after,
.about-bay::after,
.join-confirm::after{
  background-image: radial-gradient(rgba(212,168,74,.18) 1.4px, transparent 2px);
  background-size: 12px 12px;
  opacity:.7;
}

/* Comic-frame card style for major content cards */
.lore-vg, .lore-house, .rule, .club-card, .club, .group, .case, .gov, .strc, .kb-team, .cp-rgroup{
  border:1px solid var(--rule-soft) !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 22px 44px -32px rgba(0,0,0,.95);
  position:relative;
}
.lore-vg::before, .lore-house::before, .rule::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.3px);
  background-size:14px 14px;
  pointer-events:none;
  mask-image:linear-gradient(135deg, rgba(0,0,0,.6), transparent 60%);
  -webkit-mask-image:linear-gradient(135deg, rgba(0,0,0,.6), transparent 60%);
  opacity:.5;
}

/* Bigger hero title — more visual weight */
.lore-intro-title{ font-size:84px; }
@media (max-width:900px){ .lore-intro-title{ font-size:48px; } }

/* Tab indicator: thicker comic underline */
.tab.on::after{ height:3px; }

/* Section row in tables — more dramatic comic stamp */
.sec-row td{
  background:linear-gradient(90deg, var(--red-deep) 0%, var(--red) 50%, var(--red-deep) 100%) !important;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
  border-top:1px solid rgba(255,255,255,.08) !important;
  border-bottom:1px solid rgba(0,0,0,.5) !important;
  position:relative;
}

/* Page-head pageNum — comic-style page tag */
.pg-hd-note{
  background:rgba(212,168,74,.06);
  border-left:3px solid var(--gold);
  border-radius:0 6px 6px 0;
  padding:10px 14px 10px 16px;
}

/* "About this RP" gets a thicker comic strip on the left */
.about-bay{ border-left-width:4px !important; }

/* ─── 5. Footer brand mark — keep crest visible ─── */
.footer-brand::before{
  content:"";
  display:inline-block;
  width:28px; height:28px;
  vertical-align:-7px;
  margin-right:10px;
  background:url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png') center/contain no-repeat;
}

/* ─── 6. Universal: any remaining low-contrast text ─── */
p, li, span, td, th, label, div { /* don't change everything; only tighten where text-color is unset */ }
.muted, .faint{ color:var(--text-low); }

/* ─── 7. STRATA Overview dashboard ─── */
.strata-overview{
  max-width:1680px;
  margin:0 auto;
  padding:32px 40px 48px;
}
.strata-stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:18px;
  margin-bottom:36px;
}
.strata-stat{
  text-align:left;
  padding:24px 26px;
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-radius:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  color:var(--text);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.strata-stat::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1.4px);
  background-size:14px 14px;
  mask-image:linear-gradient(135deg, rgba(0,0,0,.5), transparent 60%);
  -webkit-mask-image:linear-gradient(135deg, rgba(0,0,0,.5), transparent 60%);
  pointer-events:none;
}
.strata-stat::after{
  content:"";
  position:absolute;
  top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--red), var(--gold));
  transform:scaleX(.4);
  transform-origin:left;
  transition:transform var(--dur) var(--ease);
}
.strata-stat:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4);
  box-shadow:0 22px 50px -32px rgba(0,0,0,.95);
}

.preg-view-arrow{ font-size:9px; }

/* ─── P0.5 Global Search modal ─── */
.gs-overlay{
  background:rgba(7,7,11,.85) !important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.gs-panel{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:14px !important;
  color:var(--text) !important;
}
.gs-panel-hd{ border-bottom:1px solid var(--rule-soft); }
.gs-panel-input{
  background:transparent !important;
  color:var(--text) !important;
  border:none !important;
  font-size:16px;
  padding:14px 16px;
}
.gs-panel-input::placeholder{ color:var(--text-low) !important; }
.gs-panel-icon{ color:var(--gold) !important; }
.gs-panel-close{ color:var(--text-mid) !important; background:transparent !important; border:none !important; }
.gs-panel-close:hover{ color:var(--text) !important; }
.gs-panel-count{ color:var(--text-low) !important; font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; padding:0 16px 12px; }
.gs-empty{ color:var(--text-low) !important; padding:32px; text-align:center; }
.gs-empty-icon{ color:var(--text-low) !important; opacity:.5; margin-bottom:8px; }
.gs-group{ border-top:1px solid var(--rule-soft); }
.gs-group-hd{
  display:flex; justify-content:space-between; align-items:center;
  color:var(--gold) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  padding:10px 16px;
  background:rgba(212,168,74,.04);
}
.gs-group-count{ color:var(--text-low) !important; }
.gs-result{
  display:flex; align-items:center; gap:14px;
  background:transparent !important;
  color:var(--text) !important;
  border:none !important;
  border-bottom:1px solid var(--rule-faint) !important;
  padding:12px 16px;
  cursor:pointer;
  width:100%;
  text-align:left;
}
.gs-result:hover, .gs-result.on{
  background:rgba(212,168,74,.08) !important;
}
.gs-result-main{ flex:1; min-width:0; }
.gs-result-label{ color:var(--text) !important; font-weight:600; font-size:14.5px; }
.gs-result-sub{ color:var(--text-low) !important; font-size:12px; margin-top:2px; }

/* ─── P0.6 Clubs detail drawer (ClubPanel) ─── */
.club-side-overlay{ background:rgba(7,7,11,.6) !important; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
.club-side-panel{
  background:var(--paper-2) !important;
  border-left:1px solid var(--rule-soft) !important;
  color:var(--text) !important;
}
.club-side-hd .club-side-cat,
.club-side-hd .club-side-name,
.club-side-hd .club-side-tag{
  color:#fff !important;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
}
.club-side-cat{ font-family:var(--mono); font-size:10px; letter-spacing:1.6px; text-transform:uppercase; font-weight:700; }
.club-side-name{ font-family:var(--serif); font-weight:600; font-size:32px; letter-spacing:-.01em; line-height:1.1; }
.club-side-tag{ font-family:var(--mono); font-size:10px; letter-spacing:1.4px; }
.club-side-close{
  background:rgba(0,0,0,.35) !important;
  color:#fff !important;
  border:1px solid rgba(255,255,255,.2) !important;
  border-radius:8px !important;
}
.club-side-close:hover{ background:rgba(0,0,0,.5) !important; }
.cp-tabs{ background:var(--paper-3) !important; border-bottom:1px solid var(--rule-soft); display:flex; }
.cp-tab{
  background:transparent !important;
  color:var(--text-mid) !important;
  border:none !important;
  border-bottom:2px solid transparent !important;
  padding:12px 18px !important;
  font-weight:600;
}
.cp-tab.on{ color:var(--text) !important; border-bottom-color:var(--gold) !important; }
.club-side-body{ background:var(--paper-2) !important; color:var(--text); padding:20px 24px; }
.cp-about, .cp-about-text, .cp-about p{ color:var(--text-mid) !important; line-height:1.7; }

.club-side-stats{ display:flex; gap:14px; margin-bottom:18px; }
.club-side-stat{
  flex:1;
  background:var(--paper-3) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:10px !important;
  padding:18px 16px;
  text-align:center;
}
.club-side-stat-num{ color:var(--gold-bright) !important; font-family:var(--serif) !important; font-weight:600 !important; font-size:32px !important; line-height:1 !important; }
.club-side-stat-lbl{ color:var(--text-low) !important; font-family:var(--mono) !important; font-size:10px !important; letter-spacing:1.6px !important; text-transform:uppercase !important; margin-top:6px; }

.cp-about-career{
  background:rgba(212,168,74,.06) !important;
  border:1px solid rgba(212,168,74,.2) !important;
  border-radius:12px !important;
  padding:18px 22px !important;
  color:var(--text);
}
.cp-about-career-tag{ color:var(--gold) !important; font-family:var(--mono) !important; font-size:10px !important; letter-spacing:1.6px !important; text-transform:uppercase !important; font-weight:700 !important; }
.cp-about-career-title{ color:var(--text) !important; font-family:var(--serif) !important; font-weight:600 !important; font-size:22px !important; letter-spacing:-.005em !important; margin-top:6px; }

.cp-rgroup{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:12px !important;
  margin-bottom:14px;
  color:var(--text);
  overflow:hidden;
}
.cp-rgroup-hd{ padding:12px 16px; border-bottom:1px solid var(--rule-soft); }
.cp-rgroup-tag{ color:var(--gold) !important; font-family:var(--mono); font-size:10px; letter-spacing:1.6px; text-transform:uppercase; font-weight:700; }
.cp-rgroup-tbl{ width:100%; border-collapse:collapse; }
.cp-rgroup-tbl thead tr th{ background:transparent !important; color:var(--gold) !important; }
.cp-rgroup-tbl tbody td{ color:var(--text) !important; border-bottom:1px solid var(--rule-faint); padding:10px 16px; }
.cp-rgroup-pos{ color:var(--text-mid) !important; font-family:var(--mono); font-size:11px; letter-spacing:1.4px; text-transform:uppercase; font-weight:600; }
.cp-rgroup-char{ color:var(--text) !important; }

/* ─── P1 Form fully-human checkbox: highlight surface + dark label ─── */
/* The checkbox row gets a subtle gold-tinted dark surface; label stays light */
.join-checkbox{
  background:rgba(212,168,74,.06) !important;
  border:1px solid rgba(212,168,74,.2) !important;
  border-radius:10px !important;
  padding:14px 16px !important;
  color:var(--text) !important;
  display:flex !important;
  gap:12px !important;
  align-items:flex-start !important;
}
.join-checkbox span,
.join-checkbox input[type="checkbox"]:checked + span{
  color:var(--text) !important;
}
.join-checkbox input[type="checkbox"]{ flex-shrink:0; margin-top:3px; accent-color:var(--gold); width:18px; height:18px; }

/* ─── P2 Page-head: pull crest BEHIND the badge, opaque badge tile ─── */
.pg-hd::after{
  /* push crest further left so it doesn't sit under the right-side badge */
  background-position: calc(100% - 280px) center, 0 0 !important;
  background-size: 200px auto, 14px 14px !important;
  opacity:.13 !important;
  z-index:0 !important;
}
.pg-hd-inner{ position:relative; z-index:2 !important; }
.pg-hd-note{
  position:relative;
  z-index:3 !important;
  background:rgba(10,10,14,.78) !important;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-left:3px solid var(--gold) !important;
  border-radius:0 8px 8px 0 !important;
  padding:12px 16px !important;
  color:var(--silver) !important;
}
.pg-hd-note.warn{
  border-left-color:var(--red-bright) !important;
  color:#f9b3b8 !important;
}

/* ─── P3 STRATA Overview thead: hoist to top, kill sticky inside short table ─── */
.strata-directory{ overflow:visible !important; padding:28px !important; }
.strata-directory > .tw{ overflow:visible !important; border:1px solid var(--rule-soft); border-radius:12px; margin:0; }
.strata-directory > .tw table thead tr th{
  position:static !important;
  top:auto !important;
  z-index:auto !important;
  background:var(--ink-2) !important;
  border-radius:0 !important;
}
.strata-directory > .tw table thead tr:first-child th:first-child{ border-top-left-radius:12px !important; }
.strata-directory > .tw table thead tr:first-child th:last-child{ border-top-right-radius:12px !important; }
.strata-directory > .tw table tbody tr:last-child td:first-child{ border-bottom-left-radius:12px !important; }
.strata-directory > .tw table tbody tr:last-child td:last-child{ border-bottom-right-radius:12px !important; }

/* ─── P6 Students empty state: tighten ─── */
.empty-state-block{
  padding:24px 16px !important;
  gap:12px !important;
}
tbody td:has(.empty-state-block){ padding:12px 16px !important; }

/* SAFETY NET: any remaining color:var(--ink) text on dark surfaces becomes light */
[class*="-desc"], [class*="-blurb"], [class*="-note"], [class*="-text"]{
  color:var(--text-mid);
}

ilter-pill.on, .chip.on, .pill.on{ background:rgba(241,205,114,.18) !important; color:#ffe199 !important; border:1px solid rgba(241,205,114,.55) !important; } /* Status chips (HEROES / SHARED / SIDEKICKS) — add a leading symbol so colorblind users get info from shape, not just color */ .class-chip-tag::before, .curr-class-tag::before{ display:inline-block; margin-right:4px; font-weight:700; } .class-chip-tag[data-track="heroes"]::before, .curr-class-tag.heroes::before{ content:"●"; } .class-chip-tag[data-track="sidekicks"]::before, .curr-class-tag.sidekicks::before{ content:"▲"; } .class-chip-tag[data-track="shared"]::before, .curr-class-tag.shared::before{ content:"◆"; } /* Strong visible focus ring for keyboard nav */ a:focus-visible, button:focus-visible, [role="tab"]:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, .club:focus-visible, .club-filter-pill:focus-visible, .tier-card:focus-visible{ outline:3px solid var(--a11y-focus) !important; outline-offset:2px !important; box-shadow:0 0 0 5px rgba(255,210,74,.25) !important; border-radius:4px; } /* Make all interactive controls minimum 40px tall for motor-impairment users */ button, .btn, [role="button"], .club-filter-pill, .tab, [role="tab"], .pill, .chip-action{ min-height:40px !important; padding-top:8px !important; padding-bottom:8px !important; } /* Form inputs: bigger text, brighter placeholder */ input, select, textarea{ font-size:15px !important; color:var(--a11y-text) !important; } input::placeholder, textarea::placeholder{ color:#9a958a !important; opacity:1 !important; } /* Selection contrast */ ::selection{ background:#ffd24a; color:#0e0e10; } /* prefers-contrast: more — push everything toward maximum legibility */ @media (prefers-contrast: more){ :root{ --a11y-text:#ffffff !important; --a11y-text-mid:#f0ebde !important; --a11y-text-low:#cfc9b8 !important; } .club-hd, .club-side-hd{ box-shadow:inset 0 0 0 2px rgba(0,0,0,.5) !important; } .club-cat-pip, .club-filter-pill.on{ background:rgba(241,205,114,.3) !important; border-color:#f1cd72 !important; color:#fff !important; } a, .link{ text-decoration:underline !important; text-underline-offset:3px; } } /* Skip-to-content link for keyboard users (hidden until focused) */ .a11y-skip{ position:fixed; top:-100px; left:8px; z-index:9999; background:#ffd24a; color:#0e0e10; padding:10px 16px; font-weight:700; border-radius:6px; transition:top .15s; } .a11y-skip:focus{ top:8px; }

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 5 — CONTRAST SAFETY NET (after a11y layer; final cascade winner)  ║
   ║  Catches all chip/tag/pill/labelled-bg cases where text+bg can collide. ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Status-card tag (Powers Guide → status cards) — data drives bg + text;
   force light text + drop-shadow so any saturated bg is readable. */
.status-card-tag{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.55) !important;
  font-weight:700 !important;
}
/* Vanguard amber needs dark text not white; text-shadow alone is insufficient */
.status-card-tag[style*="background:#d4901a"],
.status-card-tag[style*="background: #d4901a"]{
  color:#1a0e00 !important;
  text-shadow:0 1px 0 rgba(255,255,255,.25) !important;
}

/* House / club / team coloured headers — white + drop-shadow on every brand bg */
.club-hd, .club-hd *,
.club-side-hd, .club-side-hd *,
.kb-team-hd, .kb-team-hd *,
.lore-house-hd, .lore-house-hd *{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.55) !important;
}

/* Tier-pill — always white + drop-shadow regardless of inline bg */
.tier-pill{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) !important;
  font-weight:700 !important;
}

/* Hero-list section — letter, label, desc, requirement pill */
.hero-list-letter{ filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.hero-list-label{ color:var(--text) !important; }
.hero-list-desc{ color:var(--text-mid) !important; }
.hero-list-req{
  background:rgba(212,168,74,.10) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:6px !important;
}

/* NPC + chip variants — guarantee dark-on-dark / light-on-light never lands */
.npc-badge{
  background:rgba(212,168,74,.14) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  text-shadow:none !important;
}
.chip{ text-shadow:none !important; }
.chip-classified{
  background:repeating-linear-gradient(45deg, rgba(228,50,74,.7) 0 6px, rgba(125,16,24,.7) 6px 12px) !important;
  color:#ffffff !important;
  border:1px solid rgba(228,50,74,.5) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.7) !important;
}
.chip-red{
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  color:#ffffff !important;
  border:1px solid rgba(255,255,255,.1) !important;
}
.chip-ghost{
  background:transparent !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
}
.chip-ink{
  background:rgba(255,255,255,.06) !important;
  color:var(--silver) !important;
  border:1px solid var(--rule-soft) !important;
}

/* Track tags (HEROES / SIDEKICKS) in faculty registry tables */
.track-tag-hero{
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  color:#ffffff !important;
  border:1px solid rgba(255,255,255,.08) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.6) !important;
}
.track-tag-sidekick{
  background:rgba(255,255,255,.04) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
}

/* House-cell name in tables */
.house-cell-name{ color:var(--text) !important; }

/* Catch-all for any inline color:var(--ink*) or hardcoded near-black that
   survived from older code paths (STRATA Talent rows, etc.) */
[style*="color:var(--ink)"],
[style*="color: var(--ink)"],
[style*="color:var(--ink-2)"],
[style*="color: var(--ink-2)"],
[style*="color:var(--ink-3)"],
[style*="color:#0e0e10"],
[style*="color: #0e0e10"],
[style*="color:#0a0a0c"],
[style*="color:#000"]{
  color:var(--text) !important;
}

/* Catch-all for inline bg=#54545c gray with dark text — force white */
[style*="background:#54545c"],
[style*="background: #54545c"]{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5) !important;
}

/* Form labels and step copy — beat any legacy white-on-white rule */
.join-field-label,
.join-field-label *,
.join-step-title,
.join-step-blurb,
.join-checkbox span{
  color:var(--text) !important;
}
.join-field-required{ color:var(--red-bright) !important; }
.join-field-hint{ color:var(--text-low) !important; font-weight:400 !important; }

/* EmptyState dot+label */
.empty,
.empty *{ color:var(--text-low) !important; }
.empty::before{ background:var(--rule) !important; }

/* Final fallback — any element whose class includes "muted" / "faint" gets
   readable mid-grey instead of inheriting a near-paper colour */
[class*="muted"]:not(.club-meta):not(.block-meta):not(.gs-panel-count),
[class*="faint"]{
  color:var(--text-mid) !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 6 — CURRICULUM REDESIGN (streamlined, single-list layout)         ║
   ║  Year tabs → year head → toolbar → unified list → footnote.             ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

.curr{
  max-width:1100px !important;
  margin:0 auto !important;
  padding:24px 32px 48px !important;
  color:var(--text);
}

/* Year tab strip */
.curr-yeartabs{
  display:grid !important;
  grid-template-columns:repeat(4, 1fr) !important;
  gap:8px !important;
  padding:0 !important;
  margin-bottom:32px;
  background:transparent !important;
  border:none !important;
}
.curr-yeartab{
  display:flex !important;
  flex-direction:column !important;
  align-items:flex-start !important;
  gap:4px !important;
  padding:14px 18px !important;
  background:rgba(255,255,255,.025) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:10px !important;
  color:var(--text-mid) !important;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  text-align:left !important;
}
.curr-yeartab:hover{ border-color:rgba(212,168,74,.3) !important; color:var(--text) !important; }
.curr-yeartab.on{
  background:rgba(212,168,74,.08) !important;
  border-color:var(--gold) !important;
  color:var(--text) !important;
  box-shadow:0 0 0 1px var(--gold);
}
.curr-yeartab-num{
  font-family:var(--mono) !important;
  font-size:10px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  color:var(--gold) !important;
}
.curr-yeartab-label{
  font-family:var(--sans) !important;
  font-size:14px !important;
  font-weight:600 !important;
  color:inherit !important;
  letter-spacing:0 !important;
}

/* Year head */
.curr-yearhead{
  margin-bottom:24px;
  padding-bottom:24px;
  border-bottom:1px solid var(--rule-soft);
}
.curr-yearhead-eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold);
  margin-bottom:10px;
}
.curr-yearhead-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:36px;
  letter-spacing:-.018em;
  line-height:1.1;
  color:var(--text);
  margin:0 0 14px;
  max-width:680px;
  text-wrap:balance;
}
.curr-yearhead-tracks{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.curr-yearhead-line{
  color:var(--text-mid);
  font-size:14px;
  line-height:1.6;
  margin:0;
  display:flex;
  gap:10px;
  align-items:baseline;
}
.curr-yearhead-tag{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  font-weight:700;
  padding:3px 8px;
  border-radius:4px;
  border:1px solid var(--rule-soft);
  flex-shrink:0;

  --muted:    #dcd6c8 !important;
  --faint:    #a8a298 !important;
}

/* Bump every JetBrains Mono label so it's not microscopic.
   Labels at 9-11px with 1.4-1.8px letter-spacing read as illegible noise. */
[class*="-tag"],
[class*="-eyebrow"],
[class*="-stamp"],
[class*="-num"],
[class*="-meta"],
[class*="-cap"],
[class*="-kbd"],
.mono,
.mast-meta-cell,
.mast-brand-sub,

.orgs-group-count,

.orgs-role-label,
.club-tag,
.club-cat-pip,
.club-side-cat,
.club-side-tag,
.lore-eyebrow,
.lore-vg-name,
.lore-vg-tag,
.lore-house-virtue,
.lore-house-namesake,
.freg-group-count,
.freg-detail-label,
.freg-arc-year,
.freg-arc-title,
.freg-view-btn,
.gov-tag,
.office-tag-num,
.office-tag-label,
.office-prez-eyebrow,
.office-prez-term,
.office-staff-role,
.office-staff-term,
.mandate-tag,
.block-meta,
.block-note,
.council-rep-house,
.council-rep-role,
.council-rep-term,
.committee-role,
.committee-stamp,
.case-col-tag,
.case-stat-l,
.case-dossier-hd-r,
.case-quote-c,
.prog-phase-era,
.prog-phase-years,
.prog-phase-stat,
.bay-hd-tag,
.intro-bay-eyebrow,
.intro-bay-rule-key,
.banned-bay-stamp,
.banned-bay-num,
.banned-bay-tag,
.tier-card-list,
.tier-card-bracket,
.status-card-num,
.kbr-arena-tile-eyebrow,
.kbr-role-num,
.club-side-stat-lbl,
.cp-rgroup-tag,
.cp-about-career-tag,
.gs-group-hd,
.gs-panel-count,

.empty-state-block .empty,
.npc-badge,
.curr-counts-sep,

/* But truly tiny tags (4-6 char labels) can stay smaller — override above */
.npc-badge, .curr-row-track, .curr-row-kind, .chip{

/* Body / paragraph copy minimum legibility */
p, li, dd, dt{

}

/* Force any remaining .muted/.faint class to readable mid */
.muted, [class*="-muted"], .faint, [class*="-faint"], .text-muted, .text-low{

  letter-spacing:1.4px !important;

  text-transform:uppercase !important;
  border-bottom:1px solid var(--rule-soft) !important;
  border-right:1px solid var(--rule-faint) !important;

.house-glance-tbl tbody tr{

}
.house-glance-tbl tbody tr:nth-child(even){

}
.house-glance-tbl tbody td{

.house-glance-name{

/* GLOBAL SAFETY NET — any class likely to carry text content but still
   resolving to color:var(--ink) gets pushed to var(--text). */
[class$="-virtue"],
[class$="-mascot"],
[class$="-traits"],
[class$="-rival"],

[class$="-desc"], [class$="-text"], [class$="-note"], [class$="-bio"],
[class$="-body"]{

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 12 — TYPOGRAPHY OVERHAUL: muted status tags, no colour clashes    ║
   ║  Kill saturated solid-colour blocks site-wide. Coloured accent → bar.   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Status-card tag (POWER_STATUSES) — was solid saturated blocks per data.js
   bg colour. Now: unified muted dark surface, coloured 4px left bar based
   on the inline bg, themed text colour per status. !important required to
   override the inline style="background:#xxx". */
.status-card-tag{
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  padding:14px 18px 14px 22px !important;
  font-family:var(--sans) !important;
  font-size:17px !important;
  font-weight:700 !important;
  letter-spacing:.04em !important;
  text-shadow:none !important;
  position:relative !important;
  overflow:hidden !important;
  color:var(--text) !important;
  display:flex !important;
  align-items:center !important;
}
.status-card-tag span{
  color:var(--text) !important;
  text-shadow:none !important;
}
.status-card-tag::before{
  content:"" !important;
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:var(--gold);
}
/* Per-status accent bar + themed text from inline bg attribute */
.status-card-tag[style*="background:#1e40af"]::before,
.status-card-tag[style*="background: #1e40af"]::before{ background:#5b85d6; }

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  CREST WATERMARK — identical position/size on every page                ║
   ║  Single source of truth: 240px wide, right-aligned, .15 opacity.        ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Apply to every page hero — PageHead variant + Join hero variant. */
.pg-hd::after,
.join-hero::after{
  content:"" !important;
  position:absolute !important;
  inset:0 !important;
  background-image:
    url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png'),
    radial-gradient(rgba(212,168,74,.10) 1px, transparent 1.4px) !important;
  background-size: 240px auto, 14px 14px !important;
  background-position: calc(100% - 36px) center, 0 0 !important;
  background-repeat: no-repeat, repeat !important;
  opacity:.15 !important;
  filter:saturate(.5) brightness(.7) !important;
  mix-blend-mode:normal !important;
  mask-image:linear-gradient(90deg, transparent 55%, rgba(0,0,0,.95) 100%) !important;
  -webkit-mask-image:linear-gradient(90deg, transparent 55%, rgba(0,0,0,.95) 100%) !important;
  pointer-events:none !important;
  z-index:0 !important;
}
.pg-hd-inner, .join-hero-inner{ position:relative; z-index:2 !important; }

/* Don't ALSO render a separate crest watermark inside Lore world's own
   intro slab — the page-head crest above it is canonical. */
.lore-intro::after{
  background-image: radial-gradient(rgba(212,168,74,.18) 1.4px, transparent 2px) !important;
  background-size: 12px 12px !important;
  background-position: 0 0 !important;
  opacity:.5 !important;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent) !important;
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent) !important;
  filter:none !important;
}

/* Mobile: scale crest down so it doesn't crowd the headline */
@media (max-width:900px){
  .pg-hd::after,
  .join-hero::after{
    background-size: 180px auto, 14px 14px !important;
    background-position: calc(100% - 16px) center, 0 0 !important;
    opacity:.12 !important;
  }
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 13 — FINAL CONTRAST SWEEP                                         ║
   ║  Original CSS used color:var(--ink) (near-black) for body text on a     ║
   ║  white --paper canvas. The dark-theme override flipped --paper dark but ║
   ║  left ~167 color:var(--ink) declarations untouched, producing dark-on-  ║
   ║  dark text that survived the earlier wave overrides. This wave rebinds  ║
   ║  --ink → --text on text-bearing elements inside the content panel, so   ║
   ║  any color:var(--ink) declaration resolves to readable light text.      ║
   ║  Custom-property scoping means we don't disturb the borders / panel     ║
   ║  backgrounds that legitimately use --ink as a structural dark colour.   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
.pg :is(p, li, dd, dt, span, strong, em, b, i, u, small, mark, time, abbr,
        cite, q, sub, sup, h1, h2, h3, h4, h5, h6,
        td, th, caption, figcaption, blockquote, summary, details, label,
        legend, address, code, kbd, samp, pre, a){
  --ink: var(--text);
}

/* Re-darken --ink where the element actually paints a yellow / white surface
   (chips, badges, the few light-bg pills that survived the dark sweep). */
.pg .chip-yellow, .pg .chip-gold,
.pg [style*="background:var(--yellow)"],
.pg [style*="background: var(--yellow)"],
.pg [style*="background:#ffcc00"], .pg [style*="background: #ffcc00"],
.pg [style*="background:#d4a84a"], .pg [style*="background: #d4a84a"],
.pg [style*="background:#ffffff"], .pg [style*="background: #ffffff"],
.pg [style*="background:#fff "], .pg [style*="background: #fff "],
.pg [style*="background:#fff;"], .pg [style*="background: #fff;"]{
  --ink: #0e0e10;
}

   ║  BANNED bay — stamp readability + REJECTED tag contrast                 ║
   ║  Wave 10 collapsed every mono label to 11.5px which crushed the BANNED  ║
   ║  stamp on the Powers page; wave 2 muted the REJECTED tag to text-low    ║
   ║  grey. Restore the stamp to a display size and force the tag to white   ║
   ║  bold so it reads at a glance against the red badge background.         ║

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 15 — assorted contrast fixes                                      ║
   ║  • .office-prez-term ("2026–27") read as dark on amber after WAVE 13    ║
   ║    rebound --ink to light text. Convert it to a white pill on a dark    ║
   ║    gold-bordered chip so it's high-contrast either way.                 ║
   ║  • The Powers / Faculty VIEW button used color:var(--gold) which isn't  ║
   ║    a defined custom property — the !important declaration was invalid   ║
   ║    and the cascade fell through to color:var(--ink). Switch to the      ║
   ║    real variable (--gold-bright) and tighten the chip styling.          ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Student Body President — term chip */
.office-prez-term{

/* Powers Registry + Faculty Curriculum VIEW button */

.class-chip-btn,
button.class-chip-btn{
  color:var(--gold-bright) !important;
  background:rgba(212,168,74,.10) !important;
  border:1px solid rgba(212,168,74,.45) !important;

.preg-view-btn:hover,

.class-chip.is-open .class-chip-btn{
