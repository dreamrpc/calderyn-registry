  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  color:var(--text);
}
.banned-bay-num, .banned-bay-tag{
  color:var(--text-low);
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.4px;
}

/* ─── 3. Pills repainted for dark canvas ─── */
.chip-yellow{
  background:rgba(212,168,74,.10) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.45) !important;
}
.chip-gold{
  background:rgba(212,168,74,.10) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
}
.chip-ink{
  background:rgba(255,255,255,.06) !important;
  color:var(--silver) !important;
  border:1px solid var(--rule-soft) !important;
}
.chip-red{
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  color:var(--text) !important;
  border:1px solid rgba(255,255,255,.08) !important;
}
.chip-ghost{
  background:transparent !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
}
.chip-classified{
  background:repeating-linear-gradient(45deg, rgba(228,50,74,.6) 0 6px, rgba(125,16,24,.6) 6px 12px) !important;
  color:#fff !important;
  border:1px solid rgba(228,50,74,.4) !important;
}
.npc-badge{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.3) !important;
  border-radius:4px;
  padding:2px 7px;
  font-size:9px;
  letter-spacing:1.3px;
  font-weight:700;
  text-transform:uppercase;
}

/* Outside filter pills */
.orgs-pill{
  background:rgba(255,255,255,.03) !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:999px !important;
  padding:8px 14px !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  letter-spacing:1.5px !important;
  font-weight:600 !important;
  text-transform:uppercase !important;
  cursor:pointer;
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.orgs-pill:hover{ color:var(--text) !important; border-color:rgba(212,168,74,.4) !important; }
.orgs-pill.on{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}
.orgs-pill-n{ color:var(--text-low) !important; margin-left:6px; }
.orgs-pill.on .orgs-pill-n{ color:var(--gold) !important; }

/* Club filter pills */
.club-filter-pill{
  background:rgba(255,255,255,.03) !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:999px !important;
  font-weight:600 !important;
  padding:7px 14px !important;
}
.club-filter-pill:hover{ color:var(--text) !important; border-color:rgba(212,168,74,.4) !important; background:rgba(255,255,255,.04) !important; }
.club-filter-pill.on{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}
.club-filter-count{ color:var(--text-low) !important; margin-left:6px; }
.club-filter-pill.on .club-filter-count{ color:var(--gold) !important; }
.club-filters-label{ color:var(--text-low) !important; }

/* Powers Registry filter pills */
.preg-pill{
  background:rgba(255,255,255,.03) !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:999px !important;
}
.preg-pill:hover{ color:var(--text) !important; border-color:rgba(212,168,74,.4) !important; }
.preg-pill.on{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}
.preg-search{
  background:var(--paper-3) !important;
  color:var(--text) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
}
.preg-search:focus{ border-color:var(--gold) !important; outline:none !important; }
.preg-count{ color:var(--text-low) !important; }

/* ─── 4. Club cards — readable text ─── */
.club{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:14px !important;
  overflow:hidden !important;
  color:var(--text) !important;
}
.club-hd .club-name, .club-hd .club-tag{
  color:#fff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.club-meta{
  background:rgba(255,255,255,.03) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  color:var(--text-mid) !important;
}
.club-cat-pip{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.3) !important;
  border-radius:999px !important;
  padding:3px 9px !important;
}
.club-access{
  color:var(--text-mid) !important;

}
.club-desc{
  color:var(--text-mid) !important;
  background:transparent !important;
  font-size:14px;
  line-height:1.65;
  padding:14px 18px !important;
}

/* ─── 5. VIEW button (Faculty Curriculum + Powers Registry) ─── */
.class-chip-btn,
.preg-view-btn,
button.class-chip-btn{
  background:transparent !important;
  color:var(--gold) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:6px !important;
  padding:6px 12px !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.4px !important;
  font-weight:700 !important;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
}
.class-chip-btn:hover, .preg-view-btn:hover{
  background:rgba(212,168,74,.10) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}
.class-chip{ background:transparent !important; }
.class-chip.is-open .class-chip-btn{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}

/* ─── 6. STRATA Overview — fix sticky thead clipping ─── */
.strata-directory{ overflow:visible !important; }
.strata-directory > .tw{ overflow:hidden; border-radius:0 0 14px 14px; margin:0 -28px; padding:0; }

/* ─── 7. Faculty Registry — Office of the Dean card ─── */
.dean-card{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-left:3px solid var(--gold) !important;
  border-radius:14px !important;
  color:var(--text) !important;
}
.dean-card-portrait img{ filter:contrast(1.05) saturate(.92); }
.dean-card-eyebrow{
  font-family:var(--mono) !important;
  color:var(--gold) !important;
  font-size:10px !important;
  letter-spacing:1.8px !important;
  text-transform:uppercase !important;
}
.dean-card-name{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:28px !important;
  letter-spacing:-.01em !important;
  color:var(--text) !important;
}
.dean-card-stage{
  color:var(--text-low) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
}
.dean-card-power{
  background:rgba(212,168,74,.08) !important;
  border:1px solid rgba(212,168,74,.25) !important;
  border-radius:8px !important;
  padding:10px 14px !important;
  color:var(--text) !important;
}
.dean-card-power-tag{
  color:var(--gold) !important;
  font-family:var(--mono) !important;
  font-size:9.5px !important;
  letter-spacing:1.6px !important;

  text-transform:uppercase !important;
  margin-right:10px;
}
.dean-card-bio{
  color:var(--text-mid) !important;
  line-height:1.7 !important;
  font-size:14.5px !important;
}

/* ─── 8. Faculty Registry — section names + subtitles ─── */
.freg-group-name{
  font-family:var(--serif) !important;
  font-weight:600;
  font-size:22px;
  letter-spacing:-.005em;
  color:var(--text) !important;
}
.freg-group-count{
  color:var(--text-low) !important;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:1.5px;
}
.freg-group-note{
  color:var(--text-mid) !important;
  font-size:14px;
  line-height:1.7;
}
.freg-tbl tbody td, .freg-tbl thead th{ color:var(--text-mid); }
.freg-tbl tbody td{ border-bottom:1px solid var(--rule-faint); }
.preg-tbl tbody td, .preg-tbl thead th{ color:var(--text-mid); }
.preg-na{ color:var(--text-low) !important; font-style:italic; }
.preg-col-power{ color:var(--text) !important; font-weight:500; }

/* ─── 9. Tier-pill — readable on coloured background ─── */
.tier-pill{
  border:1px solid rgba(0,0,0,.3);
  font-weight:700;
  text-shadow:0 1px 0 rgba(0,0,0,.45);
}

/* ─── 10. JOIN page layout — full width ─── */
.join, .join-form-wrap{
  max-width:1280px !important;
  margin:0 auto !important;
}
.join-form-wrap{ padding:32px 40px 48px !important; }
.join-typegrid{
  display:grid !important;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)) !important;
  gap:14px !important;
  margin-top:14px;
}
.join-typegrid > button, .join-type-card{
  width:100% !important;
}
.join-step{ margin-bottom:32px; }
.join-step-tag{
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:2px !important;
  font-weight:700 !important;
  color:var(--gold) !important;
  background:rgba(212,168,74,.08) !important;
  border:1px solid rgba(212,168,74,.35) !important;
  border-radius:999px !important;
  padding:6px 14px !important;
  display:inline-block !important;
  margin-bottom:14px;
  text-transform:uppercase;
}
.join-step-title{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:32px !important;
  letter-spacing:-.015em !important;
  line-height:1.1 !important;
  color:var(--text) !important;
  background:transparent !important;
  margin-bottom:8px;
  padding:0 !important;
}
.join-step-blurb{
  color:var(--text-mid) !important;
  font-size:15px;
  line-height:1.65;
  max-width:640px;
  margin-bottom:22px;
}
.join-fieldset{
  display:grid !important;
  grid-template-columns:repeat(2, minmax(0,1fr)) !important;
  gap:18px 20px !important;
  align-items:start;
}
.join-field, .join-field-row{ min-width:0; }
.join-field.is-full, .join-field--full{ grid-column:1/-1; }
.join-input::placeholder, .join-textarea::placeholder{
  color:rgba(241,237,228,.50) !important;
  font-style:italic;
}
.join-checkbox{
  color:var(--text) !important;
  font-size:14px;
  line-height:1.55;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.join-checkbox input{ flex-shrink:0; margin-top:3px; }
.join-checkbox span{ color:var(--text); }
@media (max-width:720px){
  .join-fieldset{ grid-template-columns:1fr !important; }
  .join-form-wrap{ padding:20px 18px 36px !important; }
}

/* ─── 11. Empty-state CTA (Students, Faculty, Powers) ─── */
.empty-state-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding:24px 16px;
}
.empty-cta{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 20px;
  background:linear-gradient(180deg, var(--red-bright), var(--red));
  color:var(--text) !important;
  border:1px solid var(--gold);
  border-radius:8px;
  font-family:var(--sans);
  font-weight:700;
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none !important;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  box-shadow:0 4px 0 0 var(--red-deep);
}
.empty-cta:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 0 0 var(--red-deep);
  color:var(--text) !important;
}

/* Powerball arena rules (kbr) — dark surface inheritance */
.kbr, .kbr-hd, .kbr-tabs, .kbr-tab, .kbr-body{
  color:var(--text);
}
.kbr-role, .kbr-arena-tile{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  color:var(--text);
}
.kbr-role-num, .kbr-role-tagline{ color:var(--text-low); }

/* Strata corporate — text in role labels */
.strc-role-label, .strc-role-who, .strc-group-note{ color:var(--text); }
.strc-role.is-vacant .strc-role-who .strc-role-open{ color:var(--text-low); font-style:italic; }
.strc-role-sep{ color:var(--text-low); }

/* Hero list contained text */
.hero-list, .hero-list-hd, .hero-list-label, .hero-list-desc, .hero-list-req{ color:var(--text); }
.hero-list-req{ color:var(--text-low); font-family:var(--mono); font-size:10px; letter-spacing:1.4px; }

/* Group / collective text */
.group, .group-hd, .group-name, .group-type, .group-desc, .groups-intro, .groups-intro-title, .groups-intro-body, .group-empty{ color:var(--text); }
.group-type, .groups-intro-title{ color:var(--gold); }
.group-desc, .groups-intro-body{ color:var(--text-mid) !important; }
.group-empty{ color:var(--text-low); font-style:italic; }

/* Student-row stage-name */
.stage-name{ font-family:var(--display); letter-spacing:.04em; color:var(--text); }

/* ─── 12. Join hero — match the editorial dark page-head, add crest watermark ─── */
.join-hero{
  background:
    radial-gradient(1200px 600px at 90% -100%, rgba(193,26,44,.20), transparent 60%),
    radial-gradient(1200px 600px at -20% 120%, rgba(212,168,74,.10), transparent 60%),
    linear-gradient(180deg, #0a0a0e 0%, #0f0f15 100%) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  position:relative;
  overflow:hidden;
}
.join-hero::before{
  display:none !important;
}
.join-hero::after{
  content:"";
  position:absolute; inset:0;
  background-image:
    url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png'),
    radial-gradient(rgba(212,168,74,.15) 1px, transparent 1.4px);
  background-size: 280px auto, 14px 14px;
  background-position: calc(100% - 24px) center, 0 0;
  background-repeat: no-repeat, repeat;
  opacity:.20;
  filter:saturate(.4) brightness(.6);
  mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
             linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
                     linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  pointer-events:none;
  z-index:0;
}
.join-hero-inner{ position:relative; z-index:1; max-width:1280px !important; padding:64px 40px 56px !important; margin:0 auto; }
.join-hero-stamp{
  background:transparent !important;
  color:var(--gold) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:999px !important;
  padding:5px 12px !important;
  font-size:10px !important;
  letter-spacing:2px !important;
  font-weight:600 !important;
  display:inline-block !important;
  margin-bottom:14px;
}
.join-hero h2{
  font-family:var(--serif) !important;
  font-weight:500 !important;
  font-size:64px !important;
  line-height:1.02 !important;
  letter-spacing:-.018em !important;
  text-transform:none !important;
  color:var(--text) !important;
}
.join-hero h2 .accent{
  color:var(--gold-bright) !important;
  font-style:italic;
  font-weight:400;
}
.join-hero p{
  color:var(--text-mid) !important;
  font-size:16px !important;
  line-height:1.7 !important;
  max-width:640px !important;
}
.join-hero p strong{ color:var(--text) !important; }
@media (max-width:900px){
  .join-hero h2{ font-size:42px !important; }
  .join-hero-inner{ padding:44px 22px 36px !important; }
}

.join-checkbox input[type="checkbox"]{ flex-shrink:0; margin-top:3px; accent-color:var(--gold); width:18px; height:18px; }

/* ─── P2 Page-head: pull crest BEHIND the badge, opaque badge tile ─── */
.pg-hd::after{
  /* push crest further left so it doesn't sit under the right-side badge */
  background-position: calc(100% - 280px) center, 0 0 !important;
  background-size: 200px auto, 14px 14px !important;
  opacity:.13 !important;
  z-index:0 !important;
}
.pg-hd-inner{ position:relative; z-index:2 !important; }
.pg-hd-note{
  position:relative;
  z-index:3 !important;
  background:rgba(10,10,14,.78) !important;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-left:3px solid var(--gold) !important;
  border-radius:0 8px 8px 0 !important;
  padding:12px 16px !important;
  color:var(--silver) !important;
}
.pg-hd-note.warn{
  border-left-color:var(--red-bright) !important;
  color:#f9b3b8 !important;
}

/* ─── P3 STRATA Overview thead: hoist to top, kill sticky inside short table ─── */
.strata-directory{ overflow:visible !important; padding:28px !important; }
.strata-directory > .tw{ overflow:visible !important; border:1px solid var(--rule-soft); border-radius:12px; margin:0; }
.strata-directory > .tw table thead tr th{
  position:static !important;
  top:auto !important;
  z-index:auto !important;
  background:var(--ink-2) !important;
  border-radius:0 !important;
}
.strata-directory > .tw table thead tr:first-child th:first-child{ border-top-left-radius:12px !important; }
.strata-directory > .tw table thead tr:first-child th:last-child{ border-top-right-radius:12px !important; }
.strata-directory > .tw table tbody tr:last-child td:first-child{ border-bottom-left-radius:12px !important; }
.strata-directory > .tw table tbody tr:last-child td:last-child{ border-bottom-right-radius:12px !important; }

/* ─── P6 Students empty state: tighten ─── */
.empty-state-block{
  padding:24px 16px !important;
  gap:12px !important;
}
tbody td:has(.empty-state-block){ padding:12px 16px !important; }

/* SAFETY NET: any remaining color:var(--ink) text on dark surfaces becomes light */
[class*="-desc"], [class*="-blurb"], [class*="-note"], [class*="-text"]{
  color:var(--text-mid);
}

ilter-pill.on, .chip.on, .pill.on{ background:rgba(241,205,114,.18) !important; color:#ffe199 !important; border:1px solid rgba(241,205,114,.55) !important; } /* Status chips (HEROES / SHARED / SIDEKICKS) — add a leading symbol so colorblind users get info from shape, not just color */ .class-chip-tag::before, .curr-class-tag::before{ display:inline-block; margin-right:4px; font-weight:700; } .class-chip-tag[data-track="heroes"]::before, .curr-class-tag.heroes::before{ content:"●"; } .class-chip-tag[data-track="sidekicks"]::before, .curr-class-tag.sidekicks::before{ content:"▲"; } .class-chip-tag[data-track="shared"]::before, .curr-class-tag.shared::before{ content:"◆"; } /* Strong visible focus ring for keyboard nav */ a:focus-visible, button:focus-visible, [role="tab"]:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible, .club:focus-visible, .club-filter-pill:focus-visible, .tier-card:focus-visible{ outline:3px solid var(--a11y-focus) !important; outline-offset:2px !important; box-shadow:0 0 0 5px rgba(255,210,74,.25) !important; border-radius:4px; } /* Make all interactive controls minimum 40px tall for motor-impairment users */ button, .btn, [role="button"], .club-filter-pill, .tab, [role="tab"], .pill, .chip-action{ min-height:40px !important; padding-top:8px !important; padding-bottom:8px !important; } /* Form inputs: bigger text, brighter placeholder */ input, select, textarea{ font-size:15px !important; color:var(--a11y-text) !important; } input::placeholder, textarea::placeholder{ color:#9a958a !important; opacity:1 !important; } /* Selection contrast */ ::selection{ background:#ffd24a; color:#0e0e10; } /* prefers-contrast: more — push everything toward maximum legibility */ @media (prefers-contrast: more){ :root{ --a11y-text:#ffffff !important; --a11y-text-mid:#f0ebde !important; --a11y-text-low:#cfc9b8 !important; } .club-hd, .club-side-hd{ box-shadow:inset 0 0 0 2px rgba(0,0,0,.5) !important; } .club-cat-pip, .club-filter-pill.on{ background:rgba(241,205,114,.3) !important; border-color:#f1cd72 !important; color:#fff !important; } a, .link{ text-decoration:underline !important; text-underline-offset:3px; } } /* Skip-to-content link for keyboard users (hidden until focused) */ .a11y-skip{ position:fixed; top:-100px; left:8px; z-index:9999; background:#ffd24a; color:#0e0e10; padding:10px 16px; font-weight:700; border-radius:6px; transition:top .15s; } .a11y-skip:focus{ top:8px; }

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 5 — CONTRAST SAFETY NET (after a11y layer; final cascade winner)  ║
   ║  Catches all chip/tag/pill/labelled-bg cases where text+bg can collide. ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Status-card tag (Powers Guide → status cards) — data drives bg + text;
   force light text + drop-shadow so any saturated bg is readable. */
.status-card-tag{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.55) !important;
  font-weight:700 !important;
}
/* Vanguard amber needs dark text not white; text-shadow alone is insufficient */
.status-card-tag[style*="background:#d4901a"],
.status-card-tag[style*="background: #d4901a"]{
  color:#1a0e00 !important;
  text-shadow:0 1px 0 rgba(255,255,255,.25) !important;
}

/* House / club / team coloured headers — white + drop-shadow on every brand bg */
.club-hd, .club-hd *,
.club-side-hd, .club-side-hd *,
.kb-team-hd, .kb-team-hd *,
.lore-house-hd, .lore-house-hd *{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.55) !important;
}

/* Tier-pill — always white + drop-shadow regardless of inline bg */
.tier-pill{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) !important;
  font-weight:700 !important;
}

/* Hero-list section — letter, label, desc, requirement pill */
.hero-list-letter{ filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.hero-list-label{ color:var(--text) !important; }
.hero-list-desc{ color:var(--text-mid) !important; }
.hero-list-req{
  background:rgba(212,168,74,.10) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:6px !important;
}

/* NPC + chip variants — guarantee dark-on-dark / light-on-light never lands */
.npc-badge{
  background:rgba(212,168,74,.14) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  text-shadow:none !important;
}
.chip{ text-shadow:none !important; }
.chip-classified{
  background:repeating-linear-gradient(45deg, rgba(228,50,74,.7) 0 6px, rgba(125,16,24,.7) 6px 12px) !important;
  color:#ffffff !important;
  border:1px solid rgba(228,50,74,.5) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.7) !important;
}
.chip-red{
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  color:#ffffff !important;
  border:1px solid rgba(255,255,255,.1) !important;
}
.chip-ghost{
  background:transparent !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
}
.chip-ink{
  background:rgba(255,255,255,.06) !important;
  color:var(--silver) !important;
  border:1px solid var(--rule-soft) !important;
}

/* Track tags (HEROES / SIDEKICKS) in faculty registry tables */
.track-tag-hero{
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  color:#ffffff !important;
  border:1px solid rgba(255,255,255,.08) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.6) !important;
}
.track-tag-sidekick{
  background:rgba(255,255,255,.04) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
}

/* House-cell name in tables */
.house-cell-name{ color:var(--text) !important; }

/* Catch-all for any inline color:var(--ink*) or hardcoded near-black that
   survived from older code paths (STRATA Talent rows, etc.) */
[style*="color:var(--ink)"],
[style*="color: var(--ink)"],
[style*="color:var(--ink-2)"],
[style*="color: var(--ink-2)"],
[style*="color:var(--ink-3)"],
[style*="color:#0e0e10"],
[style*="color: #0e0e10"],
[style*="color:#0a0a0c"],
[style*="color:#000"]{
  color:var(--text) !important;
}

/* Catch-all for inline bg=#54545c gray with dark text — force white */
[style*="background:#54545c"],
[style*="background: #54545c"]{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5) !important;
}

/* Form labels and step copy — beat any legacy white-on-white rule */
.join-field-label,
.join-field-label *,
.join-step-title,
.join-step-blurb,
.join-checkbox span{
  color:var(--text) !important;
}
.join-field-required{ color:var(--red-bright) !important; }
.join-field-hint{ color:var(--text-low) !important; font-weight:400 !important; }

/* EmptyState dot+label */
.empty,
.empty *{ color:var(--text-low) !important; }
.empty::before{ background:var(--rule) !important; }

/* Final fallback — any element whose class includes "muted" / "faint" gets
   readable mid-grey instead of inheriting a near-paper colour */
[class*="muted"]:not(.club-meta):not(.block-meta):not(.gs-panel-count),
[class*="faint"]{
  color:var(--text-mid) !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 6 — CURRICULUM REDESIGN (streamlined, single-list layout)         ║
   ║  Year tabs → year head → toolbar → unified list → footnote.             ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

.curr{
  max-width:1100px !important;
  margin:0 auto !important;
  padding:24px 32px 48px !important;
  color:var(--text);
}

/* Year tab strip */
.curr-yeartabs{
  display:grid !important;
  grid-template-columns:repeat(4, 1fr) !important;
  gap:8px !important;
  padding:0 !important;
  margin-bottom:32px;
  background:transparent !important;
  border:none !important;
}
.curr-yeartab{
  display:flex !important;
  flex-direction:column !important;
  align-items:flex-start !important;
  gap:4px !important;
  padding:14px 18px !important;
  background:rgba(255,255,255,.025) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:10px !important;
  color:var(--text-mid) !important;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  text-align:left !important;
}
.curr-yeartab:hover{ border-color:rgba(212,168,74,.3) !important; color:var(--text) !important; }
.curr-yeartab.on{
  background:rgba(212,168,74,.08) !important;
  border-color:var(--gold) !important;

}
.curr-yeartab-num{
  font-family:var(--mono) !important;
  font-size:10px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  color:var(--gold) !important;
}
.curr-yeartab-label{
  font-family:var(--sans) !important;
  font-size:14px !important;
  font-weight:600 !important;
  color:inherit !important;
  letter-spacing:0 !important;
}

/* Year head */
.curr-yearhead{
  margin-bottom:24px;
  padding-bottom:24px;
  border-bottom:1px solid var(--rule-soft);
}
.curr-yearhead-eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold);
  margin-bottom:10px;
}
.curr-yearhead-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:36px;
  letter-spacing:-.018em;
  line-height:1.1;
  color:var(--text);
  margin:0 0 14px;
  max-width:680px;
  text-wrap:balance;
}
.curr-yearhead-tracks{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.curr-yearhead-line{
  color:var(--text-mid);
  font-size:14px;
  line-height:1.6;
  margin:0;
  display:flex;
  gap:10px;
  align-items:baseline;
}
.curr-yearhead-tag{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  font-weight:700;
  padding:3px 8px;
  border-radius:4px;
  border:1px solid var(--rule-soft);
  flex-shrink:0;
}
.curr-yearhead-tag.t-hero{ color:var(--red-bright); border-color:rgba(228,50,74,.4); }
.curr-yearhead-tag.t-sidekick{ color:var(--gold-bright); border-color:rgba(212,168,74,.4); }

/* Toolbar — counts + filter pills */
.curr-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.curr-counts{
  font-family:var(--sans);
  font-size:13px;
  color:var(--text-mid);
  font-weight:500;
}
.curr-counts strong{ color:var(--text); font-weight:700; }
.curr-counts-sep{ color:var(--text-low); margin:0 6px; }
.curr-filter{ display:flex; gap:6px; flex-wrap:wrap; }
.curr-filter-pill{
  background:rgba(255,255,255,.03) !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:999px !important;
  padding:6px 14px !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.5px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  min-height:auto !important;
}
.curr-filter-pill:hover{ color:var(--text) !important; border-color:rgba(212,168,74,.3) !important; }
.curr-filter-pill.on{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}

/* Unified class list */
.curr-list{
  list-style:none !important;
  padding:0 !important;
  margin:0 !important;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.curr-row{
  background:rgba(255,255,255,.02);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  overflow:hidden;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.curr-row:hover{ border-color:rgba(212,168,74,.25); background:rgba(212,168,74,.03); }
.curr-row.is-open{ border-color:rgba(212,168,74,.4); background:rgba(212,168,74,.05); }
.curr-row-empty{
  padding:24px;
  text-align:center;
  color:var(--text-low);
  font-style:italic;
  background:rgba(255,255,255,.02);
  border:1px dashed var(--rule-soft);
  border-radius:10px;
}
.curr-row-btn{
  display:grid !important;
  grid-template-columns:1fr auto auto auto !important;
  gap:14px !important;
  align-items:center !important;
  width:100% !important;
  padding:14px 18px !important;
  background:transparent !important;
  border:none !important;
  cursor:pointer;
  text-align:left;
  font-family:var(--sans) !important;
  color:var(--text) !important;
  min-height:auto !important;
  border-radius:0 !important;
  letter-spacing:0 !important;
  text-transform:none !important;
}
.curr-row-btn:disabled{ cursor:default; }
.curr-row-btn:hover:not(:disabled) .curr-row-name{ color:var(--gold-bright); }
.curr-row-name{
  font-family:var(--sans) !important;
  font-weight:600 !important;
  font-size:14.5px !important;
  color:var(--text) !important;
  text-transform:none !important;
  letter-spacing:0 !important;
  transition:color var(--dur) var(--ease);
  min-width:0;
}
.curr-row-kind{
  font-family:var(--mono) !important;
  font-size:9.5px !important;
  letter-spacing:1.4px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  padding:3px 9px !important;
  border-radius:4px !important;
  border:1px solid !important;
  white-space:nowrap;
}
.curr-row-kind.is-required{
  color:var(--gold-bright) !important;
  border-color:rgba(212,168,74,.4) !important;
  background:rgba(212,168,74,.05) !important;
}
.curr-row-kind.is-elective{
  color:var(--silver) !important;
  border-color:var(--rule-soft) !important;
  background:rgba(255,255,255,.02) !important;
}
.curr-row-track{
  font-family:var(--mono) !important;
  font-size:9.5px !important;
  letter-spacing:1.4px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  padding:3px 9px !important;
  border-radius:4px !important;
  border:1px solid !important;
  white-space:nowrap;
}
.curr-row-track.t-hero{
  color:var(--red-bright) !important;
  border-color:rgba(228,50,74,.4) !important;
  background:rgba(228,50,74,.05) !important;
}
.curr-row-track.t-sidekick{
  color:var(--gold-bright) !important;
  border-color:rgba(212,168,74,.4) !important;
  background:rgba(212,168,74,.05) !important;
}
.curr-row-track.t-shared{
  color:var(--silver-bright) !important;
  border-color:var(--rule-soft) !important;
  background:rgba(201,205,211,.05) !important;
}
.curr-row-toggle{
  font-family:var(--mono) !important;
  font-size:18px !important;
  font-weight:400 !important;
  color:var(--gold) !important;
  width:24px;
  text-align:center;
  line-height:1;
}
.curr-row.has-desc .curr-row-name::after{
  content:"";
  display:inline-block;
  width:6px; height:6px;
  margin-left:8px;
  border-radius:50%;
  background:rgba(212,168,74,.4);
  vertical-align:2px;
  opacity:.5;
}
.curr-row-desc{
  padding:0 18px 16px 18px !important;
  color:var(--text-mid) !important;
  font-size:13.5px !important;
  line-height:1.7 !important;
  background:rgba(0,0,0,.15);
  border-top:1px solid var(--rule-faint);
  margin-top:0;
}

/* Footnote — quiet italic, no big stamp */
.curr-finenote{
  margin-top:32px;
  padding:18px 22px;
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.7;
  color:var(--text-low);
  font-style:italic;
  border-left:2px solid var(--rule-soft);
  background:transparent;
  max-width:780px;
}
.curr-finenote-hit{
  color:var(--text-mid);
  font-style:italic;
  font-weight:500;
}

@media (max-width:720px){
  .curr{ padding:16px 18px 32px !important; }
  .curr-yeartabs{ grid-template-columns:repeat(2, 1fr) !important; }
  .curr-yearhead-title{ font-size:28px; }
  .curr-row-btn{ grid-template-columns:1fr auto !important; gap:8px !important; padding:12px 14px !important; }
  .curr-row-track{ display:none !important; }
  .curr-row-toggle{ grid-column:2; grid-row:1; }
  .curr-row-kind{ grid-column:1/-1; justify-self:start; margin-top:4px; }
}

/* Override earlier wave 4 curriculum styles that built the multi-card layout
   we just removed (old .curr-overview, .curr-tracks, .curr-classes-section). */
.curr-overview, .curr-tracks, .curr-track,
.curr-classes, .curr-classes-section, .curr-classes-hd,
.curr-classes-tag, .curr-classes-blurb, .curr-classes-list,
.curr-class-empty, .fine-print, .fine-print-stamp, .fine-print-text{
  /* harmless reset — these elements no longer render */
  all:unset;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 7 — CURRICULUM RESTYLE: bigger, bolder, easier to scan            ║
   ║  Higher-contrast surfaces, solid-colour track pills, gold required bar. ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Container — generous canvas */
.curr{
  max-width:1100px !important;
  margin:0 auto !important;
  padding:32px 32px 56px !important;
}

/* Year tabs — taller and clearer active state */
.curr-yeartabs{
  display:grid !important;
  grid-template-columns:repeat(4, 1fr) !important;
  gap:10px !important;
  margin-bottom:36px !important;
  padding:0 !important;
}
.curr-yeartab{
  display:flex !important;
  flex-direction:column !important;
  gap:6px !important;
  padding:18px 20px !important;
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:12px !important;
  color:var(--text-mid) !important;
  cursor:pointer;
  text-align:left !important;
  transition:all var(--dur) var(--ease);
}
.curr-yeartab:hover{
  border-color:rgba(212,168,74,.4) !important;
  color:var(--text) !important;
  transform:translateY(-1px);
}
.curr-yeartab.on{
  background:linear-gradient(180deg, rgba(212,168,74,.14), rgba(212,168,74,.04)) !important;
  border-color:var(--gold) !important;
  color:var(--text) !important;
  box-shadow:0 0 0 1px var(--gold), 0 12px 28px -18px rgba(212,168,74,.5);
}
.curr-yeartab-num{
  font-family:var(--mono) !important;
  font-size:11px !important;
  letter-spacing:1.8px !important;
  font-weight:700 !important;
  color:var(--gold) !important;
  text-transform:uppercase !important;
}
.curr-yeartab-label{
  font-family:var(--serif) !important;
  font-size:18px !important;
  font-weight:600 !important;
  color:var(--text) !important;
  letter-spacing:-.005em !important;
  line-height:1.1 !important;
}

/* Year head — big serif title, refined intro lines */
.curr-yearhead{
  margin-bottom:32px;
  padding-bottom:28px;
  border-bottom:1px solid var(--rule-soft);
}
.curr-yearhead-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:2.2px;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold);
  margin-bottom:14px;
}
.curr-yearhead-title{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:44px !important;
  letter-spacing:-.02em !important;
  line-height:1.05 !important;
  color:var(--text) !important;
  margin:0 0 22px !important;
  max-width:760px;
}
.curr-yearhead-tracks{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.curr-yearhead-line{
  display:flex !important;
  gap:14px !important;
  align-items:flex-start !important;
  margin:0 !important;
  font-size:15px !important;
  line-height:1.6 !important;
  color:var(--text-mid) !important;
}
.curr-yearhead-tag{
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  padding:5px 11px !important;
  border-radius:6px !important;
  border:1px solid !important;
  flex-shrink:0;
  margin-top:1px;
}
.curr-yearhead-tag.t-hero{
  color:#ffffff !important;
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  border-color:rgba(255,255,255,.1) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5) !important;
}
.curr-yearhead-tag.t-sidekick{
  color:var(--ink) !important;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold)) !important;
  border-color:rgba(0,0,0,.2) !important;
}

/* Toolbar — counts left, filter pills right */
.curr-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-bottom:18px;
  flex-wrap:wrap;
  padding:14px 18px;
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-radius:10px;
}
.curr-counts{
  font-family:var(--sans);
  font-size:14px;
  color:var(--text-mid);
  font-weight:500;
}
.curr-counts strong{
  color:var(--text);
  font-weight:700;
  font-size:16px;
  font-family:var(--serif);
}
.curr-counts-sep{ color:var(--text-low); margin:0 8px; }
.curr-filter{ display:flex; gap:6px; flex-wrap:wrap; }
.curr-filter-pill{
  background:rgba(255,255,255,.04) !important;
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  padding:7px 14px !important;
  font-family:var(--sans) !important;
  font-size:12px !important;
  letter-spacing:.04em !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  min-height:auto !important;
}
.curr-filter-pill:hover{
  color:var(--text) !important;
  border-color:rgba(212,168,74,.4) !important;
  background:rgba(212,168,74,.06) !important;
}
.curr-filter-pill.on{
  background:linear-gradient(180deg, rgba(212,168,74,.18), rgba(212,168,74,.08)) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}

/* Class list — clearer cards, gold left bar = Required */
.curr-list{
  list-style:none !important;
  padding:0 !important;
  margin:0 !important;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.curr-row{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-left:4px solid var(--rule-soft) !important;
  border-radius:10px !important;
  overflow:hidden;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.curr-row:hover{
  border-color:rgba(212,168,74,.35) !important;
  border-left-color:rgba(212,168,74,.5) !important;
}
.curr-row.is-open{
  border-color:var(--gold) !important;
  border-left-color:var(--gold) !important;
  background:linear-gradient(180deg, rgba(212,168,74,.06), rgba(212,168,74,.02)) !important;
}
/* Required gets a gold left bar (replaces the tiny pill) */
.curr-row:has(.curr-row-kind.is-required){
  border-left-color:var(--gold) !important;
}
.curr-row:has(.curr-row-kind.is-required).is-open{
  border-left-color:var(--gold-bright) !important;
}

.curr-row-empty{
  padding:32px;
  text-align:center;
  color:var(--text-low);
  font-style:italic;
  background:transparent;
  border:1px dashed var(--rule-soft);
  border-radius:10px;
  list-style:none;
}

.curr-row-btn{
  display:grid !important;
  grid-template-columns:1fr auto auto auto !important;
  gap:18px !important;
  align-items:center !important;
  width:100% !important;
  padding:18px 22px !important;
  background:transparent !important;
  border:none !important;
  cursor:pointer;
  text-align:left;
  font-family:var(--sans) !important;
  color:var(--text) !important;
  min-height:auto !important;
  border-radius:0 !important;
  letter-spacing:0 !important;
  text-transform:none !important;
}
.curr-row-btn:disabled{ cursor:default; }
.curr-row-btn:hover:not(:disabled) .curr-row-name{ color:var(--gold-bright); }

.curr-row-name{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:18px !important;
  letter-spacing:-.005em !important;
  color:var(--text) !important;
  text-transform:none !important;
  line-height:1.25 !important;
  transition:color var(--dur) var(--ease);
  min-width:0;
}

/* "Required" gets a tiny gold dot before the name (in addition to the left bar) */
.curr-row:has(.curr-row-kind.is-required) .curr-row-name::before{
  content:"";
  display:inline-block;
  width:7px; height:7px;
  background:var(--gold);
  border-radius:50%;
  margin-right:10px;
  vertical-align:2px;
  box-shadow:0 0 0 3px rgba(212,168,74,.18);
}
/* Hide the small pill since the bar + dot now communicate it */
.curr-row-kind{
  display:none !important;
}

/* Track pill — solid, high-contrast colours */
.curr-row-track{
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  padding:5px 12px !important;
  border-radius:6px !important;
  border:1px solid !important;
  white-space:nowrap;
  flex-shrink:0;
}
.curr-row-track.t-hero{
  color:#ffffff !important;
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  border-color:rgba(255,255,255,.08) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5) !important;
}
.curr-row-track.t-sidekick{
  color:var(--ink) !important;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold)) !important;
  border-color:rgba(0,0,0,.2) !important;
}
.curr-row-track.t-shared{
  color:var(--ink) !important;
  background:linear-gradient(180deg, var(--silver-bright), var(--silver)) !important;
  border-color:rgba(0,0,0,.15) !important;
}

.curr-row-toggle{
  font-family:var(--mono) !important;
  font-size:22px !important;
  font-weight:300 !important;
  color:var(--gold) !important;
  width:28px;
  height:28px;
  display:flex !important;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(212,168,74,.10);
  border:1px solid rgba(212,168,74,.3);
  line-height:1;
  transition:all var(--dur) var(--ease);
}
.curr-row:hover .curr-row-toggle{
  background:rgba(212,168,74,.18);
  border-color:var(--gold);
  color:var(--gold-bright);
}
.curr-row.is-open .curr-row-toggle{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--ink);
}

/* Hide the dot indicator I added in Wave 6 */
.curr-row.has-desc .curr-row-name::after{ display:none !important; }

/* Description panel inside expanded row */
.curr-row-desc{
  padding:0 22px 20px 22px !important;
  color:var(--text-mid) !important;
  font-size:15px !important;
  line-height:1.7 !important;
  background:transparent !important;
  border-top:1px solid var(--rule-soft);
  margin-top:0;
}
.curr-row-desc::before{
  content:"";
  display:block;
  height:14px;
}

/* Footnote */
.curr-finenote{
  margin-top:40px;
  padding:22px 26px;
  font-family:var(--serif);
  font-size:15px;
  font-style:italic;
  line-height:1.7;
  color:var(--text-mid);
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-left:3px solid var(--gold);
  border-radius:10px;
  max-width:820px;
}
.curr-finenote-hit{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:600;
}

@media (max-width:720px){
  .curr{ padding:18px 18px 36px !important; }
  .curr-yeartabs{ grid-template-columns:repeat(2, 1fr) !important; }
  .curr-yearhead-title{ font-size:30px !important; }
  .curr-row-btn{
    grid-template-columns:1fr auto !important;
    gap:10px !important;
    padding:14px 16px !important;
  }
  .curr-row-track{ display:none !important; }
  .curr-row-name{ font-size:16px !important; }
}

/* WAVE 7b — kill dark-text-on-bright-pill. Every chip becomes dark surface
   with bright text, consistent with the rest of the dark theme. */
.curr-yearhead-tag.t-hero,
.curr-row-track.t-hero{
  color:#ffd9dd !important;
  background:rgba(228,50,74,.14) !important;
  border:1px solid rgba(228,50,74,.5) !important;
  text-shadow:none !important;
}
.curr-yearhead-tag.t-sidekick,
.curr-row-track.t-sidekick{
  color:var(--gold-bright) !important;
  background:rgba(212,168,74,.12) !important;
  border:1px solid rgba(212,168,74,.5) !important;
  text-shadow:none !important;
}
.curr-row-track.t-shared{
  color:var(--silver-bright) !important;
  background:rgba(201,205,211,.10) !important;
  border:1px solid rgba(201,205,211,.4) !important;
  text-shadow:none !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 8 — POWERS REGISTRY + FACULTY COURSE ARC + STUDENTS EMPTY STATE   ║
   ║  Force-overrides for legacy color:var(--paper) / cream bg rules.        ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Powers Registry rows — original CSS used color:var(--paper)/--paper-3 with
   !important (was near-white in light theme; reads as black-on-black now).
   Use very high specificity so we beat both the original and any inheritance. */
.preg-tbl tbody tr td.preg-col-char,
.preg-tbl tbody tr td.preg-col-char a,
.preg-tbl tbody tr td.preg-col-char .clink,
.preg-tbl tbody tr td.preg-col-char span{
  color:var(--text) !important;
  font-weight:600 !important;
  font-size:14.5px !important;
}
.preg-tbl tbody tr td.preg-col-alias,
.preg-tbl tbody tr td.preg-col-alias .preg-alias{
  color:var(--gold-bright) !important;
  font-family:var(--display) !important;
  letter-spacing:.04em !important;
  font-size:14px !important;
  font-weight:400 !important;
}
.preg-tbl tbody tr td.preg-col-power{
  color:var(--text-mid) !important;
  font-weight:500 !important;
  font-size:13.5px !important;
  line-height:1.55 !important;
}
.preg-tbl tbody tr td.preg-col-power.preg-na,
.preg-tbl tbody tr td.preg-col-power span.preg-na{
  color:var(--text-low) !important;
  font-style:italic;
}
.preg-row.is-clickable:hover td,
.preg-row.is-open td{
  background:rgba(212,168,74,.06) !important;
}

/* Faculty Registry hint banner — yellow bg + dark text was a light-theme
   banner. Convert to gold-tinted dark surface with gold text. */
.freg-hint{
  background:linear-gradient(180deg, rgba(212,168,74,.10), rgba(212,168,74,.04)) !important;
  color:var(--gold-bright) !important;
  border-top:1px solid rgba(212,168,74,.3) !important;
  border-bottom:1px solid rgba(212,168,74,.3) !important;
  padding:14px 32px !important;
  font-family:var(--mono) !important;
  font-size:11.5px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
}

/* Faculty Registry expanded course arc panel — was cream bg with dark text */
.freg-tbl tbody tr.freg-detail-row td{
  background:rgba(212,168,74,.04) !important;
  border-top:1px solid rgba(212,168,74,.18) !important;
  border-bottom:1px solid rgba(212,168,74,.18) !important;
  padding:18px 24px !important;
}
.freg-detail-label{
  color:var(--gold) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
}
.freg-arc-year{
  background:rgba(212,168,74,.14) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:4px !important;
  font-family:var(--mono) !important;
  font-size:10px !important;
  letter-spacing:1.4px !important;
  font-weight:700 !important;
  padding:4px 8px !important;
  text-align:center !important;
}
.freg-arc-title{
  color:var(--text) !important;
  font-family:var(--sans) !important;
  font-size:13.5px !important;
  font-weight:600 !important;
  letter-spacing:.02em !important;
  text-transform:none !important;
}

/* Faculty Registry "VIEW ▾" buttons — the small chip on each row.
   Original used white bg + ink text; map to gold ghost. */
.freg-view-btn{
  background:transparent !important;
  color:var(--gold) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:6px !important;
  padding:5px 10px !important;
  font-family:var(--mono) !important;
  font-size:10px !important;
  letter-spacing:1.4px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
}
.freg-row.is-clickable:hover .freg-view-btn,
.freg-row.is-open .freg-view-btn{
  background:rgba(212,168,74,.14) !important;
  color:var(--gold-bright) !important;
  border-color:var(--gold) !important;
}

/* Faculty Registry table cells generally */
.freg-tbl thead th{
  background:rgba(255,255,255,.02) !important;
  color:var(--gold) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
  border-bottom:1px solid var(--rule-soft) !important;
}
.freg-tbl tbody td{
  color:var(--text) !important;
  background:transparent !important;
  border-bottom:1px solid var(--rule-faint) !important;
  font-size:14px !important;
}
.freg-row.is-clickable:hover td,
.freg-row.is-open td{
  background:rgba(212,168,74,.06) !important;
}

/* Students empty state — when there are no rows, the empty cell takes a
   colSpan=7 row but the table headers and outer table wrapper still show.
   Make the empty state cell occupy a clear, centred panel and dim out the
   surrounding empty headers. */
.tw:has(.empty-state-block){
  background:transparent !important;
  border:none !important;
}
.tw:has(.empty-state-block) thead{
  display:none !important;
}
.tw:has(.empty-state-block) tbody td{
  border:none !important;
  padding:0 !important;
}
.empty-state-block{
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:18px !important;
  padding:64px 32px !important;
  margin:24px auto !important;
  max-width:520px;
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px dashed var(--rule-soft) !important;
  border-radius:14px !important;
  text-align:center !important;
}
.empty-state-block .empty{
  color:var(--text) !important;
  font-family:var(--mono) !important;
  font-size:13px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
  opacity:1 !important;
}
.empty-state-block .empty::before{
  width:9px !important;
  height:9px !important;
  background:var(--gold) !important;
  margin-right:8px;
}
.empty-state-block .empty-cta{
  margin-top:4px;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 9 — CRADLE PHASES + CASSANDRA INCIDENT (dark-on-dark headers)     ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Cradle phase cards (LoreHistory) — every text element used color:var(--ink) */
.prog-phase{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-top:4px solid var(--red) !important;
  border-radius:12px !important;
  color:var(--text);
}
.prog-phase:nth-child(2){ border-top-color:var(--gold) !important; }
.prog-phase:nth-child(3){ border-top-color:var(--h-grimere) !important; }
.prog-phase:nth-child(4){
  border-top-color:var(--silver-dim) !important;
  background:linear-gradient(180deg, var(--paper-2), var(--paper-3)) !important;
}
.prog-phase-era{
  color:var(--gold) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.8px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
}
.prog-phase-name{
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:30px !important;
  letter-spacing:-.01em !important;
  text-transform:none !important;
  font-weight:600 !important;
  line-height:1.05 !important;
  margin-top:4px !important;
}
.prog-phase-years{
  color:var(--text-mid) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  letter-spacing:1.6px !important;
  text-transform:uppercase !important;
  font-weight:700 !important;
  border-bottom-color:var(--rule-soft) !important;
}
.prog-phase-body{
  color:var(--text-mid) !important;
  font-size:14.5px !important;
  line-height:1.7 !important;
}
.prog-phase-body strong{
  color:var(--text) !important;
  font-weight:600 !important;
}
.prog-phase-body em{
  background:rgba(212,168,74,.12) !important;
  color:var(--gold-bright) !important;
  font-style:italic !important;
  padding:1px 6px !important;
  border-radius:3px !important;
  font-weight:500 !important;
}
.prog-phase-stat{
  background:rgba(255,255,255,.04) !important;
  color:var(--text) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:6px !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  padding:9px 12px !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 12 — TYPOGRAPHY OVERHAUL: muted status tags, no colour clashes    ║
   ║  Kill saturated solid-colour blocks site-wide. Coloured accent → bar.   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Status-card tag (POWER_STATUSES) — was solid saturated blocks per data.js
   bg colour. Now: unified muted dark surface, coloured 4px left bar based
   on the inline bg, themed text colour per status. !important required to
   override the inline style="background:#xxx". */
.status-card-tag{
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  padding:14px 18px 14px 22px !important;
  font-family:var(--sans) !important;
  font-size:17px !important;
  font-weight:700 !important;
  letter-spacing:.04em !important;
  text-shadow:none !important;
  position:relative !important;
  overflow:hidden !important;
  color:var(--text) !important;
  display:flex !important;
  align-items:center !important;
}
.status-card-tag span{
  color:var(--text) !important;
  text-shadow:none !important;
}
.status-card-tag::before{
  content:"" !important;
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:var(--gold);
}
/* Per-status accent bar + themed text from inline bg attribute */
.status-card-tag[style*="background:#1e40af"]::before,
.status-card-tag[style*="background: #1e40af"]::before{ background:#5b85d6; }
.status-card-tag[style*="background:#d4901a"]::before,
.status-card-tag[style*="background: #d4901a"]::before{ background:#e8b14a; }
.status-card-tag[style*="background:#e31b23"]::before,
.status-card-tag[style*="background: #e31b23"]::before{ background:#e4324a; }
.status-card-tag[style*="background:#15803d"]::before,
.status-card-tag[style*="background: #15803d"]::before{ background:#4ab866; }
.status-card-tag[style*="background:#0e0e10"]::before,
.status-card-tag[style*="background: #0e0e10"]::before{ background:#797571; }
.status-card-tag[style*="background:#54545c"]::before,
.status-card-tag[style*="background: #54545c"]::before{ background:#a8a298; }

.status-card-tag[style*="background:#1e40af"] span,
.status-card-tag[style*="background: #1e40af"] span{ color:#b8cdf2 !important; }
.status-card-tag[style*="background:#d4901a"] span,
.status-card-tag[style*="background: #d4901a"] span{ color:#f1cd72 !important; }
.status-card-tag[style*="background:#e31b23"] span,
.status-card-tag[style*="background: #e31b23"] span{ color:#ffd9dd !important; }
.status-card-tag[style*="background:#15803d"] span,
.status-card-tag[style*="background: #15803d"] span{ color:#b3e6c5 !important; }
.status-card-tag[style*="background:#0e0e10"] span,
.status-card-tag[style*="background: #0e0e10"] span{ color:var(--silver-bright) !important; }
.status-card-tag[style*="background:#54545c"] span,
.status-card-tag[style*="background: #54545c"] span{ color:var(--text) !important; }

/* Status-card surrounding card */
.status-card{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:12px !important;

  font-size:14.5px !important;

/* Powerball team headers (kb-team-hd) — same treatment as status tags */

  border-bottom:1px solid var(--rule-soft) !important;
  position:relative;
  color:var(--text) !important;
  text-shadow:none !important;
}
.kb-team-hd *{

}

}

body, .pg, .page{

}

/* Curriculum year-tab strip: kill sticky positioning. The original CSS made
   the strip sticky, but with the new card-style year tabs and gaps between
   them, the sticky overlay shows scrolled content through the gaps and
   stacks the year-tab text on top of class rows. Top-of-page navigation is
   plenty for picking a year. */
.curr-yeartabs{
  position:static !important;
  top:auto !important;
  z-index:auto !important;
  background:transparent !important;
  border:none !important;
  border-bottom:none !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  CREST WATERMARK — identical position/size on every page                ║
   ║  Single source of truth: 240px wide, right-aligned, .15 opacity.        ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* Apply to every page hero — PageHead variant + Join hero variant. */
.pg-hd::after,
.join-hero::after{
  content:"" !important;
  position:absolute !important;
  inset:0 !important;
  background-image:
    url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png'),
    radial-gradient(rgba(212,168,74,.10) 1px, transparent 1.4px) !important;
  background-size: 240px auto, 14px 14px !important;
  background-position: calc(100% - 36px) center, 0 0 !important;
  background-repeat: no-repeat, repeat !important;
  opacity:.15 !important;
  filter:saturate(.5) brightness(.7) !important;
  mix-blend-mode:normal !important;
  mask-image:linear-gradient(90deg, transparent 55%, rgba(0,0,0,.95) 100%) !important;
  -webkit-mask-image:linear-gradient(90deg, transparent 55%, rgba(0,0,0,.95) 100%) !important;
  pointer-events:none !important;
  z-index:0 !important;
}
.pg-hd-inner, .join-hero-inner{ position:relative; z-index:2 !important; }

/* Don't ALSO render a separate crest watermark inside Lore world's own
   intro slab — the page-head crest above it is canonical. */
.lore-intro::after{
  background-image: radial-gradient(rgba(212,168,74,.18) 1.4px, transparent 2px) !important;
  background-size: 12px 12px !important;
  background-position: 0 0 !important;
  opacity:.5 !important;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent) !important;
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent) !important;
  filter:none !important;
}

/* Mobile: scale crest down so it doesn't crowd the headline */
@media (max-width:900px){
  .pg-hd::after,
  .join-hero::after{
    background-size: 180px auto, 14px 14px !important;
    background-position: calc(100% - 16px) center, 0 0 !important;
    opacity:.12 !important;
  }
}

/* Outside role "OPEN" pill — was yellow bg with dim grey text. Replace
   with muted ghost chip matching the rest of the site's open-state pattern. */
.orgs-role-open,
.strc-role-open{
  background:rgba(255,255,255,.04) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:4px !important;
  padding:3px 8px !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.4px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
  font-style:normal !important;
  display:inline-block !important;
}

/* Faculty Registry "OPEN ROLE" + Powerball "OPEN" + any other yellow pill
   sitting on a saturated background — same treatment. */
[class*="open-pill"],
[class$="-open"]:not(.is-open):not(.curr-row.is-open):not(.preg-row.is-open),
.role-open,
.role-vacant,
.position-open{
  background:rgba(255,255,255,.04) !important;
  color:var(--gold-bright) !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:4px !important;
  padding:3px 8px !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.4px !important;
  font-weight:700 !important;
  text-transform:uppercase !important;
  font-style:normal !important;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 13 — FINAL CONTRAST SWEEP                                         ║
   ║  Original CSS used color:var(--ink) (near-black) for body text on a     ║
   ║  white --paper canvas. The dark-theme override flipped --paper dark but ║
   ║  left ~167 color:var(--ink) declarations untouched, producing dark-on-  ║
   ║  dark text that survived the earlier wave overrides. This wave rebinds  ║
   ║  --ink → --text on text-bearing elements inside the content panel, so   ║
   ║  any color:var(--ink) declaration resolves to readable light text.      ║
   ║  Custom-property scoping means we don't disturb the borders / panel     ║
   ║  backgrounds that legitimately use --ink as a structural dark colour.   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
.pg :is(p, li, dd, dt, span, strong, em, b, i, u, small, mark, time, abbr,
        cite, q, sub, sup, h1, h2, h3, h4, h5, h6,
        td, th, caption, figcaption, blockquote, summary, details, label,
        legend, address, code, kbd, samp, pre, a){
  --ink: var(--text);
}

/* Re-darken --ink where the element actually paints a yellow / white surface
   (chips, badges, the few light-bg pills that survived the dark sweep). */
.pg .chip-yellow, .pg .chip-gold,
.pg [style*="background:var(--yellow)"],
.pg [style*="background: var(--yellow)"],
.pg [style*="background:#ffcc00"], .pg [style*="background: #ffcc00"],
.pg [style*="background:#d4a84a"], .pg [style*="background: #d4a84a"],
.pg [style*="background:#ffffff"], .pg [style*="background: #ffffff"],
.pg [style*="background:#fff "], .pg [style*="background: #fff "],
.pg [style*="background:#fff;"], .pg [style*="background: #fff;"]{
  --ink: #0e0e10;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  BANNED bay — stamp readability + REJECTED tag contrast                 ║
   ║  Wave 10 collapsed every mono label to 11.5px which crushed the BANNED  ║
   ║  stamp on the Powers page; wave 2 muted the REJECTED tag to text-low    ║
   ║  grey. Restore the stamp to a display size and force the tag to white   ║
   ║  bold so it reads at a glance against the red badge background.         ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */
.banned-bay-stamp{
  font-size:26px !important;
  letter-spacing:.04em !important;
  font-weight:600 !important;
  font-family:var(--display) !important;
  color:#fff !important;
}
.banned-bay-tag{
  color:#ffffff !important;
  font-weight:800 !important;
  letter-spacing:1.6px !important;
  background:linear-gradient(180deg, var(--red), var(--red-deep)) !important;
  border:1px solid rgba(255,255,255,.15) !important;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 14 — CLUBS PAGE OVERHAUL                                          ║
   ║  Repaints every surface inside the Clubs tab and the slide-in detail    ║
   ║  panel for the dark canvas. Earlier waves hit the tile cards but left   ║
   ║  the schedule, court note, staff block, group rosters, and the         ║
   ║  Powerball-style team tables on the original light theme — which read  ║
   ║  as black text on dark surfaces once the global theme inverted. This   ║
   ║  wave forces the lot onto a unified dark-glass treatment with gold     ║
   ║  accent labels and serif headings to match the rest of the registry.   ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* ── tile grid — refine spacing and typography ─────────────────────────── */
.clubs-grid{
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)) !important;
  gap:18px !important;
}
.clubs-wrap{ padding:36px 32px !important; }
.club{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:14px !important;
  overflow:hidden !important;
  color:var(--text) !important;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease) !important;
}
.club:hover{
  transform:translateY(-2px) !important;
  box-shadow:0 18px 32px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(212,168,74,.25) !important;
  border-color:rgba(212,168,74,.35) !important;
}
.club.on{
  transform:translateY(-2px) !important;
  box-shadow:0 18px 32px -22px rgba(0,0,0,.7), 0 0 0 1px var(--gold) !important;
  border-color:var(--gold) !important;
}
.club-hd{
  border-bottom:none !important;
  padding:22px 22px 18px !important;
  position:relative !important;
  isolation:isolate !important;
}
.club-hd::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.35));
  pointer-events:none;
  z-index:-1;
}
.club-hd .club-name,
.club-hd .club-tag{
  color:#ffffff !important;
  text-shadow:0 1px 2px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.55) !important;
}
.club-hd .club-name{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:26px !important;
  letter-spacing:-.005em !important;
  text-transform:none !important;
  line-height:1.05 !important;
}
.club-hd .club-tag{
  font-family:var(--mono) !important;
  font-size:10px !important;
  letter-spacing:1.6px !important;
  font-weight:700 !important;
  opacity:.95 !important;
}
.club-meta{
  background:rgba(255,255,255,.025) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  padding:11px 22px !important;
  gap:10px !important;
}
.club-cat-pip{
  background:rgba(212,168,74,.10) !important;

}
.club-access{

  font-family:var(--mono) !important;
  font-size:10.5px !important;
  letter-spacing:1.4px !important;
  font-weight:600 !important;
  margin-left:auto !important;
}
.club-access::before{

}
.club-desc{

  font-family:var(--sans) !important;

  line-height:1.65 !important;

/* ── slide-in detail panel ─────────────────────────────────────────────── */
.club-side-panel{

.cp-schedule{

.cp-schedule-row{

.cp-schedule-tag,

<!-- 3. Sticky-offset auto-sync.
     The CSS uses --hdr-h and --tabs-h to position the sticky sub-nav directly
     below the tabs strip. Hardcoded values drift the moment the masthead or
     tabs are re-styled (it has happened across "wave" overrides). Measure the
     actual rendered heights and write them back into the CSS variables so
     the sticky nav always lands flush against the bottom of the tabs. -->
<script>
(function(){
  function syncStickyOffsets(){
    var masthead = document.querySelector('.masthead');
    var tabs     = document.querySelector('.tabs');
    if (!masthead || !tabs) return;
    var hdrH  = Math.round(masthead.getBoundingClientRect().height);
    var tabsH = Math.round(tabs.getBoundingClientRect().height);
    var root  = document.documentElement;
    root.style.setProperty('--hdr-h',  hdrH  + 'px');
    root.style.setProperty('--tabs-h', tabsH + 'px');
  }
  // Initial sync runs once React has painted; ResizeObserver keeps things in
  // sync when fonts load, the viewport resizes, or a wave style takes effect.
  function init(){
    syncStickyOffsets();
    if (typeof ResizeObserver === 'function'){
      var ro = new ResizeObserver(syncStickyOffsets);
      var masthead = document.querySelector('.masthead');
      var tabs     = document.querySelector('.tabs');
      if (masthead) ro.observe(masthead);
      if (tabs)     ro.observe(tabs);
    }
    window.addEventListener('resize', syncStickyOffsets);
  }
  // React mounts asynchronously via babel-standalone; poll briefly.
  var tries = 0;
  (function waitForChrome(){
    if (document.querySelector('.masthead') && document.querySelector('.tabs')){
      init();
    } else if (tries++ < 100){
      setTimeout(waitForChrome, 50);
    }
  })();
})();
</script>
