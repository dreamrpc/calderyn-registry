<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>CALDERYN COLLEGE — Central Registry</title>
<!-- Favicon — Calderyn College crest. Sized variants share the same
     source PNG; the browser picks the right one based on context
     (tab, bookmarks bar, pinned tab, iOS home screen). -->
<link rel="icon" type="image/png" href="https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png"/>
<link rel="shortcut icon" type="image/png" href="https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png"/>
<link rel="apple-touch-icon" href="https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png"/>
<!-- Pure font stack: Druk + Söhne (incl. Söhne Mono).
     Both self-hosted from /fonts/ via @font-face declarations at the
     top of polish.css. No third-party / Google Fonts loads. -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"/>
<style>

/* ════════════════════════════════════════════════════════════════════════
   CALDERYN COLLEGE — Marvel/DC modern web
   Bold panels. Strong color blocks. Clean modern sans throughout.
   Full-bleed. High contrast. Readable.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* ─── core palette — bold and confident ─── */
  --ink:        #0e0e10;          /* near-black */h
  --ink-2:      #18181c;          /* one tick up */
  --ink-3:      #24242a;          /* panel separators */
  --ink-soft:   #2e2e36;          /* hover states on dark */

  --paper:      #ffffff;          /* clean white */
  --paper-2:    #f7f7f9;          /* subtle off-white */
  --paper-3:    #ededf0;          /* tertiary panel */
  --paper-4:    #e0e0e6;          /* deepest light */

  --rule:       #1a1a1f;
  --rule-soft:  #d8d8de;
  --rule-faint: #ebebee;
  --muted:      #54545c;
  --faint:      #8a8a92;

  /* ─── accents — saturated, strong, comic-bold ─── */
  --red:        #e31b23;          /* primary action red — Marvel-vivid */
  --red-deep:   #9b0d12;          /* darker red for depth */
  --red-bright: #ff2a32;          /* highlight only */

  --yellow:     #ffcc00;          /* electric yellow — accent strips, captions */
  --yellow-deep:#d4a800;          /* darker yellow */

  --blue:       #1e6fff;          /* DC-blue, electric */
  --blue-deep:  #0a3da8;

  /* house colors — saturated comic primaries */
  --h-valaris:  #c41a1a;          /* heroic red */
  --h-orenne:   #d4901a;          /* warm amber */
  --h-saberis:  #15803d;          /* strong green */
  --h-grimere:  #1e40af;          /* royal blue */

  /* ─── typography ─── */
  /* PURE FONT STACK — Druk + Söhne family only. No web fallbacks
     to Inter / Bebas / Bungee / Fraunces / 'Söhne' / Times. */
  --sans:         'Söhne', system-ui, -apple-system, sans-serif;
  --display:      'Druk', 'Söhne Breit', 'Söhne', sans-serif;
  --display-wide: 'Druk Wide', 'Druk', 'Söhne Breit', sans-serif;
  --mono:         'Söhne Mono', ui-monospace, monospace;
  --serif:        'Söhne', system-ui, sans-serif;    /* legacy alias — points to Söhne */
  --comic:        'Druk', 'Söhne Breit', sans-serif; /* legacy alias — points to Druk */
  --comic-shade:  'Druk Wide', 'Druk', sans-serif;   /* legacy alias — points to Druk Wide */

  /* ─── header heights ───
     Must match the rendered heights of .mast-inner and the .tab strip
     (.tab height + 1px border-bottom). The dark theme override sets
     .mast-inner{height:84px} and .tab{height:52px}, so the sticky-offset
     vars below have to add up to 84 + (52+1) = 137px or the sub-nav
     lands with a gap below the tabs strip. */
  --hdr-h:      100px;
  --tabs-h:     53px;
  --sticky-tabs-top:   var(--hdr-h);
  --sticky-subnav-top: calc(var(--hdr-h) + var(--tabs-h));
  --hdr-subnav-h:      60px;
  --sticky-thead-top:  calc(var(--hdr-h) + var(--tabs-h));
  --sticky-thead-with-subnav-top: calc(var(--hdr-h) + var(--tabs-h) + var(--hdr-subnav-h));
}

/* ─── reset ─── */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ font-size:15px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  background:var(--paper);
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  line-height:1.55;
  min-height:100vh;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}

::selection{ background:var(--red); color:#fff; }
::-moz-selection{ background:var(--red); color:#fff; }

*:focus{ outline:none; }
*:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:2px;
}

/* ─── scrollbars ─── */
*{ scrollbar-width:thin; scrollbar-color:var(--ink-3) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--rule-soft); border-radius:0; }
*::-webkit-scrollbar-thumb:hover{ background:var(--red); }

/* ════════════════════════════════════════════════════════════════════════
   PAGE — full bleed. No max-width card. Edge-to-edge content.
   ════════════════════════════════════════════════════════════════════════ */
.page{
  width:100%;
  background:var(--paper);
  min-height:100vh;
  position:relative;
}

/* ════════════════════════════════════════════════════════════════════════
   MASTHEAD — bold dark bar, full-bleed.
   Left: brand wordmark. Center: status meta. Right: search.
   ════════════════════════════════════════════════════════════════════════ */
.masthead{
  background:var(--ink);
  border-bottom:3px solid var(--red);
  position:sticky;
  top:0;
  z-index:300;
}
.mast-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  height:var(--hdr-h);
  display:flex;
  align-items:center;
  gap:32px;
  padding:0 32px;
}

.mast-brand{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}
.mast-brand-mark{
  background:var(--red);
  color:#fff;
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  width:48px; height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:400;
  flex-shrink:0;
  position:relative;
}
.mast-brand-mark::after{
  content:'';
  position:absolute;
  inset:3px;
  border:1.5px solid rgba(255,255,255,.25);
  pointer-events:none;
}
.mast-brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
  line-height:1;
}
.mast-brand-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  color:#fff;
  font-weight:400;
}
.mast-brand-sub{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.6px;
  color:var(--yellow);
  text-transform:uppercase;
  font-weight:600;
}

.mast-meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:auto;
  flex-wrap:nowrap;
}
.mast-meta-cell{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  font-weight:600;
  white-space:nowrap;
}
.mast-meta-cell strong{
  color:#fff;
  font-weight:700;
}
.mast-meta-cell .dot{
  width:6px; height:6px;
  background:var(--yellow);
  border-radius:50%;
  flex-shrink:0;
}
.mast-meta-cell .dot.live{
  background:var(--red-bright);
  box-shadow:0 0 0 0 rgba(227,27,35,.6);
  animation:pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-red{
  0%,100%{ box-shadow:0 0 0 0 rgba(227,27,35,.5); }
  50%{ box-shadow:0 0 0 6px rgba(227,27,35,0); }
}
.mast-meta-sep{
  color:rgba(255,255,255,.15);
}

   @keyframes pulse-green{
        0%,100%{ box-shadow:0 0 0 0 rgba(22,163,74,.5); }
        50%{ box-shadow:0 0 0 6px rgba(22,163,74,0); }
   }
.mast-search{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--ink-2);
  border:1.5px solid var(--ink-3);
  padding:9px 14px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.6);
  min-width:280px;
  transition:border-color .15s, color .15s, background .15s;
  flex-shrink:0;
}
.mast-search:hover, .mast-search:focus-visible{
  border-color:var(--yellow);
  color:#fff;
  background:var(--ink-soft);
}
.mast-search-icon{ color:var(--yellow); font-size:13px; }
.mast-search-text{ flex:1; text-align:left; }
.mast-search-kbd{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  background:var(--ink);
  color:var(--yellow);
  letter-spacing:.5px;
  border:1px solid rgba(255,204,0,.3);
}

/* ════════════════════════════════════════════════════════════════════════
   TAB STRIP — bold horizontal nav, sticky below masthead
   ════════════════════════════════════════════════════════════════════════ */
.tabs{
  background:var(--ink-2);
  position:sticky;
  top:var(--hdr-h);
  z-index:200;
  border-bottom:1px solid var(--ink-3);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
}
.tab{
  position:relative;
  height:var(--tabs-h);
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  background:transparent;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:color .15s, background .15s;
}
.tab-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  color:var(--yellow);
  opacity:.7;
}
.tab:hover{ color:#fff; background:rgba(255,255,255,.04); }
.tab:hover .tab-num{ opacity:1; }
.tab.on{
  color:#fff;
  background:var(--ink);
}
.tab.on .tab-num{
  color:var(--red-bright);
  opacity:1;
}
.tab.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   PAGE BODY — full-bleed content area
   ════════════════════════════════════════════════════════════════════════ */
.pg{
  background:var(--paper);
  min-height:60vh;
}

/* page entry animation. opacity-only so the transformed ancestor
   doesn't break the sticky positioning of the sub-nav inside .pg. */
@keyframes page-enter{
  from{ opacity:0; }
  to{ opacity:1; }
}
.pg{ animation:page-enter .25s ease-out; }

/* ════════════════════════════════════════════════════════════════════════
   PAGE HEAD — hero banner for each section, full-bleed
   Dark band with stamp + display headline + body intro + side note
   ════════════════════════════════════════════════════════════════════════ */
.pg-hd{
  background:var(--ink);
  color:#fff;
  border-bottom:4px solid var(--red);
  position:relative;
  overflow:hidden;
}
.pg-hd::before{
  content:'';
  position:absolute;
  top:0; right:0;
  width:240px; height:100%;
  background:
    repeating-linear-gradient(
      -45deg,
      var(--red) 0,
      var(--red) 14px,
      var(--red-deep) 14px,
      var(--red-deep) 28px
    );
  opacity:.18;
  pointer-events:none;
}
.pg-hd-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:36px 32px 32px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:32px;
  align-items:flex-end;
  position:relative;
  z-index:1;
}
.pg-hd-title{ min-width:0; }
.pg-hd-stamp{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:5px 11px;
  margin-bottom:14px;
}
.pg-hd-stamp-mark{
  font-size:8px;
  color:var(--yellow);
}
.pg-hd h2{
  font-family:var(--display);
  font-size:64px;
  letter-spacing:.02em;
  line-height:.95;
  color:#fff;
  text-transform:uppercase;
  font-weight:400;
  margin-bottom:14px;
  text-wrap:balance;
}
.pg-hd-accent{
  color:var(--yellow);
}
.pg-hd p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:rgba(255,255,255,.78);
  max-width:680px;
  font-weight:400;
}
.pg-hd p strong{ color:#fff; font-weight:700; }
.pg-hd-note{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
  border-left:3px solid var(--yellow);
  padding:6px 0 6px 14px;
  line-height:1.7;
  flex-shrink:0;
}
.pg-hd-note.warn{
  border-left-color:var(--red-bright);
  color:#ffb8b8;
}

@media (max-width: 900px){
  .pg-hd-inner{ grid-template-columns:1fr; padding:28px 22px; }
  .pg-hd h2{ font-size:44px; }
  .pg-hd::before{ width:120px; }
}

/* ════════════════════════════════════════════════════════════════════════
   SUB-NAV — used in tabs with sub-views
   ════════════════════════════════════════════════════════════════════════ */
.subnav{
  background:var(--ink-2);
  position:sticky;
  top:var(--sticky-subnav-top);
  z-index:100;
  border-bottom:1px solid var(--ink-3);
}
.subnav-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.subnav-inner::-webkit-scrollbar{ display:none; }
.subnav-btn{
  position:relative;
  height:var(--hdr-subnav-h);
  padding:0 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  background:transparent;
  border:none;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
  flex-shrink:0;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  transition:color .15s, background .15s;
}
.subnav-btn:hover{ color:#fff; background:rgba(255,255,255,.04); }
.subnav-btn.on{
  color:#fff;
  background:var(--ink);
}
.subnav-btn.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--yellow);
}
.subnav-btn .sn-sub{
  font-family:var(--sans);
  font-size:11px;
  font-weight:500;
  letter-spacing:.02em;
  text-transform:none;
  color:rgba(255,255,255,.45);
}
.subnav-btn.on .sn-sub{ color:rgba(255,255,255,.7); }

/* ════════════════════════════════════════════════════════════════════════
   SECTION CONTAINER — every page section uses this for inner padding
   Background panel can span full width, content stays max-width.
   ════════════════════════════════════════════════════════════════════════ */
.section-wrap{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:32px;
}
.section-wrap-tight{ padding:24px 32px; }
.section-wrap-wide{ padding:48px 32px; }

@media (max-width: 720px){
  .section-wrap, .section-wrap-tight, .section-wrap-wide{ padding-left:18px; padding-right:18px; }
}

/* ════════════════════════════════════════════════════════════════════════
   TABLES — clean, bold, readable
   ════════════════════════════════════════════════════════════════════════ */
.tw{
  width:100%;
  background:var(--paper);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-family:var(--sans);
  font-size:14px;
}
thead{ background:var(--ink); }
thead tr th{
  background:var(--ink);
  color:#fff;
  padding:12px 18px;
  text-align:left;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  line-height:1.4;
  text-transform:uppercase;
  white-space:nowrap;
  vertical-align:middle;
  position:sticky;
  top:var(--sticky-thead-top);
  z-index:30;
  border-bottom:3px solid var(--red);
}
.subnav-host thead tr th{ top:var(--sticky-thead-with-subnav-top); }

/* Inner tables (inside cards / panels) — non-sticky */
.group .tw thead tr th,
.kb-team-tbl thead tr th,
.cp-rgroup-tbl thead tr th,
.club-side-panel thead tr th,
.hero-list .tw thead tr th{
  position:static;
  top:auto;
  z-index:auto;
}
   .subnav-host > .tw thead tr th{
        position:static;
        top:auto;
        z-index:auto;
   }

tbody td{
  padding:14px 18px;
  border-bottom:1px solid var(--rule-faint);
  vertical-align:middle;  color:var(--text);
     line-height:1.55;
}
tbody tr:nth-child(even) td{ background:var(--paper-2); }
tbody tr:hover td{ background:#fff5d4; }
tbody tr:last-child td{ border-bottom:none; }

.sec-row td{
  background:var(--red) !important;
  color:#fff !important;
  font-family:var(--display) !important;
  font-size:18px !important;
  letter-spacing:.04em !important;
  padding:10px 18px !important;
  border:none !important;
  text-transform:uppercase !important;
  font-weight:400 !important;
}
.sub-row td{
  background:var(--ink-2) !important;
  color:rgba(255,255,255,.7) !important;
  font-family:var(--sans) !important;
  font-size:13px !important;
  font-weight:400 !important;
  padding:10px 18px !important;
  border:none !important;
  letter-spacing:0 !important;
  text-transform:none !important;
  line-height:1.55 !important;
}

/* row-num utility */
.rn{
  color:var(--faint);
  font-family:var(--mono);
  font-size:11px;
  text-align:right;
  width:48px;
  padding-right:14px !important;
  font-variant-numeric:tabular-nums;
}

/* ════════════════════════════════════════════════════════════════════════
   COMMON PRIMITIVES — links, chips, badges, empty states, tier pills
   ════════════════════════════════════════════════════════════════════════ */
a.clink{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
  border-bottom:2px solid var(--red);
  transition:color .12s, border-color .12s;
}
a.clink:hover{ color:var(--red); border-bottom-color:var(--ink); }
span.cname{ font-weight:600; color:var(--ink); }

.empty{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--faint);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.empty::before{
  content:'';
  display:inline-block;
  width:7px; height:7px;
  background:var(--rule-soft);
  border-radius:50%;
}

.npc-badge{
  display:inline-block;
  margin-left:8px;
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:2px 6px;
  vertical-align:1px;
  cursor:default;
  user-select:none;
}

.chip{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:4px 9px;
  line-height:1.4;
  white-space:nowrap;
}
.chip-ink{    background:var(--ink);    color:#fff; }
.chip-yellow{ background:var(--yellow); color:var(--ink); }
.chip-red{    background:var(--red);    color:#fff; }
.chip-gold{   background:var(--yellow-deep); color:var(--ink); }
.chip-ghost{
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--rule-soft);
}
.chip-classified{
  background:var(--red);
  color:#fff;
  background-image:repeating-linear-gradient(45deg,
    rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 4px,
    transparent 4px, transparent 8px);
}

.tier-pill{
  display:inline-block;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
  min-width:64px;
  text-align:center;
}

.house-cell{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.house-cell-name{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
}
.hdot{
  display:inline-block;
  width:10px; height:10px;
  flex-shrink:0;
  border:2px solid var(--ink);
}

/* track tags — used in faculty registry */
.track-tags{
  display:inline-flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-start;
}
.track-tag{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  padding:3px 7px;

  white-space:nowrap;
  line-height:1.2;
}
.track-tag-hero{ background:var(--red); color:#fff; }
.track-tag-sidekick{ background:var(--ink); color:var(--yellow); }
.track-tag-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

/* subject list inside faculty rows */
.subject-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.subject-list li{
  padding:0;
  line-height:1.5;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.subject-line{
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--ink);
  text-transform:uppercase;
}
.subject-line::before{
  content:'·';
  display:inline-block;
  width:14px;
  color:var(--red);
  font-weight:700;
}
.subject-desc{
  font-family:var(--sans);
  font-size:13px;
  font-weight:400;
  color:var(--muted);
  line-height:1.55;
  padding-left:14px;
  max-width:560px;
}
.subject-list-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

.stage-name{
  font-family:var(--display);
  font-size:16px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  font-weight:400;
}
.stage-na{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.4px;
  color:var(--faint);
}
.stage-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

/* ════════════════════════════════════════════════════════════════════════
   RULES PAGE — bold numbered cards, alternating ink/red panels
   ════════════════════════════════════════════════════════════════════════ */
.rules-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
  gap:14px;
}
.rule{
  display:grid;
  grid-template-columns:88px 1fr;
  background:var(--paper-2);
  border:2px solid var(--ink);
  overflow:hidden;
  transition:transform .12s, box-shadow .12s;
}
.rule:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--red);
}
.rule-num{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
  color:var(--yellow);
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  line-height:1;
  font-weight:400;
  border-right:2px solid var(--ink);
}
.rule:nth-child(even) .rule-num{
  background:var(--red);
  color:#fff;
}
.rule-body{ padding:18px 22px; }
.rule-title{
  font-family:var(--sans);
  font-size:15px;
  font-weight:800;
  color:var(--ink);
  margin-bottom:6px;
  letter-spacing:.005em;
  line-height:1.3;
}
.rule-text{
  font-size:14px;
  color:var(--muted);
  line-height:1.65;
}

/* About-this-RP credit footer */
.about-bay{
  margin-top:32px;
  padding:24px 28px;
  background:var(--ink);
  color:#fff;
  border-left:6px solid var(--yellow);
}
.about-bay-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  padding:4px 10px;
  margin-bottom:12px;
}
.about-bay-text{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.7;
  color:rgba(255,255,255,.85);
  margin-bottom:10px;
  max-width:820px;
}
.about-bay-text:last-child{ margin-bottom:0; }
.about-bay-text-quiet{
  font-size:12px;
  color:rgba(255,255,255,.55);
}

/* ════════════════════════════════════════════════════════════════════════
   LORE — section blocks, big headlines, readable body
   ════════════════════════════════════════════════════════════════════════ */
.lore{ background:var(--paper); }
.lore-block{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:48px 32px;
  border-bottom:1px solid var(--rule-faint);
}
.lore-block:last-child{ border-bottom:none; }

/* Intro: full-bleed dark hero */
.lore-block.lore-intro{
  max-width:none;
  background:var(--ink);
  color:#fff;
  padding-left:0;
  padding-right:0;
  border-bottom:4px solid var(--red);
  position:relative;
}
.lore-block.lore-intro > *{
  width:100%;
  max-width:1600px;
  margin-left:auto;
  margin-right:auto;
  padding-left:32px;
  padding-right:32px;
}
.lore-intro-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  padding:5px 11px;
  margin-bottom:18px;
}
.lore-intro-title{
  font-family:var(--display);
  font-size:64px;
  line-height:.95;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:#fff;
  font-weight:400;
  margin:0 0 24px;
  max-width:980px;
  text-wrap:balance;
}
.lore-intro-title .accent{ color:var(--yellow); }
.lore-lead{
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  color:rgba(255,255,255,.82);
  margin:0 0 14px;
  max-width:820px;
}
.lore-lead:last-child{ margin-bottom:0; }
.lore-lead strong{ color:#fff; font-weight:700; }
.lore-lead em{ color:var(--yellow); font-style:normal; font-weight:600; }

.lore-eyebrow{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:8px;
  padding:3px 0;
  border-bottom:2px solid var(--red);
}
.lore-h{
  font-family:var(--display);
  font-size:42px;
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
  margin:0 0 22px;
  text-wrap:balance;
}
.lore-h .accent{ color:var(--red); }
.lore-p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  color:var(--ink);
  margin:0 0 16px;
  max-width:820px;
}
.lore-p:last-child{ margin-bottom:0; }
.lore-p strong{ color:var(--ink); font-weight:700; }
.lore-p em{
  font-style:normal;
  background:var(--yellow);
  color:var(--ink);
  padding:1px 5px;
  font-weight:600;
}

@media (max-width: 720px){
  .lore-block{ padding:32px 18px; }
  .lore-block.lore-intro > *{ padding-left:18px; padding-right:18px; }
  .lore-intro-title{ font-size:40px; }
  .lore-h{ font-size:30px; }
}

/* Vanguard cards row */
.lore-vanguard{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
  margin-top:8px;
}
.lore-vg{
  background:var(--paper-2);
  padding:24px;
  border-top:6px solid var(--vg-color, var(--ink));
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
  position:relative;
}
.lore-vg-alias{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  font-weight:400;
}
.lore-vg-name{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--vg-color, var(--red));
  margin-top:6px;
}
.lore-vg-tag{
  font-family:var(--sans);
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--rule-soft);
}
.lore-vg-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  margin:12px 0 0;
}
.lore-vg-desc + .lore-vg-desc{ margin-top:12px; }

@media (max-width: 720px){
  .lore-vanguard{ grid-template-columns:1fr; }
}

/* Houses grid (in the LoreHouses tab) */
.lore-houses-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
}
.lore-house{
  background:var(--paper-2);
  padding:24px;
  border-top:6px solid var(--h-color, var(--ink));
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-hd{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-crest{
  width:64px; height:64px;
  flex-shrink:0;
  object-fit:contain;
  object-position:center;
}
.lore-house-virtue{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--h-color, var(--ink));
  margin-bottom:4px;
}
.lore-house-name{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  margin:0 0 4px;
  font-weight:400;
}
.lore-house-namesake{
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.lore-house-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  margin:0 0 10px;
}
.lore-house-desc:last-child{ margin-bottom:0; }
.lore-house-desc em{
  font-style:normal;
  font-weight:600;
  color:var(--red);
}

@media (max-width: 720px){
  .lore-houses-grid{ grid-template-columns:1fr; }
}

/* HOUSE AT A GLANCE — comparison table */
.house-glance{
  background:var(--paper);
  border:2px solid var(--ink);
  margin-top:8px;
  overflow-x:auto;
}
.house-glance-tbl{ width:100%; border-collapse:collapse; min-width:680px; }
.house-glance-tbl thead{ background:var(--ink); }
.house-glance-tbl thead th{
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:#fff;
  text-align:left;
  padding:14px 16px;
  border-right:1px solid rgba(255,255,255,.1);
  position:static;
  top:auto;
  z-index:auto;
  border-bottom:3px solid var(--red);
}
.house-glance-tbl thead th:last-child{ border-right:none; }
.house-glance-tbl tbody tr{ border-top:2px solid var(--ink); }
.house-glance-tbl tbody tr:first-child{ border-top:none; }
.house-glance-tbl tbody tr:nth-child(even){ background:var(--paper-2); }
.house-glance-tbl tbody td{
  padding:14px 16px;
  border-right:1px solid var(--rule-faint);
  vertical-align:middle;
}
.house-glance-tbl tbody td:last-child{ border-right:none; }
.house-glance-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-weight:400;
}
.house-glance-virtue{
  font-family:var(--sans);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
}
.house-glance-mascot{
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}
.house-glance-traits{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--muted);
}
.house-glance-rival{
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   CURRICULUM — tabbed years + class chips
   ════════════════════════════════════════════════════════════════════════ */
.curr{ background:var(--paper); }
.curr-yeartabs{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  background:var(--ink-2);
  border-bottom:3px solid var(--ink);
  position:sticky;
  top:var(--sticky-thead-with-subnav-top);
  z-index:90;
}
.curr-yeartab{
  background:transparent;
  border:none;
  border-right:1px solid var(--ink-3);
  padding:18px 18px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  cursor:pointer;
  color:rgba(255,255,255,.5);
  text-align:left;
  font:inherit;
  transition:background .15s, color .15s;
}
.curr-yeartab:last-child{ border-right:none; }
.curr-yeartab:hover{
  background:rgba(255,255,255,.05);
  color:#fff;
}
.curr-yeartab.on{
  background:var(--red);
  color:#fff;
}
.curr-yeartab-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  opacity:.75;
}
.curr-yeartab.on .curr-yeartab-num{ opacity:1; color:var(--yellow); }
.curr-yeartab-label{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  font-weight:400;
}

.curr-overview{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 0;
}
.curr-overview-hd{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:16px;
}
.curr-overview-y{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--red);
}
.curr-overview-name{
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
}
.curr-tracks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.curr-track{
  padding:20px 22px;
  border:2px solid var(--ink);
}
.curr-track-hero{
  background:var(--red);
  color:#fff;
  border-color:var(--red-deep);
}
.curr-track-sidekick{
  background:var(--ink);
  color:var(--yellow);
}
.curr-track-tag{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  opacity:.85;
  margin-bottom:6px;
}
.curr-track-title{
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.05;
  margin:0 0 10px;
  font-weight:400;
}
.curr-track-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  margin:0;
  opacity:.92;
}

@media (max-width: 720px){
  .curr-tracks{ grid-template-columns:1fr; }
  .curr-overview{ padding:18px 18px 0; }
  .curr-overview-name{ font-size:26px; }
  .curr-yeartab{ padding:12px 10px; }
  .curr-yeartab-label{ font-size:16px; }
}

/* Classes section */
.curr-classes{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 32px;
}
.curr-classes-hint{
  background:var(--yellow);
  color:var(--ink);
  padding:10px 18px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:18px;
}
.curr-classes-section{ margin-bottom:24px; }
.curr-classes-section:last-child{ margin-bottom:0; }
.curr-classes-electives .curr-classes-hd{
  background:var(--paper-3);
}
.curr-classes-hd{
  background:var(--ink);
  color:#fff;
  padding:12px 18px;
  border-bottom:3px solid var(--red);
}
.curr-classes-electives .curr-classes-hd{
  background:var(--paper-3);
  color:var(--ink);
  border-bottom-color:var(--ink);
}
.curr-classes-tag{
  font-family:var(--display);
  font-size:18px;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:2px;
  font-weight:400;
}
.curr-classes-blurb{
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  margin:0;
  opacity:.85;
}
.curr-classes-list{
  list-style:none;
  margin:0;
  padding:0;
  background:var(--paper-2);
  border:1px solid var(--rule-soft);
  border-top:none;
}
.curr-class-empty{
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.4px;
  color:var(--faint);
  text-align:center;
  padding:24px 8px;
}

.class-chip{ display:block; border-bottom:1px solid var(--rule-faint); }
.class-chip:last-child{ border-bottom:none; }
.class-chip-btn{
  background:transparent;
  border:none;
  padding:13px 18px;
  margin:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  text-align:left;
  font:inherit;
  color:var(--ink);
  transition:background .12s;
}
.class-chip-btn:disabled{ cursor:default; }
.class-chip-btn:not(:disabled):hover{ background:#fff5d4; }
.class-chip.is-open .class-chip-btn{ background:#fff5d4; }
.class-chip-name{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
  flex:1;
  min-width:0;
}
.class-chip-track{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:3px 8px;
  flex-shrink:0;
}
.class-chip-track.t-hero{ background:var(--red); color:#fff; }
.class-chip-track.t-sidekick{ background:var(--ink); color:var(--yellow); }
.class-chip-track.t-shared{
  background:var(--yellow);
  color:var(--ink);
}
.class-chip-toggle{

  align-items:center;
  gap:5px;
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;

  text-transform:uppercase;
  color:var(--ink);
  background:#fff;
  border:1.5px solid var(--ink);

.class-chip-btn:not(:disabled):hover .class-chip-toggle,
.class-chip.is-open .class-chip-toggle{

  color:var(--yellow);
}
.class-chip-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  padding:0 18px 16px;
  background:#fff5d4;
  max-width:820px;
}

/* The fine print block — bold yellow callout */
.fine-print{
  width:100%;
  max-width:1600px;

/* ════════════════════════════════════════════════════════════════════════
   CLUB SIDE PANEL
   ════════════════════════════════════════════════════════════════════════ */
.club-side-overlay{
  position:fixed;
  inset:0;
  background:rgba(14,14,16,.7);
  z-index:900;
  animation:cs-fade .15s ease-out;
}
@keyframes cs-fade{ from{ opacity:0; } to{ opacity:1; } }

.club-side-panel{
  position:fixed;
  top:0; right:0; bottom:0;
  width:100%;
  max-width:880px;
  background:var(--paper);
  z-index:1001;
  border-left:3px solid var(--ink);
  box-shadow:-12px 0 0 var(--red);
  display:flex;
  flex-direction:column;
  animation:cs-slide .25s ease-out;
}
@keyframes cs-slide{ from{ transform:translateX(100%); } to{ transform:translateX(0); } }

.club-side-hd{
  padding:24px 28px;

.club-side-close{

.club-side-body{

.cp-staff-tag{

/* CLUB RULES — Powerball How To Play tab */
/* CLUB RULES — dark restyle (Powerball "How To Play" / All clubs) */
.kbr{
  /* Powerball cleanup: scope a single accent var to the rules block so every
     yellow/gold reference resolves to Powerball red. Replaces the previous
     mixed yellow/grey palette that fought the dark page background. */
  --pb-accent: #c41a1a;
  --pb-accent-soft: rgba(196,26,26,.10);
  --pb-accent-faint: rgba(196,26,26,.05);
  --pb-surface: rgba(255,255,255,.025);
  --pb-surface-2: rgba(255,255,255,.04);
  background:transparent;
  color:#f1ede4;
}

/* Old tabs strip is no longer rendered; hide if anything resurrects it */
.kbr-hd, .kbr-tabs, .kbr-tab{ display:none !important; }

.kbr-body{
  display:flex;
  flex-direction:column;
  gap:24px;
}

/* ---- Section dividers (Overview / Roles / Rulebook) ----
   Tighter / cleaner / less busy pass:
   - Section tag becomes a plain mono caps label (no bg pill, no left rule);
     the section's own content owns the red accent.
   - Bigger breathing room between sections (mb 36 vs 28; gap 24 vs 20). */
.kbr-section{
  margin:0 0 36px;
  padding:0;
  border:none;
}
.kbr-section + .kbr-section{
  padding-top:32px;
  border-top:1px solid var(--rule-soft, rgba(255,255,255,.06));
}
.kbr-section-tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--pb-accent);
  margin:0 0 16px;
  padding:0;
  background:transparent;
  border:none;
}

/* ---- Overview ---- */
.kbr-summary{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:#e6e2d8 !important;
  margin:0 0 28px;
  max-width:780px;
}

/* Keypoint cards — number + label + body line, all in one column.
   Less padding (12/14 vs 16/18), no leading icon column, looser block gap. */
.kbr-keypoints{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:12px;
  margin:0 0 28px;
}
.kbr-keypoint{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:14px 16px;
  background:var(--pb-surface);
  border:none;
  border-left:3px solid var(--pb-accent);
}
.kbr-keypoint-num{
  font-family:var(--mono);
  font-size:13px;
  font-weight:700;
  color:var(--pb-accent) !important;
  letter-spacing:.16em;
  line-height:1;
}
.kbr-keypoint-body{ display:contents; }
.kbr-keypoint-lbl{
  font-family:var(--sans);
  font-size:15px;
  font-weight:700;
  letter-spacing:0;
  text-transform:none;
  color:#f1ede4 !important;
  line-height:1.2;
}
.kbr-keypoint-body p{
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.55;
  color:#cfcabc !important;
  margin:0;
}

/* ---- Arena tile (clickable diagram) ----
   Stacks vertically below 640px so the image gets its own breathing
   room and the body text doesn't get squeezed into a thin column. */
/* arena tile rules consolidated to polish.css */

/* ---- Roles list ----
   Was a 64-col grid with an ::before gradient column and an absolutely-
   positioned number — readable but visually heavy. Flatten to a single
   column with the number inline above the name, then desc, then a
   subtle "Best for" row underneath. */
.kbr-roles{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
.kbr-role{
  position:relative;
  display:block;
  padding:16px 18px 14px;
  background:var(--pb-surface);
  border:none;
  border-left:3px solid var(--pb-accent);
}
.kbr-role-hd{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 4px;
}
.kbr-role-num{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.16em;
  color:var(--pb-accent) !important;
  line-height:1;
  flex-shrink:0;
}
.kbr-role-name{
  font-family:var(--display, var(--sans));
  font-size:20px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#f1ede4 !important;
  line-height:1.1;
  margin:0;
}
.kbr-role-tagline{
  flex-basis:100%;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#a09a8a !important;
  line-height:1.45;
  margin-top:2px;
}
.kbr-role-desc{
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.6;
  color:#e6e2d8 !important;
  margin:6px 0 0;
}
/* "Best for" is now a quiet inline note under the desc rather than a
   stripped-in panel with its own background + left bar. */
.kbr-role-best{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:10px;
  margin:10px 0 0;
  padding:0;
  background:transparent;
  border:none;
  font-family:var(--sans);
  font-size:12.5px;
  line-height:1.5;
  position:static;
}
.kbr-role-best::before{ content:none; }
.kbr-role-best-tag{
  flex-shrink:0;
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--pb-accent) !important;
  background:transparent;
  padding:0;
  height:auto;
}
.kbr-role-best-text{
  color:#cfcabc !important;
  flex:1;
  min-width:0;
}
@media (max-width: 640px){
  .kbr-role{ padding:14px 14px 12px; }
  .kbr-role-name{ font-size:17px; }
  .kbr-role-hd{ gap:8px; }
  .kbr-role-desc{ font-size:13px; }
  .kbr-role-best{ font-size:12px; gap:6px; }
}

/* ---- Rulebook blocks ----
   Slightly tighter padding, plain caps label (no glyph), and the per-row
   border on .kbr-list items removed so the bullets read as a tidy list,
   not a striped table. */
.kbr-block{
  padding:14px 16px;
  background:var(--pb-surface);
  border:none;
  border-left:3px solid var(--pb-accent);
  margin-bottom:10px;
}
.kbr-block:last-child{ margin-bottom:0; }
.kbr-block-tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--pb-accent) !important;
  margin-bottom:10px;
}
.kbr-block p{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:#e6e2d8 !important;
  margin:0;
}
.kbr-list{
  list-style:none;
  margin:0;
  padding:0;
}
.kbr-list li{
  position:relative;
  padding:6px 0 6px 16px;
  border-bottom:none;
  font-family:var(--sans);
  font-size:13.5px;
  line-height:1.55;
  color:#e6e2d8 !important;
}
.kbr-list li::before{
  content:"";
  position:absolute;
  top:13px;
  left:0;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--pb-accent);
}

/* ---- Career stats (used in About section, kept consistent) ---- */
.kbr-career-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:10px;
  margin:14px 0 0;
}
.kbr-career-stat{
  padding:14px 16px;
  background:var(--pb-surface);
  border:none;
  border-left:3px solid var(--pb-accent);
}
.kbr-career-stat-num{
  font-family:var(--display, var(--sans));
  font-size:24px;
  font-weight:700;
  color:var(--pb-accent) !important;
  letter-spacing:.02em;
  line-height:1;
  margin-bottom:6px;
}
.kbr-career-stat-lbl{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:#f1ede4 !important;
  margin-bottom:4px;
}
.kbr-career-stat-sub{
  font-family:var(--sans);
  font-size:12.5px;

}

@media (max-width: 860px){

.gs-overlay{
  position:fixed;
  inset:0;
  background:rgba(14,14,16,.85);

  align-items:center;
  padding:60px 20px 20px;
  overflow-y:auto;
}
.gs-panel{
  width:100%;
  max-width:760px;
  background:var(--paper);

  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 80px);
}
.gs-panel-hd{
  background:var(--ink);
  border-bottom:4px solid var(--yellow);

}

}
.gs-panel-input::placeholder{ color:rgba(255,255,255,.4); }
.gs-panel-close{

  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:6px 10px;

}
.gs-panel-close:hover{ border-color:var(--yellow); color:var(--yellow); }
.gs-panel-count{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;

}
.gs-empty{
  padding:48px 24px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--faint);
}
.gs-empty-icon{
  font-size:48px;
  color:var(--rule-soft);
  margin-bottom:8px;
}
.gs-group{ border-bottom:1px solid var(--rule-faint); }
.gs-group:last-child{ border-bottom:none; }
.gs-group-hd{
  background:var(--paper-2);
  padding:7px 18px;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;

.gs-group-count{ font-family:var(--mono); font-size:10px; color:var(--faint); }
.gs-result{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:11px 18px;
  border-bottom:1px solid var(--rule-faint);

.gs-result:last-child{ border-bottom:none; }
.gs-result:hover, .gs-result:focus-visible{

}
.gs-result-main{ min-width:0; }
.gs-result-label{
  font-family:var(--sans);
  font-weight:700;
  color:var(--ink);
  font-size:14px;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.gs-result-sub{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1px;

  text-transform:uppercase;
}
.gs-result-kind{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:3px 8px;
  align-self:start;
  white-space:nowrap;

   ════════════════════════════════════════════════════════════════════════ */

}
.case-stat:last-child{ border-right:none; }
.case-stat:nth-child(2){ background:var(--ink); color:#fff; }

.case-stat-n{
  font-family:var(--display);
  font-size:54px;
  letter-spacing:.02em;
  line-height:.95;
  color:var(--red);

  margin-bottom:8px;

.case-stat-l{
  font-family:var(--mono);

  font-weight:700;

.case-col{

.case-col:first-child{

.case-col:last-child{

}
.case-col-tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  padding:5px 10px;
  margin-bottom:14px;
}
.case-col:first-child .case-col-tag{
  background:var(--ink);
  color:#fff;
}
.case-col:last-child .case-col-tag{
  background:var(--red);
  color:#fff;
}
.case-col-h{
  font-family:var(--display);
  font-size:28px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.05;
  margin-bottom:14px;
  font-weight:400;
}
.case-col:first-child .case-col-h{ color:var(--ink); }
.case-col:last-child .case-col-h{ color:#fff; }
.case-col-h em{
  font-style:normal;
  font-weight:400;
