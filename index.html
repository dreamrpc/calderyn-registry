<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>CALDERYN COLLEGE — Central Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
<style>

/* ════════════════════════════════════════════════════════════════════════
   CALDERYN COLLEGE — Marvel/DC modern web
   Bold panels. Strong color blocks. Clean modern sans throughout.
   Full-bleed. High contrast. Readable.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* ─── core palette ─── heraldic study ─── */
  --ink:        #0c0e14;          /* deep ink — page bg, dark accents */
  --ink-2:      #13161f;          /* raised dark surface */
  --ink-3:      #1a1e2a;          /* dark panel separator */
  --ink-soft:   #232838;          /* hover on dark */

  --paper:      #ede4c8;          /* warm parchment cream — cards, body text */
  --paper-2:    #e3d9b8;          /* slightly warmer parchment */
  --paper-3:    #d6cba6;          /* aged parchment */
  --paper-4:    #c8bb91;          /* deepest parchment */

  --rule:       #2a3040;          /* dark divider */
  --rule-soft:  #c8bb91;          /* parchment hairline (on cream cards) */
  --rule-faint: #d6cba6;          /* whisper-faint hairline */
  --muted:      #6b6856;          /* muted text on cream */
  --faint:      #8d8970;          /* faint text on cream */

  /* ─── heraldic accents ─── grounded in Calderyn crest ─── */
  --red:        #7a1818;          /* wine red — sparingly, A-list, warnings, seals */
  --red-deep:   #5a1010;          /* deeper wine */
  --red-bright: #9a2828;          /* lifted wine for hover */

  --yellow:     #c9a14a;          /* PRIMARY heraldic gold — accents, CTAs, marks */
  --yellow-deep:#a8862e;          /* gold pressed/hover */

  --blue:       #5b8bd6;          /* STRATA ice blue — STRATA-only callouts */
  --blue-deep:  #3a5a9a;

  /* house colors — toned heraldic register */
  --h-valaris:  #8a1818;          /* wine — house Valaris */
  --h-orenne:   #b8862e;          /* warm gold — house Orenne */
  --h-saberis:  #4f6b4f;          /* sage — house Saberis */
  --h-grimere:  #3a5a9a;          /* steel blue — house Grimere */

  /* ─── typography ─── */
  --sans:       'Inter', system-ui, -apple-system, sans-serif;
  --display:    'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --display-cond: 'Oswald', 'Inter', sans-serif;
  --mono:       'JetBrains Mono', monospace;

  /* ─── header heights ─── */
  --hdr-h:      72px;
  --tabs-h:     56px;
  --sticky-tabs-top:   var(--hdr-h);
  --sticky-subnav-top: calc(var(--hdr-h) + var(--tabs-h));
  --hdr-subnav-h:      60px;
  --sticky-thead-top:  calc(var(--hdr-h) + var(--tabs-h));
  --sticky-thead-with-subnav-top: calc(var(--hdr-h) + var(--tabs-h) + var(--hdr-subnav-h));

  /* ─── design system foundation ─── */
  --radius-sm: 4px;
  --radius:    8px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.45);
  --shadow:    0 8px 28px rgba(0,0,0,.55);
  --shadow-lg: 0 22px 70px rgba(0,0,0,.65);
  --gold-glow: 0 0 0 1px rgba(201,161,74,.22), 0 6px 28px rgba(201,161,74,.12);
  --ease:      cubic-bezier(.22,.61,.36,1);
  --dur-fast:  140ms;
  --dur:       240ms;
  --dur-slow:  420ms;
}

/* ─── design-system foundation overrides ─── heraldic-study retoken ─── */
body{
  background:
    radial-gradient(1400px 700px at 50% -10%, rgba(201,161,74,.06), transparent 65%),
    radial-gradient(1000px 600px at 92% 110%, rgba(122,24,24,.05), transparent 60%),
    var(--ink);
  background-attachment: fixed;
  color: var(--paper);
}
*:focus-visible{
  outline:2px solid var(--yellow);
  outline-offset:2px;
  border-radius: var(--radius-sm);
}
::selection{ background:rgba(201,161,74,.32); color:var(--paper); }
::-moz-selection{ background:rgba(201,161,74,.32); color:var(--paper); }
*{ scrollbar-width:thin; scrollbar-color:var(--rule) transparent; }
*::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:0; }
*::-webkit-scrollbar-thumb:hover{ background:var(--yellow-deep); }

/* ─── type system: graphic-novel rhythm (Step 3a) ─── */

.mast-brand-name{ font-weight: 600; letter-spacing: .005em; }
.mast-brand-mark{ font-weight: 700; letter-spacing: -.01em; }
.mast-brand-sub{ color: var(--muted); letter-spacing: .18em; }

.kicker, .u-kicker, [data-kicker]{ font-family: var(--display-cond); font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--yellow); display: inline-block; }
.kicker--ink{ color: var(--ink); }
.kicker--paper{ color: var(--paper); }
.kicker--muted{ color: var(--muted); }

.dek, .u-dek{ font-family: var(--sans); font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--muted); max-width: 60ch; }

.caption-mono, .u-caption{ font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

.hairline-rule{ height: 1px; background: linear-gradient(90deg, transparent, var(--yellow) 18%, var(--yellow) 82%, transparent); opacity: .35; margin: 28px 0; }
.hairline-rule--center{ margin-left: auto; margin-right: auto; max-width: 320px; }



/* ─── reset ─── */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ font-size:15px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  background:var(--paper);
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  line-height:1.55;
  min-height:100vh;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}

::selection{ background:var(--red); color:#fff; }
::-moz-selection{ background:var(--red); color:#fff; }

*:focus{ outline:none; }
*:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:2px;
}

/* ─── scrollbars ─── */
*{ scrollbar-width:thin; scrollbar-color:var(--ink-3) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--rule-soft); border-radius:0; }
*::-webkit-scrollbar-thumb:hover{ background:var(--red); }

/* ════════════════════════════════════════════════════════════════════════
   PAGE — full bleed. No max-width card. Edge-to-edge content.
   ════════════════════════════════════════════════════════════════════════ */
.page{
  width:100%;
  background:var(--paper);
  min-height:100vh;
  position:relative;
}

/* ════════════════════════════════════════════════════════════════════════
   MASTHEAD — bold dark bar, full-bleed.
   Left: brand wordmark. Center: status meta. Right: search.
   ════════════════════════════════════════════════════════════════════════ */
.masthead{
  background:var(--ink);
  border-bottom:3px solid var(--red);
  position:sticky;
  top:0;
  z-index:300;
}
.mast-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  height:var(--hdr-h);
  display:flex;
  align-items:center;
  gap:32px;
  padding:0 32px;
}

.mast-brand{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}
.mast-brand-mark{
  background:var(--red);
  color:#fff;
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  width:48px; height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:400;
  flex-shrink:0;
  position:relative;
}
.mast-brand-mark::after{
  content:'';
  position:absolute;
  inset:3px;
  border:1.5px solid rgba(255,255,255,.25);
  pointer-events:none;
}
.mast-brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
  line-height:1;
}
.mast-brand-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  color:#fff;
  font-weight:400;
}
.mast-brand-sub{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.6px;
  color:var(--yellow);
  text-transform:uppercase;
  font-weight:600;
}

.mast-meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:auto;
  flex-wrap:nowrap;
}
.mast-meta-cell{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  font-weight:600;
  white-space:nowrap;
}
.mast-meta-cell strong{
  color:#fff;
  font-weight:700;
}
.mast-meta-cell .dot{
  width:6px; height:6px;
  background:var(--yellow);
  border-radius:50%;
  flex-shrink:0;
}
.mast-meta-cell .dot.live{
  background:var(--red-bright);
  box-shadow:0 0 0 0 rgba(227,27,35,.6);
  animation:pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-red{
  0%,100%{ box-shadow:0 0 0 0 rgba(227,27,35,.5); }
  50%{ box-shadow:0 0 0 6px rgba(227,27,35,0); }
}
.mast-meta-sep{
  color:rgba(255,255,255,.15);
}

.mast-search{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--ink-2);
  border:1.5px solid var(--ink-3);
  padding:9px 14px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.6);
  min-width:280px;
  transition:border-color .15s, color .15s, background .15s;
  flex-shrink:0;
}
.mast-search:hover, .mast-search:focus-visible{
  border-color:var(--yellow);
  color:#fff;
  background:var(--ink-soft);
}
.mast-search-icon{ color:var(--yellow); font-size:13px; }
.mast-search-text{ flex:1; text-align:left; }
.mast-search-kbd{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  background:var(--ink);
  color:var(--yellow);
  letter-spacing:.5px;
  border:1px solid rgba(255,204,0,.3);
}

/* ════════════════════════════════════════════════════════════════════════
   TAB STRIP — bold horizontal nav, sticky below masthead
   ════════════════════════════════════════════════════════════════════════ */
.tabs{
  background:var(--ink-2);
  position:sticky;
  top:var(--hdr-h);
  z-index:200;
  border-bottom:1px solid var(--ink-3);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
}
.tab{
  position:relative;
  height:var(--tabs-h);
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  background:transparent;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:color .15s, background .15s;
}
.tab-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  color:var(--yellow);
  opacity:.7;
}
.tab:hover{ color:#fff; background:rgba(255,255,255,.04); }
.tab:hover .tab-num{ opacity:1; }
.tab.on{
  color:#fff;
  background:var(--ink);
}
.tab.on .tab-num{
  color:var(--red-bright);
  opacity:1;
}
.tab.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   PAGE BODY — full-bleed content area
   ════════════════════════════════════════════════════════════════════════ */
.pg{
  background:var(--paper);
  min-height:60vh;
}

/* page entry animation */
@keyframes page-enter{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
.pg{ animation:page-enter .25s ease-out; }

/* ════════════════════════════════════════════════════════════════════════
   PAGE HEAD — hero banner for each section, full-bleed
   Dark band with stamp + display headline + body intro + side note
   ════════════════════════════════════════════════════════════════════════ */
.pg-hd{
  background:var(--ink);
  color:#fff;
  border-bottom:4px solid var(--red);
  position:relative;
  overflow:hidden;
}
.pg-hd::before{
  content:'';
  position:absolute;
  top:0; right:0;
  width:240px; height:100%;
  background:
    repeating-linear-gradient(
      -45deg,
      var(--red) 0,
      var(--red) 14px,
      var(--red-deep) 14px,
      var(--red-deep) 28px
    );
  opacity:.18;
  pointer-events:none;
}
.pg-hd-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:36px 32px 32px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:32px;
  align-items:flex-end;
  position:relative;
  z-index:1;
}
.pg-hd-title{ min-width:0; }
.pg-hd-stamp{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:5px 11px;
  margin-bottom:14px;
}
.pg-hd-stamp-mark{
  font-size:8px;
  color:var(--yellow);
}
.pg-hd h2{
  font-family:var(--display);
  font-size:64px;
  letter-spacing:.02em;
  line-height:.95;
  color:#fff;
  text-transform:uppercase;
  font-weight:400;
  margin-bottom:14px;
  text-wrap:balance;
}
.pg-hd-accent{
  color:var(--yellow);
}
.pg-hd p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:rgba(255,255,255,.78);
  max-width:680px;
  font-weight:400;
}
.pg-hd p strong{ color:#fff; font-weight:700; }
.pg-hd-note{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
  border-left:3px solid var(--yellow);
  padding:6px 0 6px 14px;
  line-height:1.7;
  flex-shrink:0;
}
.pg-hd-note.warn{
  border-left-color:var(--red-bright);
  color:#ffb8b8;
}

@media (max-width: 900px){
  .pg-hd-inner{ grid-template-columns:1fr; padding:28px 22px; }
  .pg-hd h2{ font-size:44px; }
  .pg-hd::before{ width:120px; }
}

/* ════════════════════════════════════════════════════════════════════════
   SUB-NAV — used in tabs with sub-views
   ════════════════════════════════════════════════════════════════════════ */
.subnav{
  background:var(--ink-2);
  position:sticky;
  top:var(--sticky-subnav-top);
  z-index:100;
  border-bottom:1px solid var(--ink-3);
}
.subnav-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.subnav-inner::-webkit-scrollbar{ display:none; }
.subnav-btn{
  position:relative;
  height:var(--hdr-subnav-h);
  padding:0 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  background:transparent;
  border:none;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
  flex-shrink:0;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  transition:color .15s, background .15s;
}
.subnav-btn:hover{ color:#fff; background:rgba(255,255,255,.04); }
.subnav-btn.on{
  color:#fff;
  background:var(--ink);
}
.subnav-btn.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--yellow);
}
.subnav-btn .sn-sub{
  font-family:var(--sans);
  font-size:11px;
  font-weight:500;
  letter-spacing:.02em;
  text-transform:none;
  color:rgba(255,255,255,.45);
}
.subnav-btn.on .sn-sub{ color:rgba(255,255,255,.7); }

/* ════════════════════════════════════════════════════════════════════════
   SECTION CONTAINER — every page section uses this for inner padding
   Background panel can span full width, content stays max-width.
   ════════════════════════════════════════════════════════════════════════ */
.section-wrap{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:32px;
}
.section-wrap-tight{ padding:24px 32px; }
.section-wrap-wide{ padding:48px 32px; }

@media (max-width: 720px){
  .section-wrap, .section-wrap-tight, .section-wrap-wide{ padding-left:18px; padding-right:18px; }
}

/* ════════════════════════════════════════════════════════════════════════
   TABLES — clean, bold, readable
   ════════════════════════════════════════════════════════════════════════ */
.tw{
  width:100%;
  background:var(--paper);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-family:var(--sans);
  font-size:14px;
}
thead{ background:var(--ink); }
thead tr th{
  background:var(--ink);
  color:#fff;
  padding:12px 18px;
  text-align:left;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  line-height:1.4;
  text-transform:uppercase;
  white-space:nowrap;
  vertical-align:middle;
  position:sticky;
  top:var(--sticky-thead-top);
  z-index:30;
  border-bottom:3px solid var(--red);
}
.subnav-host thead tr th{ top:var(--sticky-thead-with-subnav-top); }

/* Inner tables (inside cards / panels) — non-sticky */
.group .tw thead tr th,
.kb-team-tbl thead tr th,
.cp-rgroup-tbl thead tr th,
.club-side-panel thead tr th{
  position:static;
  top:auto;
  z-index:auto;
}

tbody td{
  padding:14px 18px;
  border-bottom:1px solid var(--rule-faint);
  vertical-align:middle;
  color:var(--ink);
  line-height:1.55;
}
tbody tr:nth-child(even) td{ background:var(--paper-2); }
tbody tr:hover td{ background:#fff5d4; }
tbody tr:last-child td{ border-bottom:none; }

.sec-row td{
  background:var(--red) !important;
  color:#fff !important;
  font-family:var(--display) !important;
  font-size:18px !important;
  letter-spacing:.04em !important;
  padding:10px 18px !important;
  border:none !important;
  text-transform:uppercase !important;
  font-weight:400 !important;
}
.sub-row td{
  background:var(--ink-2) !important;
  color:rgba(255,255,255,.7) !important;
  font-family:var(--sans) !important;
  font-size:13px !important;
  font-weight:400 !important;
  padding:10px 18px !important;
  border:none !important;
  letter-spacing:0 !important;
  text-transform:none !important;
  line-height:1.55 !important;
}

/* row-num utility */
.rn{
  color:var(--faint);
  font-family:var(--mono);
  font-size:11px;
  text-align:right;
  width:48px;
  padding-right:14px !important;
  font-variant-numeric:tabular-nums;
}

/* ════════════════════════════════════════════════════════════════════════
   COMMON PRIMITIVES — links, chips, badges, empty states, tier pills
   ════════════════════════════════════════════════════════════════════════ */
a.clink{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
  border-bottom:2px solid var(--red);
  transition:color .12s, border-color .12s;
}
a.clink:hover{ color:var(--red); border-bottom-color:var(--ink); }
span.cname{ font-weight:600; color:var(--ink); }

.empty{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--faint);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.empty::before{
  content:'';
  display:inline-block;
  width:7px; height:7px;
  background:var(--rule-soft);
  border-radius:50%;
}

.npc-badge{
  display:inline-block;
  margin-left:8px;
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:2px 6px;
  vertical-align:1px;
  cursor:default;
  user-select:none;
}

.chip{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:4px 9px;
  line-height:1.4;
  white-space:nowrap;
}
.chip-ink{    background:var(--ink);    color:#fff; }
.chip-yellow{ background:var(--yellow); color:var(--ink); }
.chip-red{    background:var(--red);    color:#fff; }
.chip-gold{   background:var(--yellow-deep); color:var(--ink); }
.chip-ghost{
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--rule-soft);
}
.chip-classified{
  background:var(--red);
  color:#fff;
  background-image:repeating-linear-gradient(45deg,
    rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 4px,
    transparent 4px, transparent 8px);
}

.tier-pill{
  display:inline-block;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
  min-width:64px;
  text-align:center;
}

.house-cell{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.house-cell-name{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
}
.hdot{
  display:inline-block;
  width:10px; height:10px;
  flex-shrink:0;
  border:2px solid var(--ink);
}

/* track tags — used in faculty registry */
.track-tags{
  display:inline-flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-start;
}
.track-tag{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  padding:3px 7px;
  display:inline-block;
  white-space:nowrap;
  line-height:1.2;
}
.track-tag-hero{ background:var(--red); color:#fff; }
.track-tag-sidekick{ background:var(--ink); color:var(--yellow); }
.track-tag-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

/* subject list inside faculty rows */
.subject-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.subject-list li{
  padding:0;
  line-height:1.5;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.subject-line{
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--ink);
  text-transform:uppercase;
}
.subject-line::before{
  content:'·';
  display:inline-block;
  width:14px;
  color:var(--red);
  font-weight:700;
}
.subject-desc{
  font-family:var(--sans);
  font-size:13px;
  font-weight:400;
  color:var(--muted);
  line-height:1.55;
  padding-left:14px;
  max-width:560px;
}
.subject-list-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

.stage-name{
  font-family:var(--display);
  font-size:16px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  font-weight:400;
}
.stage-na{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.4px;
  color:var(--faint);
}
.stage-empty{
  font-family:var(--mono);
  font-size:11px;
  color:var(--faint);
}

/* ════════════════════════════════════════════════════════════════════════
   RULES PAGE — bold numbered cards, alternating ink/red panels
   ════════════════════════════════════════════════════════════════════════ */
.rules-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
  gap:14px;
}
.rule{
  display:grid;
  grid-template-columns:88px 1fr;
  background:var(--paper-2);
  border:2px solid var(--ink);
  overflow:hidden;
  transition:transform .12s, box-shadow .12s;
}
.rule:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--red);
}
.rule-num{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
  color:var(--yellow);
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  line-height:1;
  font-weight:400;
  border-right:2px solid var(--ink);
}
.rule:nth-child(even) .rule-num{
  background:var(--red);
  color:#fff;
}
.rule-body{ padding:18px 22px; }
.rule-title{
  font-family:var(--sans);
  font-size:15px;
  font-weight:800;
  color:var(--ink);
  margin-bottom:6px;
  letter-spacing:.005em;
  line-height:1.3;
}
.rule-text{
  font-size:14px;
  color:var(--muted);
  line-height:1.65;
}

/* About-this-RP credit footer */
.about-bay{
  margin-top:32px;
  padding:24px 28px;
  background:var(--ink);
  color:#fff;
  border-left:6px solid var(--yellow);
}
.about-bay-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  padding:4px 10px;
  margin-bottom:12px;
}
.about-bay-text{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.7;
  color:rgba(255,255,255,.85);
  margin-bottom:10px;
  max-width:820px;
}
.about-bay-text:last-child{ margin-bottom:0; }
.about-bay-text-quiet{
  font-size:12px;
  color:rgba(255,255,255,.55);
}

/* ════════════════════════════════════════════════════════════════════════
   LORE — section blocks, big headlines, readable body
   ════════════════════════════════════════════════════════════════════════ */
.lore{ background:var(--paper); }
.lore-block{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:48px 32px;
  border-bottom:1px solid var(--rule-faint);
}
.lore-block:last-child{ border-bottom:none; }

/* Intro: full-bleed dark hero */
.lore-block.lore-intro{
  max-width:none;
  background:var(--ink);
  color:#fff;
  padding-left:0;
  padding-right:0;
  border-bottom:4px solid var(--red);
  position:relative;
}
.lore-block.lore-intro > *{
  width:100%;
  max-width:1600px;
  margin-left:auto;
  margin-right:auto;
  padding-left:32px;
  padding-right:32px;
}
.lore-intro-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  padding:5px 11px;
  margin-bottom:18px;
}
.lore-intro-title{
  font-family:var(--display);
  font-size:64px;
  line-height:.95;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:#fff;
  font-weight:400;
  margin:0 0 24px;
  max-width:980px;
  text-wrap:balance;
}
.lore-intro-title .accent{ color:var(--yellow); }
.lore-lead{
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  color:rgba(255,255,255,.82);
  margin:0 0 14px;
  max-width:820px;
}
.lore-lead:last-child{ margin-bottom:0; }
.lore-lead strong{ color:#fff; font-weight:700; }
.lore-lead em{ color:var(--yellow); font-style:normal; font-weight:600; }

.lore-eyebrow{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:8px;
  padding:3px 0;
  border-bottom:2px solid var(--red);
}
.lore-h{
  font-family:var(--display);
  font-size:42px;
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
  margin:0 0 22px;
  text-wrap:balance;
}
.lore-h .accent{ color:var(--red); }
.lore-p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  color:var(--ink);
  margin:0 0 16px;
  max-width:820px;
}
.lore-p:last-child{ margin-bottom:0; }
.lore-p strong{ color:var(--ink); font-weight:700; }
.lore-p em{
  font-style:normal;
  background:var(--yellow);
  color:var(--ink);
  padding:1px 5px;
  font-weight:600;
}

@media (max-width: 720px){
  .lore-block{ padding:32px 18px; }
  .lore-block.lore-intro > *{ padding-left:18px; padding-right:18px; }
  .lore-intro-title{ font-size:40px; }
  .lore-h{ font-size:30px; }
}

/* Vanguard cards row */
.lore-vanguard{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
  margin-top:8px;
}
.lore-vg{
  background:var(--paper-2);
  padding:24px;
  border-top:6px solid var(--vg-color, var(--ink));
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
  position:relative;
}
.lore-vg-alias{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  font-weight:400;
}
.lore-vg-name{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--vg-color, var(--red));
  margin-top:6px;
}
.lore-vg-tag{
  font-family:var(--sans);
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--rule-soft);
}
.lore-vg-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  margin:12px 0 0;
}
.lore-vg-desc + .lore-vg-desc{ margin-top:12px; }

@media (max-width: 720px){
  .lore-vanguard{ grid-template-columns:1fr; }
}

/* Houses grid (in the LoreHouses tab) */
.lore-houses-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
}
.lore-house{
  background:var(--paper-2);
  padding:24px;
  border-top:6px solid var(--h-color, var(--ink));
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-hd{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-crest{
  width:64px; height:64px;
  flex-shrink:0;
  object-fit:contain;
  object-position:center;
}
.lore-house-virtue{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--h-color, var(--ink));
  margin-bottom:4px;
}
.lore-house-name{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  margin:0 0 4px;
  font-weight:400;
}
.lore-house-namesake{
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.lore-house-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  margin:0 0 10px;
}
.lore-house-desc:last-child{ margin-bottom:0; }
.lore-house-desc em{
  font-style:normal;
  font-weight:600;
  color:var(--red);
}

@media (max-width: 720px){
  .lore-houses-grid{ grid-template-columns:1fr; }
}

/* HOUSE AT A GLANCE — comparison table */
.house-glance{
  background:var(--paper);
  border:2px solid var(--ink);
  margin-top:8px;
  overflow-x:auto;
}
.house-glance-tbl{ width:100%; border-collapse:collapse; min-width:680px; }
.house-glance-tbl thead{ background:var(--ink); }
.house-glance-tbl thead th{
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:#fff;
  text-align:left;
  padding:14px 16px;
  border-right:1px solid rgba(255,255,255,.1);
  position:static;
  top:auto;
  z-index:auto;
  border-bottom:3px solid var(--red);
}
.house-glance-tbl thead th:last-child{ border-right:none; }
.house-glance-tbl tbody tr{ border-top:2px solid var(--ink); }
.house-glance-tbl tbody tr:first-child{ border-top:none; }
.house-glance-tbl tbody tr:nth-child(even){ background:var(--paper-2); }
.house-glance-tbl tbody td{
  padding:14px 16px;
  border-right:1px solid var(--rule-faint);
  vertical-align:middle;
}
.house-glance-tbl tbody td:last-child{ border-right:none; }
.house-glance-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-weight:400;
}
.house-glance-virtue{
  font-family:var(--sans);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
}
.house-glance-mascot{
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}
.house-glance-traits{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--muted);
}
.house-glance-rival{
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   CURRICULUM — tabbed years + class chips
   ════════════════════════════════════════════════════════════════════════ */
.curr{ background:var(--paper); }
.curr-yeartabs{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  background:var(--ink-2);
  border-bottom:3px solid var(--ink);
  position:sticky;
  top:var(--sticky-thead-with-subnav-top);
  z-index:90;
}
.curr-yeartab{
  background:transparent;
  border:none;
  border-right:1px solid var(--ink-3);
  padding:18px 18px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  cursor:pointer;
  color:rgba(255,255,255,.5);
  text-align:left;
  font:inherit;
  transition:background .15s, color .15s;
}
.curr-yeartab:last-child{ border-right:none; }
.curr-yeartab:hover{
  background:rgba(255,255,255,.05);
  color:#fff;
}
.curr-yeartab.on{
  background:var(--red);
  color:#fff;
}
.curr-yeartab-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  opacity:.75;
}
.curr-yeartab.on .curr-yeartab-num{ opacity:1; color:var(--yellow); }
.curr-yeartab-label{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  font-weight:400;
}

.curr-overview{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 0;
}
.curr-overview-hd{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:16px;
}
.curr-overview-y{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--red);
}
.curr-overview-name{
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
}
.curr-tracks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.curr-track{
  padding:20px 22px;
  border:2px solid var(--ink);
}
.curr-track-hero{
  background:var(--red);
  color:#fff;
  border-color:var(--red-deep);
}
.curr-track-sidekick{
  background:var(--ink);
  color:var(--yellow);
}
.curr-track-tag{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  opacity:.85;
  margin-bottom:6px;
}
.curr-track-title{
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.05;
  margin:0 0 10px;
  font-weight:400;
}
.curr-track-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  margin:0;
  opacity:.92;
}

@media (max-width: 720px){
  .curr-tracks{ grid-template-columns:1fr; }
  .curr-overview{ padding:18px 18px 0; }
  .curr-overview-name{ font-size:26px; }
  .curr-yeartab{ padding:12px 10px; }
  .curr-yeartab-label{ font-size:16px; }
}

/* Classes section */
.curr-classes{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 32px;
}
.curr-classes-hint{
  background:var(--yellow);
  color:var(--ink);
  padding:10px 18px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:18px;
}
.curr-classes-section{ margin-bottom:24px; }
.curr-classes-section:last-child{ margin-bottom:0; }
.curr-classes-electives .curr-classes-hd{
  background:var(--paper-3);
}
.curr-classes-hd{
  background:var(--ink);
  color:#fff;
  padding:12px 18px;
  border-bottom:3px solid var(--red);
}
.curr-classes-electives .curr-classes-hd{
  background:var(--paper-3);
  color:var(--ink);
  border-bottom-color:var(--ink);
}
.curr-classes-tag{
  font-family:var(--display);
  font-size:18px;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin-bottom:2px;
  font-weight:400;
}
.curr-classes-blurb{
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  margin:0;
  opacity:.85;
}
.curr-classes-list{
  list-style:none;
  margin:0;
  padding:0;
  background:var(--paper-2);
  border:1px solid var(--rule-soft);
  border-top:none;
}
.curr-class-empty{
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
  letter-spacing:1.4px;
  color:var(--faint);
  text-align:center;
  padding:24px 8px;
}

.class-chip{ display:block; border-bottom:1px solid var(--rule-faint); }
.class-chip:last-child{ border-bottom:none; }
.class-chip-btn{
  background:transparent;
  border:none;
  padding:13px 18px;
  margin:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  text-align:left;
  font:inherit;
  color:var(--ink);
  transition:background .12s;
}
.class-chip-btn:disabled{ cursor:default; }
.class-chip-btn:not(:disabled):hover{ background:#fff5d4; }
.class-chip.is-open .class-chip-btn{ background:#fff5d4; }
.class-chip-name{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
  flex:1;
  min-width:0;
}
.class-chip-track{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:3px 8px;
  flex-shrink:0;

  text-overflow:clip;

}

}

  overflow:visible;
  text-overflow:clip;

/* ════════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════════ */

}

  background:var(--red);

}
.preg-search{
  background:var(--ink-2);
  color:var(--paper);

}

.preg-count{ color:var(--faint); }

.preg-group-count{ color:var(--faint); }
.preg-tbl-wrap{ background:var(--ink-2); }

.preg-tbl tbody tr:nth-child(odd) td{
  background:var(--ink-2) !important;
  color:var(--paper-3) !important;
  border-bottom:1px solid var(--ink-3) !important;
}

.preg-tbl tbody tr.preg-detail-row:nth-child(odd) td{

}
.preg-tbl tbody tr.preg-row.is-clickable:hover td,
.preg-tbl tbody tr.preg-row.is-clickable:hover:nth-child(even) td,
.preg-tbl tbody tr.preg-row.is-clickable:hover:nth-child(odd) td{
  background:var(--ink-soft) !important;
}
.preg-tbl tbody tr.preg-row.is-open td,
.preg-tbl tbody tr.preg-row.is-open:nth-child(even) td,
.preg-tbl tbody tr.preg-row.is-open:nth-child(odd) td{
  background:var(--ink-3) !important;
  border-bottom-color:transparent !important;
}
.preg-col-char{
  color:var(--paper) !important;
  font-weight:600;
  white-space:normal !important;
  overflow:visible !important;
  text-overflow:clip !important;
  word-break:normal;
  min-width:200px;
}
.preg-col-power{
  color:var(--paper-3) !important;
  white-space:normal !important;
  overflow:visible !important;
  text-overflow:clip !important;
}
.preg-col-alias{
  white-space:nowrap;
}
.preg-alias{
  color:var(--paper) !important;
}
.preg-na{
  color:var(--faint) !important;
}
.preg-detail-label{ color:var(--faint) !important; }
.preg-detail-text{ color:var(--paper-3) !important; }
.preg-view-btn{
  background:var(--ink) !important;

  border-color:var(--ink-soft) !important;
}
.preg-view-btn:hover{

}
.preg-view-arrow{ color:inherit; }

}

.gs-group{ border-bottom:1px solid var(--rule-faint); }

   ════════════════════════════════════════════════════════════════════════ */
.case-stats{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:0;
  border:2px solid var(--ink);
  margin-top:18px;
}
.case-stat{

}
.case-stat:last-child{ border-right:none; }
.case-stat:nth-child(2){ background:var(--ink); color:#fff; }
.case-stat:nth-child(2) .case-stat-l{ color:var(--yellow); }
.case-stat-n{
  font-family:var(--display);
  font-size:54px;
  letter-spacing:.02em;
  line-height:.95;
  color:var(--red);
  font-weight:400;
  margin-bottom:8px;
}
.case-stat:nth-child(2) .case-stat-n{ color:#fff; }
.case-stat-l{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);

}

@media (max-width: 720px){
  .case-stats{ grid-template-columns:repeat(2, 1fr); }
  .case-stat{ border-bottom:2px solid var(--ink); }

  .case-stat:nth-child(3){ border-right:2px solid var(--ink); }
  .case-stat:nth-child(n+3){ border-bottom:none; }
}

.case-diptych{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  border:2px solid var(--ink);
  margin-top:18px;
}
.case-col{

  font-size:22px;

  text-transform:uppercase;
  line-height:1;
  font-weight:400;
}
.join-type-desc{
  font-family:var(--sans);

  line-height:1.5;
  color:var(--muted);
}

.join-field-label{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
.join-field-required{ color:var(--red); font-size:14px; line-height:1; }

  font-family:var(--sans);

.join-select,
.join-textarea{

}

  min-height:150px;
}
.join-input::placeholder,

  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:16px 18px;
  background:#fff;
  border:2px solid var(--ink);

    audio.preload = "metadata";
    document.body.appendChild(audio);

    var disc  = root.querySelector(".cdn-audio-disc");
    var panel = root.querySelector(".cdn-audio-panel");
    var pp    = root.querySelector(".cdn-audio-pp");
    var mute  = root.querySelector(".cdn-audio-mute");
    var vol   = root.querySelector(".cdn-audio-vol");

    var initialVol = (saved.volume != null) ? Math.max(0, Math.min(100, saved.volume)) : 25;
    var initialMuted = !!saved.muted;
    audio.volume = initialVol / 100;
    audio.muted = initialMuted;
    vol.value = initialVol;
    mute.textContent = initialMuted ? "\u2715" : "\u266A";

    function persist(){ try{ localStorage.setItem(STORAGE, JSON.stringify({ volume: Math.round(audio.volume * 100), muted: audio.muted })); }catch(e){} }
    function setPlaying(p){
      if (p){
        var pr = audio.play();
        if (pr && pr.then) pr.catch(function(){ disc.classList.remove("is-playing"); pp.textContent = "\u25B6"; });
        disc.classList.add("is-playing");
        pp.textContent = "\u258C\u258C";
      } else {
        audio.pause();
        disc.classList.remove("is-playing");
        pp.textContent = "\u25B6";
      }
    }
    disc.addEventListener("click", function(){ var open = panel.classList.toggle("is-open"); disc.setAttribute("aria-expanded", open ? "true" : "false"); });
    pp.addEventListener("click", function(){ setPlaying(audio.paused); });
    mute.addEventListener("click", function(){ audio.muted = !audio.muted; mute.textContent = audio.muted ? "\u2715" : "\u266A"; persist(); });
    vol.addEventListener("input", function(){ audio.volume = vol.value / 100; if (audio.volume > 0 && audio.muted){ audio.muted = false; mute.textContent = "\u266A"; } persist(); });
    pp.textContent = "\u25B6";
  }

  function makeStarfield(){
    var heroes = document.querySelectorAll(".pg-hd");
    if (!heroes.length) return;
    var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    heroes.forEach(function(hero){
      if (hero.querySelector(".pg-hd-stars")) return;
      var canvas = document.createElement("canvas");
      canvas.className = "pg-hd-stars";
      hero.insertBefore(canvas, hero.firstChild);
      var ctx = canvas.getContext("2d");
      var stars = [];
      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      function resize(){
        var r = hero.getBoundingClientRect();
        canvas.width = r.width * DPR; canvas.height = r.height * DPR;
        canvas.style.width = r.width + "px"; canvas.style.height = r.height + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        var target = Math.min(40, Math.round(r.width * r.height / 24000));
        stars = [];
        for (var i = 0; i < target; i++){
          stars.push({ x: Math.random() * r.width, y: Math.random() * r.height, r: Math.random() * 1.1 + .25, a: Math.random() * .55 + .15, vx: (Math.random() - .5) * .12, vy: (Math.random() - .5) * .12, tw: Math.random() * Math.PI * 2 });
        }
      }
      function frame(){
        var r = hero.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width, r.height);
        for (var i = 0; i < stars.length; i++){
          var s = stars[i];
          if (!prefersReduced){
            s.x += s.vx; s.y += s.vy; s.tw += .03;
            if (s.x < 0) s.x = r.width; if (s.x > r.width) s.x = 0;
            if (s.y < 0) s.y = r.height; if (s.y > r.height) s.y = 0;
          }
          var alpha = s.a * (.7 + .3 * Math.sin(s.tw));
          ctx.beginPath();
          ctx.fillStyle = "rgba(201,161,74," + alpha.toFixed(3) + ")";
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (!prefersReduced) requestAnimationFrame(frame);
      }
      var ro = new ResizeObserver(resize);
      ro.observe(hero);
      resize();
      requestAnimationFrame(frame);
    });
  }

  function makeFooterStrata(){
    var brand = document.querySelector(".footer-brand");
    if (brand && !brand.parentNode.querySelector(".footer-strata-mark")){
      var mark = document.createElement("div");
      mark.className = "footer-strata-mark";
      mark.setAttribute("aria-hidden", "true");
      brand.parentNode.insertBefore(mark, brand);
    }
  }

  function init(){
    makeWidget();
    makeStarfield();
    makeFooterStrata();
    var mo = new MutationObserver(function(){ makeStarfield(); makeFooterStrata(); });
    mo.observe(document.body, {childList: true, subtree: true});
  }

  if (document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", init); } else { setTimeout(init, 50); }
})();
</script>

<script>
(function(){
  var b = document.body, last = false;
  function tick(){
    var s = window.scrollY > 8;
    if (s !== last){ b.classList.toggle("is-scrolled", s); last = s; }
  }
  window.addEventListener("scroll", tick, {passive:true});
  document.addEventListener("DOMContentLoaded", tick);
  tick();
})();
</script>
