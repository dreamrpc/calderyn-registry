<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>CALDERYN COLLEGE — Central Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
<style>

/* ════════════════════════════════════════════════════════════════════════
   CALDERYN COLLEGE — Marvel/DC modern web
   Bold panels. Strong color blocks. Clean modern sans throughout.
   Full-bleed. High contrast. Readable.
   ════════════════════════════════════════════════════════════════════════ */

:root{
  /* ─── core palette — bold and confident ─── */
  --ink:        #0e0e10;          /* near-black */h
  --ink-2:      #18181c;          /* one tick up */
  --ink-3:      #24242a;          /* panel separators */
  --ink-soft:   #2e2e36;          /* hover states on dark */

  --paper:      #ffffff;          /* clean white */
  --paper-2:    #f7f7f9;          /* subtle off-white */
  --paper-3:    #ededf0;          /* tertiary panel */
  --paper-4:    #e0e0e6;          /* deepest light */

  --rule:       #1a1a1f;
  --rule-soft:  #d8d8de;
  --rule-faint: #ebebee;
  --muted:      #54545c;
  --faint:      #8a8a92;

  /* ─── accents — saturated, strong, comic-bold ─── */
  --red:        #e31b23;          /* primary action red — Marvel-vivid */
  --red-deep:   #9b0d12;          /* darker red for depth */
  --red-bright: #ff2a32;          /* highlight only */

  --yellow:     #ffcc00;          /* electric yellow — accent strips, captions */
  --yellow-deep:#d4a800;          /* darker yellow */

  --blue:       #1e6fff;          /* DC-blue, electric */
  --blue-deep:  #0a3da8;

  /* house colors — saturated comic primaries */
  --h-valaris:  #c41a1a;          /* heroic red */
  --h-orenne:   #d4901a;          /* warm amber */
  --h-saberis:  #15803d;          /* strong green */
  --h-grimere:  #1e40af;          /* royal blue */

  /* ─── typography ─── */
  --sans:       'Inter', system-ui, -apple-system, sans-serif;
  --display:    'Bebas Neue', 'Inter', sans-serif;     /* bold caps display ONLY */
  --mono:       'JetBrains Mono', monospace;

  /* ─── header heights ───
     Must match the rendered heights of .mast-inner and the .tab strip
     (.tab height + 1px border-bottom). The dark theme override sets
     .mast-inner{height:84px} and .tab{height:52px}, so the sticky-offset
     vars below have to add up to 84 + (52+1) = 137px or the sub-nav
     lands with a gap below the tabs strip. */
  --hdr-h:      84px;
  --tabs-h:     53px;
  --sticky-tabs-top:   var(--hdr-h);
  --sticky-subnav-top: calc(var(--hdr-h) + var(--tabs-h));
  --hdr-subnav-h:      60px;
  --sticky-thead-top:  calc(var(--hdr-h) + var(--tabs-h));
  --sticky-thead-with-subnav-top: calc(var(--hdr-h) + var(--tabs-h) + var(--hdr-subnav-h));
}

/* ─── reset ─── */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ font-size:15px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  background:var(--paper);
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  line-height:1.55;
  min-height:100vh;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
}

::selection{ background:var(--red); color:#fff; }
::-moz-selection{ background:var(--red); color:#fff; }

*:focus{ outline:none; }
*:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:2px;
}

/* ─── scrollbars ─── */
*{ scrollbar-width:thin; scrollbar-color:var(--ink-3) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--rule-soft); border-radius:0; }
*::-webkit-scrollbar-thumb:hover{ background:var(--red); }

/* ════════════════════════════════════════════════════════════════════════
   PAGE — full bleed. No max-width card. Edge-to-edge content.
   ════════════════════════════════════════════════════════════════════════ */
.page{
  width:100%;
  background:var(--paper);
  min-height:100vh;
  position:relative;
}

/* ════════════════════════════════════════════════════════════════════════
   MASTHEAD — bold dark bar, full-bleed.
   Left: brand wordmark. Center: status meta. Right: search.
   ════════════════════════════════════════════════════════════════════════ */
.masthead{
  background:var(--ink);
  border-bottom:3px solid var(--red);
  position:sticky;
  top:0;
  z-index:300;
}
.mast-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  height:var(--hdr-h);
  display:flex;
  align-items:center;
  gap:32px;
  padding:0 32px;
}

.mast-brand{
  display:flex;
  align-items:center;
  gap:14px;
  flex-shrink:0;
}
.mast-brand-mark{
  background:var(--red);
  color:#fff;
  font-family:var(--display);
  font-size:24px;
  letter-spacing:.04em;
  width:48px; height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:400;
  flex-shrink:0;
  position:relative;
}
.mast-brand-mark::after{
  content:'';
  position:absolute;
  inset:3px;
  border:1.5px solid rgba(255,255,255,.25);
  pointer-events:none;
}
.mast-brand-text{
  display:flex;
  flex-direction:column;
  gap:1px;
  line-height:1;
}
.mast-brand-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  color:#fff;
  font-weight:400;
}
.mast-brand-sub{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.6px;
  color:var(--yellow);
  text-transform:uppercase;
  font-weight:600;
}

.mast-meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:auto;
  flex-wrap:nowrap;
}
.mast-meta-cell{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  font-weight:600;
  white-space:nowrap;
}
.mast-meta-cell strong{
  color:#fff;
  font-weight:700;
}
.mast-meta-cell .dot{
  width:6px; height:6px;
  background:var(--yellow);
  border-radius:50%;
  flex-shrink:0;
}
.mast-meta-cell .dot.live{
  background:var(--red-bright);
  box-shadow:0 0 0 0 rgba(227,27,35,.6);
  animation:pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-red{
  0%,100%{ box-shadow:0 0 0 0 rgba(227,27,35,.5); }
  50%{ box-shadow:0 0 0 6px rgba(227,27,35,0); }
}
.mast-meta-sep{
  color:rgba(255,255,255,.15);
}

.mast-search{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--ink-2);
  border:1.5px solid var(--ink-3);
  padding:9px 14px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:rgba(255,255,255,.6);
  min-width:280px;
  transition:border-color .15s, color .15s, background .15s;
  flex-shrink:0;
}
.mast-search:hover, .mast-search:focus-visible{
  border-color:var(--yellow);
  color:#fff;
  background:var(--ink-soft);
}
.mast-search-icon{ color:var(--yellow); font-size:13px; }
.mast-search-text{ flex:1; text-align:left; }
.mast-search-kbd{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  background:var(--ink);
  color:var(--yellow);
  letter-spacing:.5px;
  border:1px solid rgba(255,204,0,.3);
}

/* ════════════════════════════════════════════════════════════════════════
   TAB STRIP — bold horizontal nav, sticky below masthead
   ════════════════════════════════════════════════════════════════════════ */
.tabs{
  background:var(--ink-2);
  position:sticky;
  top:var(--hdr-h);
  z-index:200;
  border-bottom:1px solid var(--ink-3);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
}
.tab{
  position:relative;
  height:var(--tabs-h);
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:rgba(255,255,255,.55);
  background:transparent;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:color .15s, background .15s;
}
.tab-num{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  color:var(--yellow);
  opacity:.7;
}
.tab:hover{ color:#fff; background:rgba(255,255,255,.04); }
.tab:hover .tab-num{ opacity:1; }
.tab.on{
  color:#fff;
  background:var(--ink);
}
.tab.on .tab-num{
  color:var(--red-bright);
  opacity:1;
}
.tab.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   PAGE BODY — full-bleed content area
   ════════════════════════════════════════════════════════════════════════ */
.pg{
  background:var(--paper);
  min-height:60vh;
}

/* page entry animation. opacity-only so the transformed ancestor
   doesn't break the sticky positioning of the sub-nav inside .pg. */
@keyframes page-enter{
  from{ opacity:0; }
  to{ opacity:1; }
}
.pg{ animation:page-enter .25s ease-out; }

/* ════════════════════════════════════════════════════════════════════════
   PAGE HEAD — hero banner for each section, full-bleed
   Dark band with stamp + display headline + body intro + side note
   ════════════════════════════════════════════════════════════════════════ */
.pg-hd{
  background:var(--ink);
  color:#fff;
  border-bottom:4px solid var(--red);
  position:relative;
  overflow:hidden;
}
.pg-hd::before{
  content:'';
  position:absolute;
  top:0; right:0;
  width:240px; height:100%;
  background:
    repeating-linear-gradient(
      -45deg,
      var(--red) 0,
      var(--red) 14px,
      var(--red-deep) 14px,
      var(--red-deep) 28px
    );
  opacity:.18;
  pointer-events:none;
}
.pg-hd-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:36px 32px 32px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:32px;
  align-items:flex-end;
  position:relative;
  z-index:1;
}
.pg-hd-title{ min-width:0; }
.pg-hd-stamp{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--red);
  color:#fff;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  padding:5px 11px;
  margin-bottom:14px;
}
.pg-hd-stamp-mark{
  font-size:8px;
  color:var(--yellow);
}
.pg-hd h2{
  font-family:var(--display);
  font-size:64px;
  letter-spacing:.02em;
  line-height:.95;
  color:#fff;
  text-transform:uppercase;
  font-weight:400;
  margin-bottom:14px;
  text-wrap:balance;
}
.pg-hd-accent{
  color:var(--yellow);
}
.pg-hd p{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  color:rgba(255,255,255,.78);
  max-width:680px;
  font-weight:400;
}
.pg-hd p strong{ color:#fff; font-weight:700; }
.pg-hd-note{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:rgba(255,255,255,.6);
  border-left:3px solid var(--yellow);
  padding:6px 0 6px 14px;
  line-height:1.7;
  flex-shrink:0;
}
.pg-hd-note.warn{
  border-left-color:var(--red-bright);
  color:#ffb8b8;
}

@media (max-width: 900px){
  .pg-hd-inner{ grid-template-columns:1fr; padding:28px 22px; }
  .pg-hd h2{ font-size:44px; }
  .pg-hd::before{ width:120px; }
}

/* ════════════════════════════════════════════════════════════════════════
   SUB-NAV — used in tabs with sub-views
   ════════════════════════════════════════════════════════════════════════ */
.subnav{
  background:var(--ink-2);
  position:sticky;
  top:var(--sticky-subnav-top);
  z-index:100;
  border-bottom:1px solid var(--ink-3);
}
.subnav-inner{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  display:flex;
  padding:0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.subnav-inner::-webkit-scrollbar{ display:none; }
.subnav-btn{
  position:relative;
  height:var(--hdr-subnav-h);
  padding:0 20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  background:transparent;
  border:none;
  cursor:pointer;
  text-align:left;
  white-space:nowrap;
  flex-shrink:0;
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
  transition:color .15s, background .15s;
}
.subnav-btn:hover{ color:#fff; background:rgba(255,255,255,.04); }
.subnav-btn.on{
  color:#fff;
  background:var(--ink);
}
.subnav-btn.on::after{
  content:'';
  position:absolute;
  left:0; right:0;
  bottom:-1px;
  height:3px;
  background:var(--yellow);
}
.subnav-btn .sn-sub{
  font-family:var(--sans);
  font-size:11px;
  font-weight:500;
  letter-spacing:.02em;
  text-transform:none;
  color:rgba(255,255,255,.45);
}
.subnav-btn.on .sn-sub{ color:rgba(255,255,255,.7); }

/* ════════════════════════════════════════════════════════════════════════
   SECTION CONTAINER — every page section uses this for inner padding
   Background panel can span full width, content stays max-width.
   ════════════════════════════════════════════════════════════════════════ */
.section-wrap{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:32px;
}
.section-wrap-tight{ padding:24px 32px; }
.section-wrap-wide{ padding:48px 32px; }

@media (max-width: 720px){
  .section-wrap, .section-wrap-tight, .section-wrap-wide{ padding-left:18px; padding-right:18px; }
}

/* ════════════════════════════════════════════════════════════════════════
   TABLES — clean, bold, readable
   ════════════════════════════════════════════════════════════════════════ */
.tw{
  width:100%;
  background:var(--paper);
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-family:var(--sans);
  font-size:14px;
}
thead{ background:var(--ink); }
thead tr th{
  background:var(--ink);
  color:#fff;
  padding:12px 18px;
  text-align:left;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  line-height:1.4;
  text-transform:uppercase;
  white-space:nowrap;
  vertical-align:middle;
  position:sticky;
  top:var(--sticky-thead-top);
  z-index:30;
  border-bottom:3px solid var(--red);
}
.subnav-host thead tr th{ top:var(--sticky-thead-with-subnav-top); }

/* Inner tables (inside cards / panels) — non-sticky */
.group .tw thead tr th,
.kb-team-tbl thead tr th,
.cp-rgroup-tbl thead tr th,
.club-side-panel thead tr th{
  position:static;
  top:auto;
  z-index:auto;
}

tbody td{
  padding:14px 18px;
  border-bottom:1px solid var(--rule-faint);
  vertical-align:middle;
  color:var(--ink);
  line-height:1.55;
}
tbody tr:nth-child(even) td{ background:var(--paper-2); }
tbody tr:hover td{ background:#fff5d4; }
tbody tr:last-child td{ border-bottom:none; }

.sec-row td{
  background:var(--red) !important;
  color:#fff !important;
  font-family:var(--display) !important;
  font-size:18px !important;
  letter-spacing:.04em !important;
  padding:10px 18px !important;
  border:none !important;
  text-transform:uppercase !important;
  font-weight:400 !important;
}
.sub-row td{
  background:var(--ink-2) !important;
  color:rgba(255,255,255,.7) !important;
  font-family:var(--sans) !important;
  font-size:13px !important;
  font-weight:400 !important;
  padding:10px 18px !important;
  border:none !important;
  letter-spacing:0 !important;
  text-transform:none !important;
  line-height:1.55 !important;
}

/* row-num utility */
.rn{
  color:var(--faint);
  font-family:var(--mono);
  font-size:11px;
  text-align:right;
  width:48px;
  padding-right:14px !important;
  font-variant-numeric:tabular-nums;
}

/* ════════════════════════════════════════════════════════════════════════
   COMMON PRIMITIVES — links, chips, badges, empty states, tier pills
   ════════════════════════════════════════════════════════════════════════ */
a.clink{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
  border-bottom:2px solid var(--red);
  transition:color .12s, border-color .12s;
}
a.clink:hover{ color:var(--red); border-bottom-color:var(--ink); }
span.cname{ font-weight:600; color:var(--ink); }

.empty{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--faint);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.empty::before{
  content:'';
  display:inline-block;
  width:7px; height:7px;
  background:var(--rule-soft);
  border-radius:50%;
}

.npc-badge{
  display:inline-block;
  margin-left:8px;
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:2px 6px;
  vertical-align:1px;
  cursor:default;
  user-select:none;
}

.chip{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:4px 9px;
  line-height:1.4;
  white-space:nowrap;
}
.chip-ink{    background:var(--ink);    color:#fff; }
.chip-yellow{ background:var(--yellow); color:var(--ink); }
.chip-red{    background:var(--red);    color:#fff; }
.chip-gold{   background:var(--yellow-deep); color:var(--ink); }
.chip-ghost{
  background:transparent;
  color:var(--muted);
  border:1.5px solid var(--rule-soft);
}
.chip-classified{
  background:var(--red);
  color:#fff;
  background-image:repeating-linear-gradient(45deg,
    rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 4px,
    transparent 4px, transparent 8px);
}

.tier-pill{
  display:inline-block;
  font-family:var(--sans);
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#fff;
  min-width:64px;
  text-align:center;
}

.house-cell{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.house-cell-name{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
}
.hdot{
  display:inline-block;
  width:10px; height:10px;
  flex-shrink:0;
  border:2px solid var(--ink);
}

/* track tags — used in faculty registry */
.track-tags{
  display:inline-flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-start;
}
.track-tag{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;

}

}

  font-size:11px;

}

/* ════════════════════════════════════════════════════════════════════════
   RULES PAGE — bold numbered cards, alternating ink/red panels
   ════════════════════════════════════════════════════════════════════════ */
.rules-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
  gap:14px;
}
.rule{
  display:grid;
  grid-template-columns:88px 1fr;
  background:var(--paper-2);
  border:2px solid var(--ink);
  overflow:hidden;
  transition:transform .12s, box-shadow .12s;
}
.rule:hover{
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--red);
}
.rule-num{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
  color:var(--yellow);
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  line-height:1;
  font-weight:400;
  border-right:2px solid var(--ink);
}
.rule:nth-child(even) .rule-num{
  background:var(--red);
  color:#fff;
}
.rule-body{ padding:18px 22px; }
.rule-title{
  font-family:var(--sans);
  font-size:15px;
  font-weight:800;
  color:var(--ink);
  margin-bottom:6px;
  letter-spacing:.005em;
  line-height:1.3;
}
.rule-text{
  font-size:14px;
  color:var(--muted);
  line-height:1.65;
}

/* About-this-RP credit footer */

}
.about-bay-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  padding:4px 10px;
  margin-bottom:12px;
}
.about-bay-text{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.7;
  color:rgba(255,255,255,.85);
  margin-bottom:10px;
  max-width:820px;
}
.about-bay-text:last-child{ margin-bottom:0; }
.about-bay-text-quiet{
  font-size:12px;
  color:rgba(255,255,255,.55);
}

/* ════════════════════════════════════════════════════════════════════════
   LORE — section blocks, big headlines, readable body
   ════════════════════════════════════════════════════════════════════════ */
.lore{ background:var(--paper); }
.lore-block{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:48px 32px;

}
.lore-block:last-child{ border-bottom:none; }

/* Intro: full-bleed dark hero */
.lore-block.lore-intro{

  padding-left:0;
  padding-right:0;

}
.lore-block.lore-intro > *{
  width:100%;
  max-width:1600px;
  margin-left:auto;
  margin-right:auto;

  padding-right:32px;
}
.lore-intro-stamp{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);

  margin-bottom:18px;
}
.lore-intro-title{

  letter-spacing:.02em;

}

.lore-lead{

}
.lore-lead:last-child{ margin-bottom:0; }
.lore-lead strong{ color:#fff; font-weight:700; }
.lore-lead em{ color:var(--yellow); font-style:normal; font-weight:600; }

.lore-eyebrow{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--red);
  margin-bottom:8px;
  padding:3px 0;

}
.lore-h{
  font-family:var(--display);
  font-size:42px;
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:1;

  font-weight:400;
  margin:0 0 22px;

}

.lore-p{

}
.lore-p:last-child{ margin-bottom:0; }
.lore-p strong{ color:var(--ink); font-weight:700; }
.lore-p em{
  font-style:normal;
  background:var(--yellow);
  color:var(--ink);

}

@media (max-width: 720px){
  .lore-block{ padding:32px 18px; }

}

/* Vanguard cards row */
.lore-vanguard{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
  margin-top:8px;
}
.lore-vg{

  padding:24px;
  border-top:6px solid var(--vg-color, var(--ink));

  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
  position:relative;
}
.lore-vg-alias{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  font-weight:400;
}
.lore-vg-name{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--vg-color, var(--red));

}
.lore-vg-tag{
  font-family:var(--sans);
  font-size:13px;

}

@media (max-width: 720px){
  .lore-vanguard{ grid-template-columns:1fr; }

/* Houses grid (in the LoreHouses tab) */
.lore-houses-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:16px;
}
.lore-house{
  background:var(--paper-2);
  padding:24px;
  border-top:6px solid var(--h-color, var(--ink));
  border-left:1px solid var(--rule-soft);
  border-right:1px solid var(--rule-soft);
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-hd{
  display:flex;
  align-items:flex-start;

  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid var(--rule-soft);
}
.lore-house-crest{
  width:64px; height:64px;
  flex-shrink:0;
  object-fit:contain;

}
.lore-house-virtue{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--h-color, var(--ink));
  margin-bottom:4px;
}
.lore-house-name{
  font-family:var(--display);
  font-size:32px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  margin:0 0 4px;
  font-weight:400;
}
.lore-house-namesake{
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.lore-house-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  color:var(--ink);
  margin:0 0 10px;
}
.lore-house-desc:last-child{ margin-bottom:0; }
.lore-house-desc em{
  font-style:normal;
  font-weight:600;
  color:var(--red);
}

@media (max-width: 720px){
  .lore-houses-grid{ grid-template-columns:1fr; }
}

/* HOUSE AT A GLANCE — comparison table */
.house-glance{
  background:var(--paper);

}
.house-glance-tbl{ width:100%; border-collapse:collapse; min-width:680px; }
.house-glance-tbl thead{ background:var(--ink); }
.house-glance-tbl thead th{
  font-family:var(--sans);

  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:#fff;
  text-align:left;
  padding:14px 16px;
  border-right:1px solid rgba(255,255,255,.1);
  position:static;
  top:auto;
  z-index:auto;
  border-bottom:3px solid var(--red);
}
.house-glance-tbl thead th:last-child{ border-right:none; }
.house-glance-tbl tbody tr{ border-top:2px solid var(--ink); }

.house-glance-tbl tbody tr:nth-child(even){ background:var(--paper-2); }
.house-glance-tbl tbody td{
  padding:14px 16px;
  border-right:1px solid var(--rule-faint);
  vertical-align:middle;
}
.house-glance-tbl tbody td:last-child{ border-right:none; }
.house-glance-name{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-weight:400;
}
.house-glance-virtue{
  font-family:var(--sans);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--ink);
}
.house-glance-mascot{
  font-family:var(--sans);
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}
.house-glance-traits{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--muted);
}
.house-glance-rival{
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--red);
}

/* ════════════════════════════════════════════════════════════════════════
   CURRICULUM — tabbed years + class chips
   ════════════════════════════════════════════════════════════════════════ */
.curr{ background:var(--paper); }
.curr-yeartabs{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  background:var(--ink-2);
  border-bottom:3px solid var(--ink);
  position:sticky;
  top:var(--sticky-thead-with-subnav-top);
  z-index:90;
}
.curr-yeartab{
  background:transparent;
  border:none;
  border-right:1px solid var(--ink-3);
  padding:18px 18px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  cursor:pointer;
  color:rgba(255,255,255,.5);
  text-align:left;
  font:inherit;
  transition:background .15s, color .15s;
}
.curr-yeartab:last-child{ border-right:none; }
.curr-yeartab:hover{
  background:rgba(255,255,255,.05);

}
.curr-yeartab.on{
  background:var(--red);
  color:#fff;
}
.curr-yeartab-num{

}
.curr-yeartab.on .curr-yeartab-num{ opacity:1; color:var(--yellow); }
.curr-yeartab-label{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  font-weight:400;
}

.curr-overview{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 0;
}
.curr-overview-hd{
  display:flex;
  align-items:baseline;
  gap:16px;
  margin-bottom:16px;
}
.curr-overview-y{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--red);
}
.curr-overview-name{
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
}
.curr-tracks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.curr-track{
  padding:20px 22px;
  border:2px solid var(--ink);
}
.curr-track-hero{
  background:var(--red);
  color:#fff;
  border-color:var(--red-deep);
}
.curr-track-sidekick{
  background:var(--ink);
  color:var(--yellow);
}
.curr-track-tag{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;

}
.curr-track-title{
  font-family:var(--display);
  font-size:24px;

  margin:0 0 10px;

}
.curr-track-desc{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;

}

@media (max-width: 720px){

/* Classes section */
.curr-classes{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:24px 32px 32px;
}
.curr-classes-hint{

  color:var(--ink);
  padding:10px 18px;
  font-family:var(--sans);

  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;

}
.curr-classes-section{ margin-bottom:24px; }
.curr-classes-section:last-child{ margin-bottom:0; }
.curr-classes-electives .curr-classes-hd{

.curr-classes-hd{
  background:var(--ink);

}
.curr-classes-electives .curr-classes-hd{
  background:var(--paper-3);

}
.curr-classes-tag{
  font-family:var(--display);
  font-size:18px;

}
.curr-classes-blurb{

.curr-classes-list{

.class-chip{ display:block; border-bottom:1px solid var(--rule-faint); }
.class-chip:last-child{ border-bottom:none; }
.class-chip-btn{

  display:flex;

/* ════════════════════════════════════════════════════════════════════════

.kbr-tabs{ display:flex; }
.kbr-tab{
  flex:1;

  color:var(--muted);

  border-bottom:3px solid transparent;
  padding:13px 14px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:700;

.kbr-arena-tile-title{

.gov-wrap{

  flex-direction:column;
  gap:24px;
}

  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  flex-wrap:wrap;

  border-bottom:3px solid var(--ink);
  margin-bottom:16px;
}
.block-title{
  font-family:var(--display);
  font-size:30px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
}
.block-meta{
  font-family:var(--mono);

  font-weight:700;

}
.block-note{

.office{ display:flex; flex-direction:column; }
.office-tag{

.office-tag-num{ color:var(--red-bright); font-weight:700; }
.office-tag-label{ color:var(--yellow); }
.office-card{

  background:var(--paper);

}
.office-prez{
  padding:24px 32px 22px;

  border-bottom:3px solid var(--ink);
}
.office-prez::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:8px;
  background:var(--yellow);
}
.office-prez.filled::before{

.office-prez-eyebrow{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-top:10px;
  margin-bottom:12px;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;

}
.office-prez-term{

}
.office-prez-title{

  margin-bottom:12px;

.office-prez-holder{

  line-height:1;

.office-prez-name{ font-size:24px !important; }
.office-prez-empty{

.office-staff{

}
.office-staff-cell{

}

.office-staff-role{

}
.office-staff-holder{

  font-size:14.5px;
  color:var(--ink);
  margin-bottom:5px;
}
.office-staff-term{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.3px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}

.mandate{
  background:var(--ink);
  border:3px solid var(--ink);
  padding:28px 32px 30px;
  position:relative;
}
.mandate-label{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}
.mandate-tag{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--ink);

}
.mandate-rule{ flex:1; height:2px; background:var(--yellow); opacity:.4; }
.mandate-body{

}
.mandate-body strong{

  color:var(--ink);

  text-transform:uppercase;

}

.council-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);

}
.council-rep{
  display:grid;
  grid-template-columns:8px 1fr;
  border:2px solid var(--ink);

}
.council-rep.open{ background:var(--paper-2); }
.council-rep-bar{ background:var(--ink); }
.council-rep-body{ padding:16px 20px; }
.council-rep-house{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.06em;
  text-transform:uppercase;
  line-height:1;
  margin-bottom:4px;

}
.council-rep-role{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}
.council-rep-holder{
  font-family:var(--sans);
  font-size:14px;
  color:var(--ink);
  margin-bottom:4px;
}
.council-rep-term{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.3px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
}

.committee-list{
  border:2px solid var(--ink);
  background:var(--paper);
}
.committee-row{
  display:grid;
  grid-template-columns:1fr 1.4fr auto;
  gap:14px;
  align-items:center;
  padding:12px 20px;

}
.committee-row:last-child{ border-bottom:none; }
.committee-row:nth-child(even){ background:var(--paper-2); }
.committee-role{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.2;
  color:var(--ink);
}
.committee-holder{ font-family:var(--sans); font-size:14px; color:var(--ink); }
.committee-stamp{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.3px;
  padding:4px 9px;
  font-weight:700;
  text-transform:uppercase;
  background:var(--yellow);
  color:var(--ink);
  white-space:nowrap;
  flex-shrink:0;
}
.committee-stamp.open{
  background:transparent;
  color:var(--faint);

@media (max-width: 860px){
  .gov-wrap{ padding:22px; gap:18px; }
  .office-prez{ padding:20px 22px; }
  .office-prez-title{ font-size:32px; }
  .office-staff{ grid-template-columns:1fr; }
  .office-staff-cell + .office-staff-cell{ border-left:none; border-top:2px solid var(--ink); }
  .council-grid{ grid-template-columns:1fr; }
  .committee-row{ grid-template-columns:1fr; gap:6px; padding:14px 18px; position:relative; }
  .committee-stamp{ position:absolute; top:14px; right:18px; }
}

/* ════════════════════════════════════════════════════════════════════════
   GLOBAL SEARCH
   ════════════════════════════════════════════════════════════════════════ */
.gs-overlay{
  position:fixed;
  inset:0;
  background:rgba(14,14,16,.85);
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:60px 20px 20px;
  overflow-y:auto;
}
.gs-panel{
  width:100%;
  max-width:760px;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:10px 10px 0 var(--red);
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 80px);
}
.gs-panel-hd{
  background:var(--ink);
  border-bottom:4px solid var(--yellow);
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}
.gs-panel-icon{ color:var(--yellow); font-size:20px; }
.gs-panel-input{
  flex:1;
  font-family:var(--sans);
  font-size:16px;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  padding:6px 0;
}
.gs-panel-input::placeholder{ color:rgba(255,255,255,.4); }
.gs-panel-close{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  padding:6px 10px;
  background:transparent;
  border:1.5px solid rgba(255,255,255,.3);
  color:rgba(255,255,255,.7);
  cursor:pointer;
}
.gs-panel-close:hover{ border-color:var(--yellow); color:var(--yellow); }
.gs-panel-count{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--ink);
  background:var(--yellow);
  padding:6px 14px;
  border-bottom:2px solid var(--ink);
}
.gs-panel-body{
  flex:1;
  overflow-y:auto;
  background:var(--paper);
}
.gs-empty{
  padding:48px 24px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--faint);
}
.gs-empty-icon{
  font-size:48px;
  color:var(--rule-soft);
  margin-bottom:8px;
}
.gs-group{ border-bottom:1px solid var(--rule-faint); }
.gs-group:last-child{ border-bottom:none; }
.gs-group-hd{
  background:var(--paper-2);
  padding:7px 18px;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--rule-faint);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.gs-group-count{ font-family:var(--mono); font-size:10px; color:var(--faint); }
.gs-result{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:11px 18px;
  border-bottom:1px solid var(--rule-faint);
  cursor:pointer;
  background:transparent;
  border-left:none; border-right:none; border-top:none;
  text-align:left;
  font-family:inherit;
  width:100%;
}
.gs-result:last-child{ border-bottom:none; }
.gs-result:hover, .gs-result:focus-visible{
  background:#fff5d4;
  outline:none;
}
.gs-result-main{ min-width:0; }
.gs-result-label{
  font-family:var(--sans);
  font-weight:700;
  color:var(--ink);
  font-size:14px;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.gs-result-sub{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-transform:uppercase;
}
.gs-result-kind{
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  background:var(--ink);
  color:var(--yellow);
  padding:3px 8px;
  align-self:start;
  white-space:nowrap;
}

.footer-brand{

}

  letter-spacing:1.8px;

.footer-meta{

/* ════════════════════════════════════════════════════════════════════════

.ico{

/* ════════════════════════════════════════════════════════════════════════
   PROG-PHASES — Cradle phases (lore: cradle, formalised)

  margin-top:24px;
}
.prog-phase{
  background:var(--paper-2);

  border-top:8px solid var(--red);
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.prog-phase:nth-child(2){ border-top-color:var(--yellow-deep); }
.prog-phase:nth-child(3){ border-top-color:var(--blue); }
.prog-phase:nth-child(4){ border-top-color:#54545c; background:var(--paper-3); }
.prog-phase-era{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--muted);
}
.prog-phase-name{
  font-family:var(--display);
  font-size:36px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  color:var(--ink);
  font-weight:400;
  margin-top:2px;
}
.prog-phase-years{
  font-family:var(--sans);
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;

.prog-phase-body{

  font-size:14px;
  line-height:1.65;

}
.prog-phase-body strong{ color:var(--ink); font-weight:700; }
.prog-phase-body em{
  font-style:normal;
  background:var(--yellow);
  color:var(--ink);
  padding:1px 5px;
  font-weight:600;
}
.prog-phase-stat{
  margin-top:auto;
  padding:10px 12px;
  background:var(--ink);

  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.4px;
  text-transform:uppercase;
}
.prog-phase-stat-k{ color:var(--yellow); margin-right:6px; }

@media (max-width: 720px){
  .prog-phases{ grid-template-columns:1fr; }

/* ════════════════════════════════════════════════════════════════════════
   CASE — Cassandra incident: stats grid + diptych comparison + dossier
   ════════════════════════════════════════════════════════════════════════ */
.case-stats{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:0;
  border:2px solid var(--ink);
  margin-top:18px;
}
.case-stat{
  padding:24px 22px 22px;
  border-right:2px solid var(--ink);
  background:var(--paper-2);
}
.case-stat:last-child{ border-right:none; }
.case-stat:nth-child(2){ background:var(--ink); color:#fff; }
.case-stat:nth-child(2) .case-stat-l{ color:var(--yellow); }
.case-stat-n{
  font-family:var(--display);
  font-size:54px;
  letter-spacing:.02em;
  line-height:.95;
  color:var(--red);
  font-weight:400;
  margin-bottom:8px;
}
.case-stat:nth-child(2) .case-stat-n{ color:#fff; }
.case-stat-l{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  line-height:1.3;
}

@media (max-width: 720px){
  .case-stats{ grid-template-columns:repeat(2, 1fr); }
  .case-stat{ border-bottom:2px solid var(--ink); }
  .case-stat:nth-child(2){ border-right:none; }
  .case-stat:nth-child(3){ border-right:2px solid var(--ink); }
  .case-stat:nth-child(n+3){ border-bottom:none; }
}

.case-diptych{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  border:2px solid var(--ink);
  margin-top:18px;
}
.case-col{
  padding:24px 26px 22px;
  background:var(--paper);
}
.case-col:first-child{
  border-right:2px solid var(--ink);
  background:var(--paper-2);
}
.case-col:last-child{
  background:var(--ink);
  color:#fff;
}
.case-col-tag{
  display:inline-block;
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  padding:5px 10px;
  margin-bottom:14px;
}
.case-col:first-child .case-col-tag{
  background:var(--ink);
  color:#fff;
}
.case-col:last-child .case-col-tag{
  background:var(--red);
  color:#fff;
}
.case-col-h{
  font-family:var(--display);
  font-size:28px;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1.05;
  margin-bottom:14px;
  font-weight:400;
}
.case-col:first-child .case-col-h{ color:var(--ink); }
.case-col:last-child .case-col-h{ color:#fff; }
.case-col-h em{
  font-style:normal;
  font-weight:400;
  color:var(--yellow);
}
.case-col-p{
  font-family:var(--sans);
  font-size:14px;
  line-height:1.65;
  margin:0 0 12px;
}
.case-col-p:last-child{ margin-bottom:0; }
.case-col:first-child .case-col-p{ color:var(--ink); }
.case-col:last-child .case-col-p{ color:rgba(255,255,255,.85); }
.case-col-p strong{ font-weight:700; }
.case-col:first-child .case-col-p strong{ color:var(--ink); }
.case-col:last-child .case-col-p strong{ color:var(--yellow); }
.case-col-p em{
  font-style:normal;
  font-weight:600;
}
.case-col:first-child .case-col-p em{
  background:var(--yellow);
  color:var(--ink);
  padding:1px 5px;
}
.case-col:last-child .case-col-p em{
  color:var(--yellow);
  background:transparent;
  padding:0;
}

@media (max-width: 760px){
  .case-diptych{ grid-template-columns:1fr; }
  .case-col:first-child{ border-right:none; border-bottom:2px solid var(--ink); }
}

.case-dossier{
  background:var(--paper);
  border:3px solid var(--ink);
  position:relative;
  margin-top:8px;
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  CALDERYN × STRATA — DARK THEME OVERRIDE                                ║
   ║  Notion-meets-Marvel. Dark canvas, crimson + gold + chrome.             ║
   ║  Fraunces editorial display, Inter body. Subtle halftone on heroes.     ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

:root{
  /* ─── canvas & surfaces (was cream — now refined dark) ─── */
  --paper:       #0c0c10;
  --paper-2:     #121218;
  --paper-3:     #181820;
  --paper-4:     #20202a;

  /* ─── ink scale (still dark — used for masthead, heroes, deep slabs) ─── */
  --ink:         #07070a;
  --ink-2:       #0e0e14;
  --ink-3:       #1a1a22;
  --ink-soft:    #25252f;

  /* ─── borders ─── */
  --rule:        #34343f;
  --rule-soft:   #2a2a34;
  --rule-faint:  #1c1c24;

  /* ─── text on dark ─── */
  --text:        #f1ede4;
  --text-mid:    #b8b3a8;
  --text-low:    #7a766d;
  --muted:       #b0aca2;
  --faint:       #6e6a62;

  /* ─── Calderyn shield: crimson + gold ─── */
  --red:         #c11a2c;
  --red-deep:    #7d1018;
  --red-bright:  #e4324a;
  --yellow:      #d4a84a;
  --yellow-deep: #8a6a25;
  --gold-bright: #f1cd72;

  /* ─── Strata: silver / chrome ─── */
  --silver:      #c9cdd3;
  --silver-bright:#e8ebf0;
  --silver-dim:  #6e7079;

  /* ─── Houses, rebalanced for dark ─── */
  --h-valaris:   #e63946;
  --h-orenne:    #e8b14a;
  --h-saberis:   #4ab866;
  --h-grimere:   #5b85d6;

  /* ─── motion ─── */
  --ease:        cubic-bezier(.22,1,.36,1);
  --dur-fast:    140ms;
  --dur:         220ms;
  --dur-slow:    360ms;

  /* ─── editorial display family ─── */
  --serif:       'Fraunces', 'Iowan Old Style', 'Georgia', serif;
}

/* ─── canvas reset ─── */
html, body{ background:var(--paper); }
body{
  color:var(--text);
  font-family:var(--sans);
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1,"ss01" 1;
}
.page{ background:var(--paper); }
.pg{ background:var(--paper); color:var(--text); }

::selection{ background:var(--gold-bright); color:var(--ink); }
::-moz-selection{ background:var(--gold-bright); color:var(--ink); }

*{ scrollbar-color:#2a2a34 transparent; }
*::-webkit-scrollbar-thumb{ background:#2a2a34; border-radius:8px; }
*::-webkit-scrollbar-thumb:hover{ background:var(--gold); background:var(--yellow); }

*:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }

/* ─── halftone & noise utilities (subtle Marvel feel without being loud) ─── */
.halftone, .pg-hd, .lore-block.lore-intro, .about-bay, .join-confirm{ position:relative; }
.halftone::before,
.pg-hd::after,
.lore-block.lore-intro::after,
.about-bay::after,
.join-confirm::after{
  content:"";
  position:absolute; inset:0;
  background-image: radial-gradient(rgba(212,168,74,.12) 1px, transparent 1.4px);
  background-size: 14px 14px;
  background-position: 0 0;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.55;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  z-index:0;
}
.pg-hd-inner, .lore-block.lore-intro > *, .about-bay > *, .join-confirm > *{ position:relative; z-index:1; }

/* ════════════════════════════════════════════════════════════════════════
   MASTHEAD — refined dark glass with Calderyn crest + Strata mark
   ════════════════════════════════════════════════════════════════════════ */
.masthead{
  background:linear-gradient(180deg, #0a0a0e 0%, #0e0e14 100%);
  border-bottom:1px solid var(--rule-soft);
  box-shadow:0 1px 0 rgba(212,168,74,.18), 0 18px 32px -28px rgba(0,0,0,.9);
}
.mast-inner{ height:84px; gap:28px; padding:0 28px; max-width:1680px; }

.mast-brand{ gap:14px; }
.mast-brand-mark{
  background:transparent !important;
  width:60px; height:60px;
  padding:0; border:none;
  font-size:0 !important;
  color:transparent !important;
  background-image:url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png') !important;
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
  filter:drop-shadow(0 4px 14px rgba(193,26,44,.35));
  transition:transform var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.mast-brand-mark::after{ display:none; }
.mast-brand:hover .mast-brand-mark{ transform:translateY(-1px) scale(1.02); filter:drop-shadow(0 6px 18px rgba(212,168,74,.45)); }

.mast-brand-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:23px;
  letter-spacing:.005em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1;
}
.mast-brand-sub{
  color:var(--silver-dim);
  font-size:9.5px;
  letter-spacing:2.2px;
  font-weight:600;
}
.mast-brand-sub::before{ content:"◆ "; color:var(--gold); margin-right:4px; }

/* Strata logo lockup, slotted to the right of meta */
.mast-meta{ gap:18px; }
.mast-meta-cell{
  font-size:9.5px;
  letter-spacing:1.8px;
  color:var(--text-low);
}
.mast-meta-cell strong{ color:var(--text); }
.mast-meta-cell .dot{ background:var(--gold); width:5px; height:5px; }
.mast-meta-cell .dot.live{
  background:var(--red-bright);
  box-shadow:0 0 0 0 rgba(228,50,74,.55);
}
.mast-meta-sep{ color:rgba(255,255,255,.08); }

.mast-search{
  background:rgba(255,255,255,.025);
  border:1px solid var(--rule-soft);
  color:var(--text-mid);
  border-radius:10px;
  padding:10px 14px;
  min-width:300px;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.mast-search:hover, .mast-search:focus-visible{
  border-color:var(--gold);
  background:rgba(212,168,74,.06);
  color:var(--text);
}
.mast-search-icon{ color:var(--gold); }
.mast-search-kbd{
  background:rgba(255,255,255,.04);
  color:var(--silver);
  border:1px solid var(--rule-soft);
  border-radius:4px;
  font-size:10px;
}

/* Strata mark — slotted into masthead right edge */
.mast-strata{
  display:flex;
  align-items:center;
  gap:10px;
  padding-left:18px;
  border-left:1px solid var(--rule-soft);
  flex-shrink:0;
}
.mast-strata-logo{
  width:42px; height:42px;
  background:url('https://i.ibb.co/mrTBNDkc/output-onlinepngtools-1.png') center/contain no-repeat;
  filter:drop-shadow(0 2px 8px rgba(201,205,211,.25));
  transition:transform var(--dur) var(--ease);
}
.mast-strata:hover .mast-strata-logo{ transform:scale(1.05); }
.mast-strata-text{ display:flex; flex-direction:column; line-height:1; gap:3px; }
.mast-strata-name{
  font-family:var(--display);
  font-size:13px;
  letter-spacing:.18em;
  color:var(--silver-bright);
  font-weight:400;
}
.mast-strata-sub{
  font-family:var(--mono);
  font-size:8.5px;
  letter-spacing:1.6px;
  color:var(--silver-dim);
  text-transform:uppercase;
  font-weight:600;
}

@media (max-width:900px){
  .mast-meta, .mast-strata{ display:none; }
  .mast-search{ min-width:0; }
}

/* ════════════════════════════════════════════════════════════════════════
   TABS — quieter, more elegant nav
   ════════════════════════════════════════════════════════════════════════ */
.tabs{
  background:rgba(10,10,14,.92);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule-soft);
}
.tabs-inner{ max-width:1680px; padding:0 14px; }
.tab{
  color:var(--text-low);
  font-weight:600;
  font-size:12.5px;
  letter-spacing:.08em;
  padding:0 18px;
  height:52px;
  border-radius:0;
  transition:color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tab-num{
  color:var(--gold);
  font-size:9.5px;
  opacity:.55;
}
.tab:hover{ color:var(--text); background:rgba(255,255,255,.03); }
.tab:hover .tab-num{ opacity:.9; color:var(--gold-bright); }
.tab.on{ color:var(--text); background:transparent; }
.tab.on .tab-num{ color:var(--gold-bright); opacity:1; }
.tab.on::after{
  height:2px;
  background:linear-gradient(90deg, var(--red), var(--gold));
  bottom:0;
}

/* ════════════════════════════════════════════════════════════════════════
   SUB-NAV
   ════════════════════════════════════════════════════════════════════════ */
.subnav{
  background:rgba(14,14,20,.94);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--rule-soft);
}
.subnav-inner{ max-width:1680px; padding:0 14px; }
.subnav-btn{
  color:var(--text-low);
  font-weight:600;
  font-size:12.5px;
  padding:0 18px;
  transition:color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.subnav-btn:hover{ color:var(--text); background:rgba(255,255,255,.03); }
.subnav-btn.on{ color:var(--text); background:transparent; }
.subnav-btn.on::after{
  height:2px;
  background:var(--gold);
}
.subnav-btn .sn-sub{ color:var(--text-low); font-weight:500; }
.subnav-btn.on .sn-sub{ color:var(--silver); }

/* ════════════════════════════════════════════════════════════════════════
   PAGE-HEAD — editorial dark hero, halftone wash
   ════════════════════════════════════════════════════════════════════════ */
.pg-hd{
  background:
    radial-gradient(1200px 600px at 90% -100%, rgba(193,26,44,.20), transparent 60%),
    radial-gradient(1200px 600px at -20% 120%, rgba(212,168,74,.10), transparent 60%),
    linear-gradient(180deg, #0a0a0e 0%, #0f0f15 100%);
  border-bottom:1px solid var(--rule-soft);
}
.pg-hd::before{ display:none; }
.pg-hd-inner{
  max-width:1680px;
  padding:64px 40px 56px;
  gap:48px;
}
.pg-hd-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.pg-hd-stamp-mark{ color:var(--red-bright); }
.pg-hd h2{
  font-family:var(--serif);
  font-weight:500;
  font-size:64px;
  line-height:1.02;
  letter-spacing:-.018em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1,"ss02" 1;
}
.pg-hd-accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.pg-hd p{
  color:var(--text-mid);
  font-size:16px;
  line-height:1.7;
  max-width:640px;
}
.pg-hd p strong{ color:var(--text); }
.pg-hd-note{
  color:var(--silver);
  border-left-color:var(--gold);
  font-size:10.5px;
  letter-spacing:1.6px;
}
.pg-hd-note.warn{ color:#f9b3b8; border-left-color:var(--red-bright); }

@media (max-width:900px){
  .pg-hd-inner{ padding:44px 22px 36px; }
  .pg-hd h2{ font-size:42px; }
}

/* ════════════════════════════════════════════════════════════════════════
   LORE — editorial dark, serif display, refined body
   ════════════════════════════════════════════════════════════════════════ */
.lore{ background:var(--paper); }
.lore-block{
  border-bottom:1px solid var(--rule-faint);
  max-width:1680px;
  padding:64px 40px;
}

/* full-bleed dark hero */
.lore-block.lore-intro{
  background:
    radial-gradient(900px 500px at 85% -50%, rgba(193,26,44,.18), transparent 60%),
    radial-gradient(800px 500px at 0% 130%, rgba(212,168,74,.08), transparent 60%),
    linear-gradient(180deg, #0a0a0e 0%, #0e0e14 100%);
  border-bottom:1px solid var(--rule-soft);
  padding-top:80px;
  padding-bottom:64px;
}
.lore-block.lore-intro > *{ max-width:1680px; padding-left:40px; padding-right:40px; }

.lore-intro-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.lore-intro-title{
  font-family:var(--serif);
  font-weight:500;
  font-size:76px;
  line-height:1.0;
  letter-spacing:-.022em;
  text-transform:none;
  color:var(--text);
  max-width:1100px;
  font-feature-settings:"ss01" 1;
}
.lore-intro-title .accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.lore-lead{
  font-size:18px;
  line-height:1.75;
  color:var(--text-mid);
  max-width:760px;
  font-weight:400;
}
.lore-lead strong{ color:var(--text); font-weight:600; }
.lore-lead em{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  background:transparent;
  padding:0;
}

.lore-eyebrow{
  color:var(--gold);
  border-bottom:none;
  font-size:10px;
  letter-spacing:2px;
  padding:0;
  margin-bottom:14px;
}
.lore-eyebrow::before{ content:"◆ "; color:var(--red-bright); margin-right:4px; }

.lore-h{
  font-family:var(--serif);
  font-weight:500;
  font-size:44px;
  line-height:1.05;
  letter-spacing:-.015em;
  text-transform:none;
  color:var(--text);
  font-feature-settings:"ss01" 1;
}
.lore-h .accent{
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
}
.lore-p{
  font-size:16px;
  line-height:1.78;
  color:var(--text-mid);
  max-width:760px;
  font-weight:400;
}
.lore-p strong{ color:var(--text); font-weight:600; }
.lore-p em{
  background:transparent;
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  padding:0;
}

@media (max-width:720px){
  .lore-block{ padding:40px 22px; }
  .lore-block.lore-intro > *{ padding-left:22px; padding-right:22px; }
  .lore-intro-title{ font-size:42px; }
  .lore-h{ font-size:30px; }
}

/* Vanguard cards */
.lore-vanguard{ gap:20px; }
.lore-vg{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-top:3px solid var(--vg-color, var(--gold));
  border-radius:14px;
  padding:28px;
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.lore-vg:hover{
  transform:translateY(-2px);
  box-shadow:0 28px 60px -32px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-vg-alias{
  font-family:var(--serif);
  font-weight:600;
  font-size:34px;
  letter-spacing:-.01em;
  text-transform:none;
  color:var(--text);
}
.lore-vg-name{
  color:var(--vg-color, var(--gold));
  font-size:11px;
  letter-spacing:1.6px;
}
.lore-vg-tag{
  color:var(--text-low);
  border-top-color:var(--rule-soft);
  font-weight:500;
}
.lore-vg-desc{
  color:var(--text-mid);
  font-size:14.5px;
  line-height:1.72;
}

/* House cards */
.lore-house{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-top:3px solid var(--h-color, var(--gold));
  border-radius:14px;
  padding:28px;
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.lore-house:hover{
  transform:translateY(-2px);
  box-shadow:0 28px 60px -32px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-house-hd{ border-bottom-color:var(--rule-soft); }
.lore-house-virtue{ color:var(--h-color, var(--gold)); font-size:10px; letter-spacing:1.8px; }
.lore-house-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:34px;
  letter-spacing:-.01em;
  text-transform:none;
  color:var(--text);
}
.lore-house-namesake{ color:var(--text-low); font-weight:500; }
.lore-house-desc{ color:var(--text-mid); font-size:14.5px; line-height:1.72; }
.lore-house-desc em{
  background:transparent;
  color:var(--gold-bright);
  font-style:italic;
  font-weight:400;
  padding:0;
}

/* House at a glance */
.house-glance{ background:var(--paper-2); }

/* ════════════════════════════════════════════════════════════════════════
   RULES grid — refined
   ════════════════════════════════════════════════════════════════════════ */
.rule{
  background:var(--paper-2);
  border:1px solid var(--rule-soft);
  border-radius:12px;
  overflow:hidden;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.rule:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4);
  box-shadow:0 18px 40px -32px rgba(0,0,0,.9);
}
.rule-num{
  background:linear-gradient(180deg, var(--red), var(--red-deep));
  color:var(--text);
  font-family:var(--serif);
  font-weight:600;
}
.rule-title{ color:var(--text); font-weight:700; font-size:15.5px; }
.rule-text{ color:var(--text-mid); font-size:14px; line-height:1.7; }

/* About-this-RP bay */
.about-bay{
  background:
    radial-gradient(600px 300px at 100% 0%, rgba(212,168,74,.10), transparent 60%),
    linear-gradient(180deg, var(--paper-2), var(--paper-3));
  border:1px solid var(--rule-soft);
  border-left:3px solid var(--gold);
  border-radius:12px;
  padding:32px 36px;
}
.about-bay-stamp{
  background:transparent;
  color:var(--gold);
  border:1px solid rgba(212,168,74,.4);
  border-radius:999px;
  padding:5px 12px;
  font-size:10px;
  letter-spacing:2px;
}
.about-bay-text{ color:var(--text-mid); font-size:14.5px; line-height:1.75; }
.about-bay-text-quiet{ color:var(--text-low); font-size:12.5px; }

/* ════════════════════════════════════════════════════════════════════════
   TABLES — dark, readable, restrained
   ════════════════════════════════════════════════════════════════════════ */
.tw{ background:var(--paper-2); border:1px solid var(--rule-soft); border-radius:12px; overflow:hidden; }
table{ background:transparent; }
thead, thead tr th{
  background:var(--ink-2) !important;
  color:var(--silver) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  font-size:10.5px;
  letter-spacing:1.6px;
  font-weight:700;
}
tbody td{
  background:transparent;
  color:var(--text-mid);
  border-bottom:1px solid var(--rule-faint);
  font-size:14px;
}
tbody tr:nth-child(even) td{ background:rgba(255,255,255,.012); }
tbody tr:hover td{ background:rgba(212,168,74,.06); color:var(--text); }
tbody tr:last-child td{ border-bottom:none; }

.sec-row td{
  background:linear-gradient(90deg, var(--red-deep), var(--red)) !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-weight:600 !important;
  font-size:17px !important;
  text-transform:none !important;
  letter-spacing:-.005em !important;
  padding:14px 20px !important;
}
.sub-row td{
  background:var(--paper-3) !important;
  color:var(--silver) !important;
  border-top:1px solid var(--rule-soft) !important;
  border-bottom:1px solid var(--rule-soft) !important;
  font-size:13px !important;
  line-height:1.65 !important;
}

.rn{ color:var(--text-low); }

/* ════════════════════════════════════════════════════════════════════════
   PRIMITIVES — links, chips, badges, tier pills
   ════════════════════════════════════════════════════════════════════════ */
a.clink{
  color:var(--text);
  border-bottom:1px solid rgba(212,168,74,.5);
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
a.clink:hover{ color:var(--gold-bright); border-bottom-color:var(--gold-bright); }
span.cname{ color:var(--text); }

.empty{ color:var(--text-low); }
.empty::before{ background:var(--rule); }

.npc-badge{
  background:rgba(212,168,74,.12);
  color:var(--gold-bright);
  border:1px solid rgba(212,168,74,.3);
  border-radius:4px;
}

.chip{ border-radius:4px; font-weight:600; letter-spacing:1.4px; }
.chip-ink{ background:var(--ink-3); color:var(--silver); border:1px solid var(--rule-soft); }
.chip-yellow{ background:var(--gold); color:var(--ink); }
.chip-red{ background:var(--red); color:var(--text); }
.chip-gold{ background:var(--gold-bright); color:var(--ink); }
.chip-ghost{
  background:transparent;
  color:var(--text-mid);
  border:1px solid var(--rule-soft);
}
.chip-classified{ background:var(--red); color:var(--text); }

.tier-pill{ border-radius:4px; }

.house-cell-name{ color:var(--text); }
.hdot{ border:2px solid var(--ink); }

.track-tag{ border-radius:4px; }
.track-tag-hero{ background:var(--red); color:var(--text); }
.track-tag-sidekick{ background:var(--ink-3); color:var(--gold); border:1px solid var(--rule-soft); }
.track-tag-empty{ color:var(--text-low); }

/* ════════════════════════════════════════════════════════════════════════
   FOOTER — editorial dark with Strata mark
   ════════════════════════════════════════════════════════════════════════ */
.footer{
  background:linear-gradient(180deg, #07070b 0%, #050508 100%);
  border-top:1px solid var(--rule-soft);
  color:var(--text-mid);
  margin-top:40px;
  padding:48px 0 36px;
  position:relative;
}
.footer::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(212,168,74,.4), transparent);
}
.footer-inner{
  max-width:1680px;
  margin:0 auto;
  padding:0 40px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:48px;
  align-items:flex-start;
}
.footer-brand{
  font-family:var(--serif) !important;
  font-weight:600;
  font-size:30px;
  letter-spacing:-.01em;
  color:var(--text);
  text-transform:none !important;
  margin-bottom:6px;
}
.footer-line{

@media (max-width:720px){

}

/* ════════════════════════════════════════════════════════════════════════
   GLOBAL TEXT-COLOR OVERRIDES — flip components that hardcoded
   color:var(--ink) on previously cream surfaces
   ════════════════════════════════════════════════════════════════════════ */
.section-wrap, .section-wrap-tight, .section-wrap-wide{ color:var(--text); }

/* Generic "card" surfaces and panels — gentle dark elevation */
.club, .club-card, .group, .gov, .strc, .case, .bay, .curr, .kb-team,
.cp-rgroup, .club-side-panel{
  background:var(--paper-2) !important;
  border-color:var(--rule-soft) !important;
  color:var(--text);
}

/* Hide the original masthead red bottom border (replaced by gold gradient) */
.masthead{ border-bottom-color:var(--rule-soft); }

/* Page-enter animation, smoother.
   Note: transform on an ancestor of a sticky element creates a containing
   block that can break sticky behaviour (the sticky element sticks within
   the transformed ancestor rather than the viewport). Use opacity only. */
@keyframes page-enter{
  from{ opacity:0; }
  to{ opacity:1; }
}
.pg{ animation:page-enter .4s var(--ease); }

/* Generic h1/h2/h3 default — serif everywhere except where explicitly set */
h1,h2,h3,h4{ color:var(--text); }
strong{ color:var(--text); }
em{ color:var(--gold-bright); font-style:italic; }

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  WAVE 2 — CONTRAST FIXES, COMIC PUSH, DEAN PORTRAIT, CREST WATERMARK    ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* ─── 1. Dean portrait inside lore-intro ─── */
.lore-intro-portrait{ padding-top:64px; padding-bottom:56px; }
.lore-intro-portrait-wrap{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:48px;
  align-items:center;
}
.lore-intro-portrait-text{ min-width:0; }
.lore-intro-portrait-fig{
  position:relative;
  margin:0;
  aspect-ratio:3/4;
  background:linear-gradient(180deg, #14141a, #08080b);
  border:1px solid var(--rule-soft);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(212,168,74,.18);
}
.lore-intro-portrait-fig::after{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(193,26,44,.18) 1px, transparent 1.5px);
  background-size:6px 6px;
  mix-blend-mode:screen;
  opacity:.45;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
  pointer-events:none;
}
.lore-intro-portrait-fig img{
  width:100%; height:100%;
  object-fit:cover;
  object-position:center top;
  filter:contrast(1.05) saturate(.92);
}
.lore-intro-portrait-fig figcaption{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:18px 22px 16px;
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.92) 60%);
  display:flex; flex-direction:column; gap:2px;
}
.lore-intro-portrait-cap{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:700;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--gold);
}
.lore-intro-portrait-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:20px;
  letter-spacing:-.01em;
  color:var(--text);
}
@media (max-width:900px){
  .lore-intro-portrait-wrap{ grid-template-columns:1fr; gap:28px; }
  .lore-intro-portrait-fig{ max-width:340px; aspect-ratio:4/5; }
}

/* ─── 2. Calderyn crest watermark on Lore world hero ─── */
.lore-intro-crest{ overflow:hidden; }
.lore-intro-crest-watermark{
  position:absolute;
  right:-60px; top:50%;
  transform:translateY(-50%);
  width:520px;
  max-width:55%;
  opacity:.085;
  filter:drop-shadow(0 20px 40px rgba(193,26,44,.4));
  pointer-events:none;
  user-select:none;
  z-index:0;
}
.lore-intro-crest > *:not(.lore-intro-crest-watermark){ position:relative; z-index:1; }
@media (max-width:900px){
  .lore-intro-crest-watermark{ right:-120px; opacity:.06; width:440px; }
}

/* Also drop a faint crest into every page-head as a watermark */
.pg-hd::after{
  background-image:
    url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png'),
    radial-gradient(rgba(212,168,74,.12) 1px, transparent 1.4px);
  background-size: 360px auto, 14px 14px;
  background-position: calc(100% - 32px) center, 0 0;
  background-repeat: no-repeat, repeat;
  opacity:.85;
  mix-blend-mode:normal;
  mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
             linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  -webkit-mask-image:linear-gradient(90deg, transparent 50%, rgba(0,0,0,.9) 100%),
                     linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.15) 70%, transparent);
  filter:saturate(.6) brightness(.7);
}
.pg-hd-inner{ position:relative; z-index:1; }

/* ─── 3. CONTRAST FIXES — kill all #fff5d4 cream hovers; force readable text ─── */
tbody tr:hover td,
.house-glance-tbl tbody tr:nth-child(even),
.class-chip-btn:not(:disabled):hover,
.class-chip.is-open .class-chip-btn,
.freg-row.is-clickable:hover,
.freg-row.is-open,
.preg-row.is-clickable:hover,
.preg-row.is-open,
.club-filter-pill:hover,
.club-filter-pill.on{
  background:rgba(212,168,74,.10) !important;
  color:var(--text) !important;
}
.freg-row.is-open, .preg-row.is-open{
  background:rgba(212,168,74,.06) !important;
}

/* Anything still rendering on a hardcoded #fff or near-white */
[style*="background:#fff"]:not(input):not(select):not(textarea),
[style*="background: #fff"]:not(input):not(select):not(textarea){
  background:var(--paper-2) !important;
  color:var(--text) !important;
}

/* Tier-pill #555 fallback → readable */
.tier-pill{
  color:var(--text) !important;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}

/* Form inputs — keep them dark, readable */
.join-input, .join-select, .join-textarea{
  background:var(--paper-3) !important;
  color:var(--text) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  padding:11px 13px !important;
  font-family:var(--sans) !important;
  font-size:14px !important;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.join-input:focus, .join-select:focus, .join-textarea:focus{
  border-color:var(--gold) !important;
  background:var(--paper-2) !important;
  outline:none !important;
}
.join-input::placeholder, .join-textarea::placeholder{ color:var(--text-low) !important; }
.join-select option{ background:var(--paper-2); color:var(--text); }

/* Form labels and field chrome */
.join-field-label, .join-step-tag, .join-step-title, .join-step-blurb{
  color:var(--text);
}
.join-step-title{
  font-family:var(--serif) !important;
  font-weight:600 !important;
  background:transparent !important;
  font-size:28px !important;
  letter-spacing:-.01em !important;
}
.join-step-blurb{ color:var(--text-mid); }
.join-step-tag{
  color:var(--gold) !important;
  background:transparent !important;
  border:1px solid rgba(212,168,74,.4) !important;
  border-radius:999px !important;
  padding:5px 12px !important;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:2px;
  font-weight:600;
}
.join-checkbox{ color:var(--text-mid); }
.join-checkbox input[type="checkbox"]{ accent-color:var(--gold); }

/* Type-grid (step 1 picker buttons) */
.join-type-card, .join-typegrid > button{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  color:var(--text) !important;
  border-radius:14px !important;
  padding:22px !important;
  text-align:left !important;
  cursor:pointer;
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.join-type-card:hover, .join-typegrid > button:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4) !important;
  box-shadow:0 18px 40px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(212,168,74,.15);
}
.join-type-card.on, .join-typegrid > button.on{
  border-color:var(--gold) !important;
  background:linear-gradient(180deg, rgba(193,26,44,.18), var(--paper-2)) !important;
  box-shadow:0 0 0 1px var(--gold), 0 18px 40px -28px rgba(193,26,44,.5);
}

/* Submit button → comic-style red with gold border */
.join-submit{
  background:linear-gradient(180deg, var(--red-bright), var(--red)) !important;
  color:var(--text) !important;
  border:2px solid var(--gold) !important;
  border-radius:8px !important;
  font-family:var(--sans);
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:13px 24px !important;
  cursor:pointer;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  box-shadow:0 6px 0 0 var(--red-deep), 0 18px 40px -20px rgba(193,26,44,.5);
}
.join-submit:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 8px 0 0 var(--red-deep), 0 22px 50px -20px rgba(193,26,44,.65);
}
.join-submit:active:not(:disabled){ transform:translateY(2px); box-shadow:0 4px 0 0 var(--red-deep); }
.join-submit:disabled{
  background:var(--paper-3) !important;
  color:var(--text-low) !important;
  border-color:var(--rule-soft) !important;
  box-shadow:none;
  cursor:not-allowed;
}
.join-cancel{
  color:var(--text-mid) !important;
  border:1px solid var(--rule-soft) !important;
  border-radius:8px !important;
  background:transparent !important;
}
.join-cancel:hover{ border-color:var(--gold) !important; color:var(--text) !important; }

.join-confirm{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2)) !important;
  border:1px solid var(--rule-soft) !important;
  border-left:3px solid var(--gold) !important;
  border-radius:14px !important;
  color:var(--text) !important;
}
.join-confirm h3{ color:var(--text) !important; font-family:var(--serif) !important; font-weight:600 !important; }
.join-confirm p{ color:var(--text-mid) !important; }

/* Generic catch-all: any old "cream" surface that isn't masthead/dark */
.bay, .case, .curr, .strc, .gov, .group{
  color:var(--text);
}

/* ─── 4. COMIC PUSH — thicker borders, brighter halftone, panel shadows ─── */

/* Stronger halftone on heroes (was .55, now .8 + larger dots) */
.pg-hd::after{ /* already overridden above with crest */ }
.lore-block.lore-intro::after,
.about-bay::after,
.join-confirm::after{
  background-image: radial-gradient(rgba(212,168,74,.18) 1.4px, transparent 2px);
  background-size: 12px 12px;
  opacity:.7;
}

/* Comic-frame card style for major content cards */
.lore-vg, .lore-house, .rule, .club-card, .club, .group, .case, .gov, .strc, .kb-team, .cp-rgroup{
  border:1px solid var(--rule-soft) !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,.04) inset,
    0 22px 44px -32px rgba(0,0,0,.95);
  position:relative;
}
.lore-vg::before, .lore-house::before, .rule::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.3px);
  background-size:14px 14px;
  pointer-events:none;
  mask-image:linear-gradient(135deg, rgba(0,0,0,.6), transparent 60%);
  -webkit-mask-image:linear-gradient(135deg, rgba(0,0,0,.6), transparent 60%);
  opacity:.5;
}

/* Bigger hero title — more visual weight */
.lore-intro-title{ font-size:84px; }
@media (max-width:900px){ .lore-intro-title{ font-size:48px; } }

/* Tab indicator: thicker comic underline */
.tab.on::after{ height:3px; }

/* Section row in tables — more dramatic comic stamp */
.sec-row td{
  background:linear-gradient(90deg, var(--red-deep) 0%, var(--red) 50%, var(--red-deep) 100%) !important;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
  border-top:1px solid rgba(255,255,255,.08) !important;
  border-bottom:1px solid rgba(0,0,0,.5) !important;
  position:relative;
}

/* Page-head pageNum — comic-style page tag */
.pg-hd-note{
  background:rgba(212,168,74,.06);
  border-left:3px solid var(--gold);
  border-radius:0 6px 6px 0;
  padding:10px 14px 10px 16px;
}

/* "About this RP" gets a thicker comic strip on the left */
.about-bay{ border-left-width:4px !important; }

/* ─── 5. Footer brand mark — keep crest visible ─── */
.footer-brand::before{
  content:"";
  display:inline-block;
  width:28px; height:28px;
  vertical-align:-7px;
  margin-right:10px;
  background:url('https://i.ibb.co/XgCpzmt/calderyn-college-logo-transparent.png') center/contain no-repeat;
}

/* ─── 6. Universal: any remaining low-contrast text ─── */
p, li, span, td, th, label, div { /* don't change everything; only tighten where text-color is unset */ }
.muted, .faint{ color:var(--text-low); }

/* ─── 7. STRATA Overview dashboard ─── */
.strata-overview{
  max-width:1680px;
  margin:0 auto;
  padding:32px 40px 48px;
}
.strata-stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:18px;
  margin-bottom:36px;
}
.strata-stat{
  text-align:left;
  padding:24px 26px;
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));
  border:1px solid var(--rule-soft);
  border-radius:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  color:var(--text);
  transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.strata-stat::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1.4px);
  background-size:14px 14px;
  mask-image:linear-gradient(135deg, rgba(0,0,0,.5), transparent 60%);
  -webkit-mask-image:linear-gradient(135deg, rgba(0,0,0,.5), transparent 60%);
  pointer-events:none;
}
.strata-stat::after{
  content:"";
  position:absolute;
  top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--red), var(--gold));
  transform:scaleX(.4);
  transform-origin:left;
  transition:transform var(--dur) var(--ease);
}
.strata-stat:hover{
  transform:translateY(-2px);
  border-color:rgba(212,168,74,.4);
  box-shadow:0 22px 50px -32px rgba(0,0,0,.95);
}
.strata-stat:hover::after{ transform:scaleX(1); }
.strata-stat-num{
  font-family:var(--serif);
  font-weight:600;
  font-size:54px;
  line-height:1;
  letter-spacing:-.02em;
  color:var(--text);
  margin-bottom:6px;
}
.strata-stat-of{
  font-size:24px;
  color:var(--text-low);
  font-weight:400;
  letter-spacing:0;
  margin-left:4px;
}
.strata-stat-label{
  font-size:14px;
  color:var(--text-mid);

  margin-bottom:10px;
}
.strata-stat-sub{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
}
@media (max-width:900px){ .strata-stats{ grid-template-columns:1fr; } }

.strata-directory{
  background:linear-gradient(180deg, var(--paper-3), var(--paper-2));

}
.strata-directory-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:32px;
  line-height:1.1;
  letter-spacing:-.015em;
  color:var(--text);

}
.strata-directory-blurb{
  color:var(--text-mid);

.strata-crossref{
